  });
  return out;
}
function field(label, inner, hint) { return '<div class="field"><label>' + esc(label) + '</label>' + inner + (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') + '</div>'; }
function textInput(name, value, ph, type) { return '<input name="' + esc(name) + '" value="' + esc(value) + '" placeholder="' + esc(ph || '') + '"' + (type ? ' type="' + type + '"' : ' type="text"') + '>'; }
function numberInput(name, value, ph, step) { return '<input name="' + esc(name) + '" value="' + esc(value) + '" placeholder="' + esc(ph || '') + '" type="number" inputmode="decimal"' + (step ? ' step="' + step + '"' : '') + '>'; }
function areaInput(name, value, ph) { return '<textarea name="' + esc(name) + '" placeholder="' + esc(ph || '') + '">' + esc(value) + '</textarea>'; }
function selectInput(name, value, options) {
  return '<select name="' + esc(name) + '">' + options.map(function (o) { return '<option value="' + esc(o) + '"' + (o === value ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
}

function aiSelect(name, value, options) {

}

/* 真正发起识别 */
function runAiParse(text, images) {
  var cfg = aiConfig();
  var status = document.getElementById('aiStatus');
  var started = Date.now();
  var useVision = images.length > 0;
  var model = useVision ? (cfg.visionModel || cfg.model) : cfg.model;
  if (useVision && !cfg.visionModel) {
    if (!confirm('未设置「图片模型」，将尝试用文本模型识别图片（多数模型不支持）。继续？')) return;
  }
  var tick = setInterval(function () {
    if (status) status.textContent = '识别中… 已用 ' + Math.round((Date.now() - started) / 1000) + ' 秒';
  }, 1000);
  if (status) status.textContent = '识别中… 已用 0 秒';

  /* 组装内容：有图片时用多模态内容块 */
  var content;
  if (useVision) {
    content = [{ type: 'text', text: (text || '请从以下图片中提取患者信息。') }];
    images.forEach(function (im) { content.push({ type: 'image_url', image_url: { url: im.dataUrl } }); });
  } else {
    content = text;
  }

  aiChat(cfg, content, { model: model, maxTokens: 4000 })
    .then(function (out) {
      clearInterval(tick);
      var json = extractJson(out);
      var list = normalizeAiPatients(json);
      if (!list.length) {
        if (status) status.innerHTML = '<span style="color:var(--danger)">未能识别出患者信息。可换个更清晰的图片，或改用更强的模型。</span>' +
          '<br><span class="hint">模型原始输出：' + esc(String(out).slice(0, 300)) + '</span>';
        return;
      }
      aiDraft.patients = list;
      var missCnt = list.filter(function (x) { var m = aiMissingOf(x); return m.count > 0; }).length;
      var noNameCnt = list.filter(function (x) { return aiMissingOf(x).blocking; }).length;
      var t = '识别到 ' + list.length + ' 位';
      if (missCnt) t += '，其中 ' + missCnt + ' 位需补充信息';
      if (noNameCnt) t += '（' + noNameCnt + ' 位缺姓名）';
      toast(t + '，请复核');
      openAiReview();
    })
    .catch(function (err) {
      clearInterval(tick);
      if (status) status.innerHTML = '<span style="color:var(--danger)">识别失败：' + esc(err.message) + '</span>';
    });
}

/* ---------- 复核 ---------- */
function aiDraftKey(i, k) { return 'ai_' + i + '_' + k; }

/* 把用户在复核界面上改动过的值收回草稿。

function syncAiDraftFromSheet() {
  var vals = sheetValues();
  (aiDraft.patients || []).forEach(function (p, i) {
    AI_FIELDS.forEach(function (k) {
      var v = vals[aiDraftKey(i, k)];
      if (v !== undefined) p[k] = String(v == null ? '' : v).trim();
    });
  });
}
/* 手动补录一条（应对 AI 完全漏掉的患者） */
function addAiBlankRow() {
  if (sheetCtx) syncAiDraftFromSheet();
  var o = {};
  AI_FIELDS.forEach(function (k) { o[k] = ''; });
  aiDraft.patients.push(o);
  openAiReview();

function openAiReview() {
  var list = aiDraft.patients;
  /* 汇总缺失情况 */
  var sum = { full: 0, needCare: 0, blocking: 0, missTotal: 0 };
  var missNames = [];
  list.forEach(function (p) {
    var m = aiMissingOf(p);
    sum.missTotal += m.count;
    if (m.blocking) { sum.blocking++; return; }
    if (m.needCare) { sum.needCare++; return; }
    if (m.count === 0) sum.full++;
    if (m.all.length) missNames.push(m.all.join('、'));
  });

  var head = '';
  if (sum.blocking || sum.needCare) {
    var lv = sum.blocking ? 'var(--danger-soft)' : 'var(--warn-soft)';
    head = '<div class="hint" style="padding:9px 11px;background:' + lv + ';border-radius:9px;line-height:1.8;margin-bottom:10px">' +
      '⚠ AI 识别结果<b>不完整</b>，已识别的字段已自动填入，请补充标记为「待补」的项目。<br>' +
      '本批 ' + list.length + ' 位：' +
      (sum.full ? '<b>' + sum.full + '</b> 位信息完整；' : '') +
      (sum.needCare ? '<b>' + sum.needCare + '</b> 位缺排程信息；' : '') +
      (sum.blocking ? '<b>' + sum.blocking + '</b> 位缺姓名（无法导入）' : '') +
      '<br>共待补 <b>' + sum.missTotal + '</b> 项' +
      '</div>';
  } else if (sum.full === list.length && list.length) {
    head = '<div class="hint" style="padding:9px 11px;background:var(--ok-soft);border-radius:9px;line-height:1.75;margin-bottom:10px">' +
      '✔ ' + list.length + ' 位患者的关键信息均已识别到，请核对后导入。</div>';
  }

  var body = head +
    '<div class="hint" style="padding:9px 11px;background:var(--pri-soft);border-radius:9px;line-height:1.75;margin-bottom:12px">' +
    '⚠ 内容由 AI 识别，<b>请逐项核对后再导入</b>。识别错误或不需要的字段请直接修改或清空。</div>' +
    (list.length ? '<div class="hint" style="margin-bottom:8px">共 <b>' + list.length + '</b> 位待导入' +
      (missNames.length ? ' · 清单：' + esc(missNames.join('；')) : '') + '</div>' : '');

  if (!list.length) {
    body += '<div class="hint">识别结果为空，可手动补录或在上一页重新识别。</div>';
  }

  list.forEach(function (p, i) {
    var m = aiMissingOf(p);
    var badge;
    if (m.blocking) badge = '<span class="chip danger sm">缺姓名</span>';
    else if (m.count === 0) badge = '<span class="chip ok sm">信息完整</span>';
    else badge = '<span class="chip warn sm">待补 ' + m.count + ' 项</span>';

    body += '<div class="event" style="padding:11px 12px' + (m.blocking ? ';border-color:#f0c9c4' : '') + '">' +
      '<div class="head" style="justify-content:space-between">' +
      '<span class="chip pri">第 ' + (i + 1) + ' 位</span>' + badge +
      '<button type="button" class="btn sm danger" data-act="ai-drop" data-i="' + i + '" style="margin-left:auto">移除此条</button></div>' +
      (m.count ? '<div class="hint" style="margin-top:6px;line-height:1.7">待补充：' + esc(m.all.join('、')) + '</div>' : '') +
      '<div class="field2" style="margin-top:8px">' +
      '<div class="field" style="margin-bottom:8px"><label>' + aiLabelHtml(p, 'name', '姓名') + ' *</label>' + textInput(aiDraftKey(i, 'name'), p.name, '必填') + '</div>' +
      '<div class="field" style="margin-bottom:8px"><label>' + aiLabelHtml(p, 'mrn') + '</label>' + textInput(aiDraftKey(i, 'mrn'), p.mrn) + '</div></div>' +
      '<div class="field2">' +
      '<div class="field" style="margin-bottom:8px"><label>' + aiLabelHtml(p, 'sex') + '</label>' + aiSelect(aiDraftKey(i, 'sex'), p.sex, SEXES) + '</div>' +
      '<div class="field" style="margin-bottom:8px"><label>' + aiLabelHtml(p, 'age') + '</label>' + textInput(aiDraftKey(i, 'age'), p.age) + '</div></div>' +
      '<div class="field"><label>' + aiLabelHtml(p, 'diagnosis') + '</label>' + areaInput(aiDraftKey(i, 'diagnosis'), p.diagnosis, '含部位/病理/分期') + '</div>' +
      '<div class="field2">' +
      '<div class="field" style="margin-bottom:8px"><label>' + aiLabelHtml(p, 'purpose') + '</label>' + aiSelect(aiDraftKey(i, 'purpose'), p.purpose, PURPOSES) + '</div>' +
      '<div class="field" style="margin-bottom:8px"><label>' + aiLabelHtml(p, 'technique') + '</label>' + aiSelect(aiDraftKey(i, 'technique'), p.technique, TECHNIQUES) + '</div></div>' +

      '<div class="field" style="margin-bottom:8px"><label>' + aiLabelHtml(p, 'physician') + '</label>' + textInput(aiDraftKey(i, 'physician'), p.physician) + '</div>' +
      '<div class="field" style="margin-bottom:8px"><label>' + aiLabelHtml(p, 'planStatus') + '</label>' + aiSelect(aiDraftKey(i, 'planStatus'), p.planStatus, PLAN_STATUSES) + '</div></div>' +
      '<div class="field2">' +
      '<div class="field" style="margin-bottom:8px"><label>' + aiLabelHtml(p, 'totalDose') + '</label>' + numberInput(aiDraftKey(i, 'totalDose'), p.totalDose, '', '0.1') + '</div>' +
      '<div class="field" style="margin-bottom:8px"><label>' + aiLabelHtml(p, 'fractions') + '</label>' + numberInput(aiDraftKey(i, 'fractions'), p.fractions, '', '1') + '</div>' +
      '<div class="field" style="margin-bottom:8px"><label>' + aiLabelHtml(p, 'dosePerFraction') + '</label>' + numberInput(aiDraftKey(i, 'dosePerFraction'), p.dosePerFraction, '', '0.01') + '</div></div>' +
      '<div class="field2">' +
      '<div class="field" style="margin-bottom:8px"><label>' + aiLabelHtml(p, 'simDate') + '</label>' + textInput(aiDraftKey(i, 'simDate'), p.simDate, '', 'date') + '</div>' +
      '<div class="field" style="margin-bottom:8px"><label>' + aiLabelHtml(p, 'startDate') + '</label>' + textInput(aiDraftKey(i, 'startDate'), p.startDate, '', 'date') + '</div></div>' +
      '<div class="field" style="margin-bottom:0"><label>' + aiLabelHtml(p, 'position') + '</label>' + textInput(aiDraftKey(i, 'position'), p.position) + '</div>' +
      '</div>';
  });

  openSheet({
    title: '复核识别结果',
    body: body,
    actions: [
      { label: '＋ 手动补一位', act: 'ai-add-row' },
      { label: '取消', act: 'sheet-close' },
      { label: '确认导入 ' + list.length + ' 位', act: 'ai-commit', primary: true, full: true }
    ]
  });
}

/* 从复核界面收集并写入。
   允许信息不完整地导入——先建档，缺的字段通过「待办」提醒后续补充。 */
function commitAiDraft() {
  var vals = sheetValues();
  var list = aiDraft.patients;
  var added = 0, noName = 0, noSchedule = 0;
  var names = [], needScheduleNames = [];

  /* 先预检，让用户知道会发生什么 */
  var preview = list.map(function (p, i) {
    var o = {};
    AI_FIELDS.forEach(function (k) { o[k] = String(vals[aiDraftKey(i, k)] == null ? '' : vals[aiDraftKey(i, k)]).trim(); });
    return o;
  });
  var willSkip = preview.filter(function (o) { return !o.name; }).length;
  var willNeedSchedule = preview.filter(function (o) { return o.name && (!o.startDate || !parseInt(o.fractions, 10)); }).length;

  if (willSkip || willNeedSchedule) {
    var msg = [];
    if (willSkip) msg.push('· ' + willSkip + ' 条缺少姓名，将被跳过（姓名是必填项）');
    if (willNeedSchedule) msg.push('· ' + willNeedSchedule + ' 条缺少「开始日期」或「总次数」，导入后无法自动生成治疗日历，会出现在「待办」中提醒补充');
    msg.push('');
    msg.push('确定继续导入吗？');
    if (!confirm('识别结果仍有缺项：\n\n' + msg.join('\n'))) return false;
  }

  preview.forEach(function (o) {
    if (!o.name) { noName++; return; }
    if (!o.startDate || !parseInt(o.fractions, 10)) { noSchedule++; needScheduleNames.push(o.name); }
    state.patients.push(normalize({
      patients: [Object.assign(o, {
        treatDays: treatDaysCfg(), pauses: [], extras: [], doneDates: [], reactions: [], followupPlans: [], notes: [], status: '在治'
      })]
    }).patients[0]);
    added++;
    names.push(o.name);
  });

  if (!added) { toast('没有可导入的患者（姓名不能为空）'); return false; }
  save();
  closeSheet();
  view.page = 'tab'; view.tab = 'ward'; render();

  var tip = '已导入 ' + added + ' 位：' + names.join('、');
  if (noName) tip += '；跳过 ' + noName + ' 条（无姓名）';
  toast(tip);
  if (noSchedule) {
    setTimeout(function () {
      alert('另有 ' + noSchedule + ' 位患者的信息不完整，暂无法生成治疗日历：\n\n' +
        needScheduleNames.join('、') + '\n\n' +
        '这些患者已进入「待办」，点开补充「放疗开始日期」与「总次数」后即会自动排程。');
    }, 300);
  }
  return true;
}

      '<div class="field2"><div class="field"><label>定位日期</label>' + textInput('simDate', d.simDate, '', 'date') + '</div>' +
      '<div class="field"><label>放疗开始日期 *</label>' + textInput('startDate', d.startDate, '', 'date') + '</div></div>' +
      '<div class="hint" style="margin:-6px 0 10px">填写开始日期后，系统按「工作日」自动排程并算出结束日期</div>' +
      field('体位/固定装置', textInput('position', d.position, '如 头颈肩热塑面罩')) +
      field('放疗验证（第几次治疗时验证）',
        '<div class="field2"><div class="field">' + textInput('verifyFractions', (d.verifyAt && d.verifyAt.fractions) || '', '如 10 或 10,20，留空=不验证') + '</div>' +
        '<div class="field">' + textInput('verifyNote', (d.verifyAt && d.verifyAt.note) || '', '验证内容（可选）') + '</div></div>',
        '填「第几次治疗」时做验证，多个用逗号分隔（如 10,20）；留空表示不做验证。到点前会提前 ' + VERIFY_LEAD_FRACTIONS + ' 次进入待办提醒'),
    onSave: function (v) {
      if (!String(v.name || '').trim()) { toast('请填写姓名'); return false; }
      var vf = String(v.verifyFractions == null ? '' : v.verifyFractions);
      /* 非法输入不静默吞掉：有内容却一个有效次数都解析不出来时明确提示 */
      if (vf.trim() && !parseVerifyNums(vf).length) { toast('验证次数请填正整数，如 10 或 10,20'); return false; }
      if (isNew) {
        state.patients.push(normalize({ patients: [Object.assign({}, v, { treatDays: treatDaysCfg(), pauses: [], extras: [], doneDates: [], reactions: [], followupPlans: [], notes: [], status: '在治' })] }).patients[0]);
        toast(v.startDate && v.fractions ? '已添加，日历已生成' : '已添加');
      } else {
        ['mrn', 'name', 'sex', 'age', 'physician', 'diagnosis', 'purpose', 'technique', 'simDate', 'position', 'planStatus', 'totalDose', 'fractions', 'dosePerFraction', 'startDate'].forEach(function (k) { p[k] = v[k] || ''; });
        /* 验证配置单独处理：次数变化时，把不再存在的次数的完成标记一并清掉，
           避免「改成 15 后第 10 次仍显示已完成」这种脏数据 */
        var oldDone = verifyCfgOf(p).done;
        var nums = parseVerifyNums(vf);
        p.verifyAt = {
          fractions: vf.trim(),
          note: String(v.verifyNote || ''),
          done: oldDone.filter(function (x) { return nums.indexOf(parseInt(x, 10)) >= 0; })
        };
        toast('已保存');
      }
      save(); render();
    }
  });
}

/* 详情页「放疗验证」摘要：无则显示「不验证」，有则逐个列出次数 + 完成状态。
   按钮必须带 data-id —— 这里渲染在详情页，但同一套 handler 也被待办/弹层复用，
   不带 id 时 getPatient(undefined) 会拿到 null 而静默不动作（曾出现的缺陷）。 */
function verifySummaryHtml(p) {
  var cfg = verifyCfgOf(p);
  var pidAttr = ' data-id="' + esc(p.id) + '"';
  if (!cfg.nums.length) return '不验证 <button class="btn sm" data-act="verify-edit"' + pidAttr + '>设置</button>';
  var schedN = computeSchedule(p).length;
  var dn = doneCount(p);
  var parts = cfg.nums.map(function (n) {
    var done = cfg.done.indexOf(String(n)) >= 0;
    var over = n > schedN;
    var cls = done ? 'ok' : (over ? 'danger' : (dn >= n ? 'warn' : 'pri'));
    var txt = '第 ' + n + ' 次' + (done ? ' ✓' : (over ? '（超出排程）' : (dn >= n ? '（该验证了）' : '')));
    return '<span class="chip ' + cls + ' sm">' + txt + '</span>';
  }).join(' ');
  return parts + (cfg.note ? ' <span class="hint">' + esc(cfg.note) + '</span>' : '') +
    ' <button class="btn sm" data-act="verify-edit"' + pidAttr + '>修改</button>';
}

/* ================= 表单：放疗验证 ================= */
/* 标记某一次验证已完成（幂等：重复标记不产生重复项） */
function verifyMarkDone(pid, n) {
  var p = getPatient(pid);
  if (!p || !n) return;
  var cfg = verifyCfgOf(p);
  if (cfg.done.indexOf(String(n)) < 0) cfg.done.push(String(n));
  p.verifyAt = { fractions: (p.verifyAt && p.verifyAt.fractions) || '', note: cfg.note, done: cfg.done };
  save(); render();
  toast('已标记第 ' + n + ' 次验证完成');
}
/* 切换某次验证的完成状态（界面说明是"点按钮切换"，因此必须可撤销） */
function verifyToggleDone(pid, n) {
  var p = getPatient(pid);
  if (!p || !n) return;
  if (verifyCfgOf(p).done.indexOf(String(n)) >= 0) return verifyUnmark(pid, n);
  return verifyMarkDone(pid, n);
}
/* 撤销某次验证的完成标记 */
function verifyUnmark(pid, n) {
  var p = getPatient(pid);
  if (!p) return;
  var cfg = verifyCfgOf(p);
  p.verifyAt = { fractions: (p.verifyAt && p.verifyAt.fractions) || '', note: cfg.note, done: cfg.done.filter(function (x) { return x !== String(n); }) };
  save(); render(); toast('已撤销第 ' + n + ' 次验证标记');
}
/* 独立编辑验证：从待办或详情页进入，不必打开完整患者表单 */
function sheetVerify(p) {
  if (!p) { closeSheet(); return; }
  var cfg = verifyCfgOf(p);
  openSheet({
    title: '放疗验证设置', okText: '保存',
    body:
      '<div class="hint" style="margin-bottom:10px;line-height:1.7">填「第几次治疗」时做验证，多个用逗号分隔（如 <b>10,20</b>）；<b>留空表示不验证</b>。<br>' +
      '到点前会提前 ' + VERIFY_LEAD_FRACTIONS + ' 次进入待办提醒。</div>' +
      field('第几次治疗时验证', textInput('verifyFractions', (p.verifyAt && p.verifyAt.fractions) || '', '如 10 或 10,20，留空=不验证')) +
      field('验证内容（可选）', textInput('verifyNote', cfg.note, '如 复位+CBCT、中期评估')) +
      (cfg.nums.length ? '<div class="field"><label>已完成标记</label><div class="seg">' +
        cfg.nums.map(function (n) {
          var dn = cfg.done.indexOf(String(n)) >= 0;
          /* 带 data-id：弹层可能在 view.pid 与患者不一致的语境下打开 */
          return '<button type="button" class="' + (dn ? 'on' : '') + '" data-act="verify-mark" data-id="' + esc(p.id) + '" data-n="' + n + '">' +
            (dn ? '✓ ' : '') + '第 ' + n + ' 次</button>';
        }).join('') + '</div><div class="hint" style="margin-top:4px">点按钮切换「已验证」状态</div></div>' : ''),
    onSave: function (v) {
      var vf = String(v.verifyFractions == null ? '' : v.verifyFractions);
      if (vf.trim() && !parseVerifyNums(vf).length) { toast('请填正整数，如 10 或 10,20'); return false; }
      var nums = parseVerifyNums(vf);
      p.verifyAt = {
        fractions: vf.trim(),
        note: String(v.verifyNote || ''),
        done: cfg.done.filter(function (x) { return nums.indexOf(parseInt(x, 10)) >= 0; })
      };
      save(); render(); toast(nums.length ? '已保存' : '已保存（不验证）');
    }
  });
}

/* ================= 表单：随访 ================= */
/* 单项编辑：间隔（数值 + 单位）自动算到期日 */
function sheetFollowup(p, f) {
  if (!p) { closeSheet(); return; }
  var isNew = !f;
  var base = (f && f.baseDate && f.baseDate !== 'TEMPLATE') ? f.baseDate : (followupBase(p) || todayStr());
  var d = f || { offsetN: 3, offsetUnit: 'm', note: '' };
  var initDue = addInterval(base, d.offsetN, d.offsetUnit);

  openSheet({
    title: isNew ? '添加随访' : '编辑随访', okText: '保存',
    body:
      '<div class="hint" style="margin-bottom:10px;line-height:1.7">到期日 = 起算日 + 间隔，自动推算</div>' +
      field('起算日期（放疗结束日）', textInput('baseDate', base, '', 'date'),
        treatmentEndOf(p) ? ('放疗结束日 ' + treatmentEndOf(p)) : '该患者尚无排程，可手动填写') +
      '<div class="field2">' +
      '<div class="field"><label>间隔</label>' + numberInput('offsetN', d.offsetN, '如 3', '1') + '</div>' +
      '<div class="field"><label>单位</label><select name="offsetUnit" id="fuUnit">' +
      FOLLOWUP_UNITS.map(function (u) { return '<option value="' + u.key + '"' + (u.key === d.offsetUnit ? ' selected' : '') + '>' + u.label + '</option>'; }).join('') +
      '</select></div></div>' +
      '<div class="field"><label>到期日（自动推算，可手动改）</label>' + textInput('dueDate', initDue, '', 'date') + '</div>' +
      '<div class="field"><label>快捷间隔</label><div class="seg">' +
      FOLLOWUP_PRESETS.map(function (n) { return '<button type="button" class="fupre" data-n="' + n + '">' + n + ' 个月</button>'; }).join('') +
      '</div></div>' +
      field('随访内容', areaInput('note', d.note, '如 复查盆腔 MRI、CEA；或复查 PSA')),
    onSave: function (v) {
      if (!v.dueDate) { toast('请填写到期日'); return false; }
      if (isNew) {
        p.followupPlans = p.followupPlans || [];
        p.followupPlans.push({
          id: uid('fp'), baseDate: v.baseDate || base, offsetN: parseInt(v.offsetN, 10) || 0,
          offsetUnit: v.offsetUnit || 'm', dueDate: v.dueDate, note: v.note, done: false, doneAt: ''
        });
        toast('已添加随访');
      } else {
        f.baseDate = v.baseDate || base;
        f.offsetN = parseInt(v.offsetN, 10) || 0;
        f.offsetUnit = v.offsetUnit || 'm';
        f.dueDate = v.dueDate; f.note = v.note;
        toast('已保存');
      }
      save(); render();
    },
    afterRender: function () {
      var nEl = document.querySelector('#sheetBody [name="offsetN"]');
      var uEl = document.getElementById('fuUnit');
      var bEl = document.querySelector('#sheetBody [name="baseDate"]');
      function recalc() {
        var dEl = document.querySelector('#sheetBody [name="dueDate"]');
        if (!dEl || !nEl || !uEl) return;
        dEl.value = addInterval((bEl && bEl.value) || base, nEl.value, uEl.value);
      }
      [nEl, uEl, bEl].forEach(function (el) { if (el) { el.addEventListener('input', recalc); el.addEventListener('change', recalc); } });
      document.querySelectorAll('#sheetBody .fupre').forEach(function (b) {
        if (d.offsetN === parseInt(b.dataset.n, 10) && d.offsetUnit === 'm') b.classList.add('on');
        b.addEventListener('click', function () {
          document.querySelectorAll('#sheetBody .fupre').forEach(function (x) { x.classList.remove('on'); });
          b.classList.add('on');
          if (nEl) nEl.value = b.dataset.n;
          if (uEl) uEl.value = 'm';
          recalc();
        });
      });
    }
  });
}

/* 把模板应用到某位患者：保留已完成记录，未完成部分按新模板重排（不重复已完成的次数） */
function applyTplToPatient(p, t) {
  var items = (t.items || []).filter(function (x) { return parseInt(x.n, 10) > 0; });
  if (!items.length) return false;
  var base = t.base || followupTplBase(p) || treatmentEndOf(p) || todayStr();
  var done = (p.followupPlans || []).filter(function (f) { return f.baseDate !== 'TEMPLATE' && f.done; });
  var doneKeys = {};
  done.forEach(function (f) { doneKeys[f.offsetN + '|' + f.offsetUnit] = 1; });
  var pendItems = items.filter(function (it) { return !doneKeys[it.n + '|' + (it.u || 'm')]; });
  var tplRows = buildFollowupPlans(items, base).map(function (f) {
    f.tplBase = base; f.baseDate = 'TEMPLATE'; return f;
  });
  p.followupPlans = done.concat(buildFollowupPlans(pendItems, base)).concat(tplRows);
  save();
  return true;
}

/* 随访模板：一次设定整条随访链，之后可随时改间隔并自动重排 */
function sheetFollowupTemplate(p) {
  if (!p) { closeSheet(); return; }
  var tpl = followupTemplate(p);
  var rows = tpl.length ? tpl.map(function (t) { return { n: t.offsetN, u: t.offsetUnit, note: t.note || '' }; })
    : [{ n: 1, u: 'm' }, { n: 3, u: 'm' }, { n: 6, u: 'm' }, { n: 12, u: 'm' }];
  /* 起算日默认为「放疗结束日」，与归档时间无关 */
  var base = followupTplBase(p) || treatmentEndOf(p) || todayStr();
  var schedEnd = scheduleEnd(p);

  /* 从界面读回编辑后的序列。
     必须定义在外层作用域：onSave 与 afterRender 都要用（放在 afterRender 内会取不到）。 */
  function readRows() {
    var nd = document.querySelectorAll('#tplRows .tplrow');
    var out = [];
    nd.forEach(function (r) {
      out.push({
        n: parseInt(r.querySelector('.t-n').value, 10) || 0,
        u: r.querySelector('.t-u').value,
        note: r.querySelector('.t-note').value
      });
    });
    if (out.length) rows = out;      /* 界面上没有行时保留原值（如测试环境） */
  }

  function rowsHtml() {
    return rows.map(function (r, i) {
      return '<div class="tplrow" style="display:flex;gap:6px;align-items:center;margin-bottom:8px">' +
        '<span class="hint" style="flex:0 0 auto">第 ' + (i + 1) + ' 次</span>' +
        '<input type="number" class="t-n" inputmode="numeric" value="' + r.n + '" style="flex:0 0 62px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:15px;min-width:0">' +
        '<select class="t-u" style="flex:0 0 78px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px">' +
        FOLLOWUP_UNITS.map(function (u) { return '<option value="' + u.key + '"' + (u.key === r.u ? ' selected' : '') + '>' + u.label + '</option>'; }).join('') +
        '</select>' +
        '<input type="text" class="t-note" placeholder="随访内容" value="' + esc(r.note || '') + '" style="flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px">' +
        '<button type="button" class="t-del" data-i="' + i + '" style="flex:0 0 auto;border:0;background:transparent;color:var(--danger);font-size:17px;cursor:pointer;padding:4px 6px">✕</button>' +
        '</div>';
    }).join('');
  }

  openSheet({
    title: '随访模板（自动排期）', okText: '保存并排期',
    body:
      '<div class="hint" style="margin-bottom:10px;line-height:1.7">设定「第几次、间隔多久」，保存后自动算出每次随访日期并排入待办。间隔以<b>放疗结束日</b>为第 0 个月计算。</div>' +
      field('起算日期（放疗结束日）', textInput('base', base, '', 'date'),
        schedEnd ? ('按排程算出的最后治疗日：' + schedEnd + '（＋' + treatmentEndNote(p) + '）') : '该患者尚无排程，可手动填写') +
      '<div class="field"><label>套用模板（点一下载入到下方序列，之后可逐行修改）</label><div class="seg">' +
      followupTemplates().map(function (t) {
        return '<button type="button" class="tpl" data-i="' + esc(t.name) + '">' + esc(t.name) +
          (t.builtin ? '' : ' ·自建') + '</button>';
      }).join('') +
      '</div>' +
      '<div class="btnrow" style="margin-top:8px">' +
      '<button type="button" class="btn sm" id="tplManage">⚙ 管理模板（' + followupTemplates().length + '）</button>' +
      '</div>' +
      '<div class="hint" style="margin-top:6px">模板为通用参考，请按本科室规程调整间隔与复查项目。</div></div>' +
      '<div class="field"><label>随访序列</label><div id="tplRows">' + rowsHtml() + '</div>' +
      '<button type="button" class="btn sm addbtn" id="tplAdd">＋ 增加一次随访</button></div>' +
      '<div class="field"><label>存为我的模板（可选）</label>' +
      '<div style="display:flex;gap:8px">' +
      '<input type="text" id="tplSaveName" placeholder="模板名称，如 本科室肺癌" style="flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:15px">' +
      '<button type="button" class="btn sm primary" id="tplSave" style="flex:0 0 auto">保存</button>' +
      '</div><div class="hint" style="margin-top:6px">把当前序列存成模板，以后一键套用；同名会覆盖。</div></div>' +
      '<div class="hint" id="tplPreview" style="line-height:1.9"></div>',
    onSave: function (v) {
      readRows();
      var items = rows.filter(function (r) { return parseInt(r.n, 10) > 0; });
      if (!items.length) { toast('请至少设置一次随访'); return false; }
      if (!v.base) { toast('请填写起算日期'); return false; }
      /* 保留已完成的随访记录，且不把已完成的次数重新生成为待随访（否则会重复） */
      var doneCnt = (p.followupPlans || []).filter(function (f) { return f.baseDate !== 'TEMPLATE' && f.done; }).length;
      applyTplToPatient(p, { items: items, base: v.base });
      var skipped = doneCnt;
      var plans = pendingFollowups(p).sort(function (a, b) { return String(a.dueDate).localeCompare(String(b.dueDate)); });
      render();
      toast('已按放疗结束日排出 ' + plans.length + ' 次随访' +
        (skipped ? '（' + skipped + ' 次已完成，不再重复）' : '') +
        (plans.length ? '，最早 ' + dateOnly(plans[0].dueDate) : ''));
    },
    afterRender: function () {
      function updatePreview() {
        var b = document.querySelector('#sheetBody [name="base"]');
        var base2 = (b && b.value) || base;
        readRows();
        var items = rows.filter(function (r) { return parseInt(r.n, 10) > 0; });
        var plans = buildFollowupPlans(items, base2);
        document.getElementById('tplPreview').innerHTML = plans.length
          ? '<b>将生成 ' + plans.length + ' 次随访（自 ' + dateOnly(base2) + ' 起算）：</b><br>' + plans.map(function (f, i) {
            var dd = daysBetween(base2, f.dueDate);
            return '第 ' + (i + 1) + ' 次 · ' + dateOnly(f.dueDate) + '（放疗后 ' + intervalText(f.offsetN, f.offsetUnit) +
              (dd > 0 ? '，约 ' + dd + ' 天' : '') + '）' + (f.note ? ' · ' + esc(f.note) : '');
          }).join('<br>')
          : '尚未设置随访';
      }
      function bindRows() {
        document.querySelectorAll('#tplRows .t-n, #tplRows .t-u, #tplRows .t-note').forEach(function (el) {
          el.addEventListener('input', updatePreview);
          el.addEventListener('change', updatePreview);
        });
        document.querySelectorAll('#tplRows .t-del').forEach(function (b) {
          b.addEventListener('click', function () { readRows(); rows.splice(parseInt(b.dataset.i, 10), 1); repaint(); });
        });
      }
      function repaint() {
        document.getElementById('tplRows').innerHTML = rowsHtml();
        bindRows(); updatePreview();
      }
      document.getElementById('tplAdd').addEventListener('click', function () {
        readRows();
        var last = rows[rows.length - 1] || { n: 0, u: 'm' };
        rows.push({ n: (parseInt(last.n, 10) || 0) + (last.u === 'm' ? 3 : 1), u: last.u || 'm', note: '' });
        repaint();
      });
      /* 套用模板：按名称查找（支持用户自建模板） */
      document.querySelectorAll('#sheetBody .tpl').forEach(function (b) {
        b.addEventListener('click', function () {
          var t = findTpl(b.dataset.i);
          if (!t) { toast('该模板已不存在'); return; }
          document.querySelectorAll('#sheetBody .tpl').forEach(function (x) { x.classList.remove('on'); });
          b.classList.add('on');
          rows = t.items.map(function (x) { return { n: x.n, u: x.u, note: x.note || '' }; });
          repaint();
          toast('已套用「' + t.name + '」，可继续修改');
        });
      });
      /* 把当前序列存成模板 */
      document.getElementById('tplSave').addEventListener('click', function () {
        readRows();
        var nameEl = document.getElementById('tplSaveName');
        var nm = (nameEl && nameEl.value || '').trim();
        if (!nm) { toast('请先填写模板名称'); if (nameEl) nameEl.focus(); return; }
        var items = rows.filter(function (r) { return parseInt(r.n, 10) > 0; });
        if (!items.length) { toast('随访序列为空，无法保存'); return; }
        if (isBuiltinTpl(nm) && !confirm('「' + nm + '」是内置模板，保存将覆盖它（可随时恢复内置）。确定继续？')) return;
        else if (!isBuiltinTpl(nm) && findTpl(nm) && !confirm('已存在同名模板「' + nm + '」，确定覆盖？')) return;
        if (!saveTpl(nm, items)) { toast('保存失败'); return; }
        if (nameEl) nameEl.value = '';
        toast('已保存模板「' + nm + '」');
        sheetFollowupTemplate(p);         /* 重开表单以刷新模板列表 */
      });
      document.getElementById('tplManage').addEventListener('click', function () { sheetTplManage(p); });
      var bEl = document.querySelector('#sheetBody [name="base"]');
      if (bEl) bEl.addEventListener('change', updatePreview);
      bindRows(); updatePreview();
    }
  });
}

/* 模板管理：查看 / 删除 / 恢复内置 */
function sheetTplManage(p) {
  var list = followupTemplates();
  var hasOverride = Object.keys(tplOverride()).length > 0;
  var body = '<div class="hint" style="margin-bottom:10px;line-height:1.7">' +
    '内置模板可删除（随时恢复）；自建模板可删除。点「套用」把该模板载入到序列编辑。</div>';
  if (!list.length) body += '<div class="hint">暂无可用模板，可在上一页把序列存为模板。</div>';

  var builtin = list.filter(function (t) { return t.builtin; });
  var custom = list.filter(function (t) { return !t.builtin; });

  function row(t) {
    return '<div class="event" style="padding:9px 11px"><div class="head" style="margin-bottom:4px">' +
      '<span class="chip ' + (t.builtin ? 'pri' : 'warn') + '">' + (t.builtin ? '内置' : '自建') + '</span>' +
      '<span style="flex:1;font-size:14px;font-weight:600">' + esc(t.name) + '</span></div>' +
      '<div class="hint" style="line-height:1.6">' + t.items.length + ' 次 · ' + esc(tplItemsText(t.items)) + '</div>' +
      '<div class="acts" style="margin-top:6px">' +
      '<button type="button" class="btn sm" data-act="tpl-use" data-name="' + esc(t.name) + '">套用</button>' +
      '<button type="button" class="btn sm danger" data-act="tpl-del" data-name="' + esc(t.name) + '">删除</button>' +
      '</div></div>';
  }

  if (builtin.length) {
    body += '<div class="hint" style="margin:10px 2px 6px;font-weight:600">内置模板（' + builtin.length + '）</div>';
    body += builtin.map(row).join('');
  }
  if (custom.length) {
    body += '<div class="hint" style="margin:14px 2px 6px;font-weight:600">我自建的（' + custom.length + '）</div>';
    body += custom.map(row).join('');
  }

  openSheet({
    title: '管理随访模板',
    body: body,
    actions: [
      hasOverride ? { label: '恢复内置模板', act: 'tpl-reset' } : null,
      { label: '返回编辑', act: 'tpl-back', full: !hasOverride }
    ].filter(Boolean)
  });
}

/* ================= 表单：中断 / 加照 ================= */
/* 待随访 / 随访历史列表 */
function sheetFollowupList(p, mode) {
  if (!p) { closeSheet(); return; }
  var list;
  if (mode === 'history') {
    list = (p.followupPlans || []).filter(function (f) { return f.baseDate !== 'TEMPLATE' && f.done; })
      .sort(function (a, b) { return String(b.doneAt).localeCompare(String(a.doneAt)); });
  } else {
    list = pendingFollowups(p).sort(function (a, b) { return String(a.dueDate).localeCompare(String(b.dueDate)); });
  }
  openSheet({
    title: mode === 'history' ? '随访历史' : '待随访安排',
    body: list.length ? list.map(function (f) {
      return '<div class="event"><div class="head">' +
        (f.done ? '<span class="chip ok">已完成</span>' : (f.dueDate <= todayStr() ? '<span class="chip danger">已到期</span>' : '<span class="chip warn">待随访</span>')) +
        '<span class="chip sm">' + esc(intervalText(f.offsetN, f.offsetUnit)) + '</span></div>' +
        '<div class="content" style="font-weight:400">' + (f.done ? dateOnly(f.doneAt) : dateOnly(f.dueDate)) +
        (f.note ? ' · ' + esc(f.note) : '') + '</div>' +
        (f.done ? '<div class="t">计划 ' + dateOnly(f.dueDate) + '</div>'
          : '<div class="acts"><button class="btn sm primary" data-act="followup-done" data-id="' + f.id + '">完成本次</button>' +
          '<button class="btn sm" data-act="followup-edit" data-id="' + f.id + '">改间隔</button>' +
          '<button class="btn sm danger" data-act="followup-del" data-id="' + f.id + '">删除</button></div>') +
        '</div>';
    }).join('') : '<div class="hint">暂无记录</div>',
    actions: [{ label: '关闭', act: 'sheet-close', full: true }]
  });
}


function sheetPause(p, pa) {
  if (!p) { closeSheet(); return; }
  var isNew = !pa;
  var d = pa || { from: todayStr(), to: addDays(todayStr(), 2), reason: '' };
  openSheet({
    title: isNew ? '中断 / 调整治疗' : '编辑中断', okText: '保存',
    body: '<div class="hint" style="margin-bottom:8px">该区间内不安排治疗，后续日期自动顺延，结束日期自动重算</div>' +
      '<div class="field2"><div class="field"><label>中断开始</label>' + textInput('from', d.from, '', 'date') + '</div>' +
      '<div class="field"><label>恢复治疗日期</label>' + textInput('to', d.to, '', 'date') + '</div></div>' +
      field('原因', areaInput('reason', d.reason, '如 机器故障维修 / 患者请假 / 骨髓抑制暂停')),
    onSave: function (v) {
      if (!v.from || !v.to) { toast('请填写起止日期'); return false; }
      if (v.to < v.from) { toast('恢复日期不能早于开始日期'); return false; }
      if (isNew) { p.pauses = p.pauses || []; p.pauses.push({ id: uid('pa'), from: v.from, to: v.to, reason: v.reason }); }
      else { pa.from = v.from; pa.to = v.to; pa.reason = v.reason; }
      save(); render(); toast('已保存，日程已重算');
    }
  });
}
function sheetExtra(p) {
  if (!p) { closeSheet(); return; }
  openSheet({
    title: '加照（额外治疗日）', okText: '保存',
    body: '<div class="hint" style="margin-bottom:10px;line-height:1.7">在某一天<b>额外补做一次</b>，用于补回漏做的次数。<br>' +
      '总次数不变，疗程相应提前结束。<br>（若要「原计划结束后再增加几次」，请用「加量」）</div>' +
      field('日期', textInput('date', todayStr(), '', 'date')) +
      field('原因', areaInput('reason', '', '如 周末补照 / 假期前加照')),
    onSave: function (v) {
      if (!v.date) { toast('请填写日期'); return false; }
      if (inPause(p, v.date)) { toast('该日期在中断区间内，请先调整中断'); return false; }
      p.extras = p.extras || [];
      p.extras.push({ id: uid('ex'), date: v.date, reason: v.reason });
      save(); render(); toast('已加照，日程已重算');
    }
  });
}

/* ================= 弹层：治疗疗程（手术 / 化疗 / 放疗）=================
   化疗以「疗程 → 周期 → 给药」三层录入；放疗只记备注（排程仍由顶层字段决定） */

/* 疗程：新增 / 编辑。cid 为空表示新增 */
function sheetCourse(p, course) {
  if (!p) { closeSheet(); return; }
  var c = course || { kind: 'chemo', title: '', site: '', date: todayStr(), regimen: '', note: '' };
  var isNew = !course;
  var kindOpts = COURSE_KINDS;
  function kindLabel(k) { return COURSE_KIND_LABELS[k] || k; }

  /* 下拉用中文标签，内部值仍是枚举 */
  var body = field('类型', '<select name="kind">' + kindOpts.map(function (k) {
    return '<option value="' + k + '"' + (k === c.kind ? ' selected' : '') + '>' + kindLabel(k) + '</option>';
  }).join('') + '</select>');
  body += field('名称', textInput('title', c.title, '如 根治性切除 / 第1程化疗 / 原发灶放疗'));
  body += field('备注', areaInput('note', c.note, '医院、术者、病理、方案说明等'));

  openSheet({
    title: isNew ? '新增治疗疗程' : '编辑治疗疗程', okText: '保存',
    body: body +
      '<div class="hint" style="line-height:1.7">「' + kindLabel(c.kind) + '」疗程的详细日期请在时间轴上继续录入' +
      (c.kind === 'chemo' ? '（化疗周期与给药）' : (c.kind === 'surgery' ? '（手术日期）' : '（放疗日期取现有排程）')) + '。</div>',
    onSave: function (v) {
      var kind = COURSE_KINDS.indexOf(v.kind) >= 0 ? v.kind : 'chemo';
      var title = String(v.title || '').trim();
      if (!title) { toast('请填写疗程名称'); return false; }
      var data = { kind: kind, title: title, note: String(v.note || '').trim() };
      if (kind === 'surgery' && isNew) data.date = c.date || todayStr();
      if (kind === 'radio') data.radioRef = true;
      upsertCourse(p.id, course ? course.id : null, data);
      /* 切换成 surgery 且没有日期时，立即弹手术日期录入 */
      if (kind === 'surgery' && isNew) {
        var created = p.courses[p.courses.length - 1];
        toast('已新增手术疗程，请填写手术日期');
        sheetSurgery(p, created);
        return false;
      }
      toast('已保存');
    }
  });
}

/* 手术日期：单独一步（用户选择「仅日期 + 术式」，术式即 title） */
function sheetSurgery(p, course) {
  if (!p || !course) { closeSheet(); return; }
  openSheet({
    title: '手术日期', okText: '保存',
    body: field('手术日期', textInput('date', course.date || todayStr(), '', 'date')) +
      field('术式', textInput('title', course.title, '如 根治性切除'),
        '医院、术者、病理等请写在备注里'),
    onSave: function (v) {
      if (!v.date) { toast('请填写手术日期'); return false; }
      upsertCourse(p.id, course.id, { date: dateOnly(v.date), title: String(v.title || '').trim() || course.title });
      toast('已保存');
    }
  });
}

/* 化疗周期：新增 / 编辑 */
function sheetCycle(p, cid, n) {
  if (!p) { closeSheet(); return; }
  var c = findCourse(p.id, cid);
  if (!c) { closeSheet(); return; }
  var cy = n ? findCycle(p, cid, n) : null;
  var isNew = !cy;
  var autoN = nextCycleNo(c);
  var d = cy || { n: autoN, startDate: '', endDate: '', note: '' };
  openSheet({
    title: (isNew ? '新增化疗周期' : '编辑第 ' + d.n + ' 周期'), okText: '保存',
    body: '<div class="hint" style="margin-bottom:8px">' + esc(c.title || '化疗') + (c.regimen ? ' · ' + esc(c.regimen) : '') + '</div>' +
      '<div class="field2">' + field('周期序号', numberInput('n', d.n, '', '1')) +
      field('开始日期', textInput('startDate', d.startDate, '', 'date')) + '</div>' +
      field('结束日期', textInput('endDate', d.endDate, '', 'date'), '可留空') +
      field('备注', areaInput('note', d.note, '如 剂量调整、延迟原因')),
    onSave: function (v) {
      var num = parseInt(v.n, 10);
      if (!num || num <= 0) { toast('请填写有效的周期序号'); return false; }
      if (!v.startDate) { toast('请填写周期开始日期'); return false; }
      if (v.endDate && v.endDate < v.startDate) { toast('结束日期不能早于开始日期'); return false; }
      /* 序号冲突校验（编辑时排除自身） */
      if (findCycle(p, cid, num) && (!cy || parseInt(cy.n, 10) !== num)) { toast('第 ' + num + ' 周期已存在'); return false; }
      upsertCycle(p.id, cid, cy ? cy.n : null, {
        n: num, startDate: dateOnly(v.startDate), endDate: dateOnly(v.endDate), note: String(v.note || '').trim()
      });
      toast('已保存');
    }
  });
}

/* 化疗给药：新增 / 编辑 */
function sheetDose(p, cid, n, did) {
  if (!p) { closeSheet(); return; }
  var cy = findCycle(p, cid, n);
  if (!cy) { closeSheet(); return; }
  var d = null;
  (cy.doses || []).forEach(function (x) { if (x.id === did) d = x; });
  var isNew = !d;
  d = d || { date: cy.startDate || todayStr(), drug: '', dose: '', unit: 'mg/m2', note: '' };
  openSheet({
    title: (isNew ? '新增给药' : '编辑给药'), okText: '保存',
    body: '<div class="hint" style="margin-bottom:8px">第 ' + cy.n + ' 周期' + (cy.startDate ? ' · ' + esc(cy.startDate) : '') + '</div>' +
      field('给药日期', textInput('date', d.date, '', 'date')) +
      field('药物', textInput('drug', d.drug, '如 紫杉醇 / 顺铂')) +
      '<div class="field2">' + field('剂量', numberInput('dose', d.dose, '如 175')) +
      field('单位', textInput('unit', d.unit, '如 mg/m2 / mg')) + '</div>' +
      field('备注', areaInput('note', d.note, '如 预处理、减量')),
    onSave: function (v) {
      if (!v.date) { toast('请填写给药日期'); return false; }
      if (!String(v.drug || '').trim()) { toast('请填写药物名称'); return false; }
      upsertDose(p.id, cid, n, d.id, {
        date: dateOnly(v.date), drug: String(v.drug).trim(),
        dose: String(v.dose == null ? '' : v.dose).trim(), unit: String(v.unit || '').trim(),
        note: String(v.note || '').trim()
      });
      toast('已保存');
    }
  });
}

/* 加量：原计划结束后追加若干次（常见于局部加量 boost） */
function sheetBoost(p) {  if (!p) { closeSheet(); return; }
  var base = parseInt(p.fractions, 10) || 0;
  var cur = parseInt(p.boostFractions, 10) || 0;
  var endBefore = scheduleEnd(p);
  openSheet({
    title: '加量（追加治疗次数）', okText: '保存',
    body:
      '<div class="hint" style="margin-bottom:10px;line-height:1.7">在原定 ' + base + ' 次<b>结束之后</b>再追加若干次，' +
      '总次数随之增加，疗程相应延长。<br>（若只是某天补做一次、次数不变，请用「加照」）</div>' +
      field('加量次数', numberInput('boostFractions', cur || '', '如 5', '1')) +
      field('加量说明', textInput('boostNote', p.boostNote, '如 局部加量 10Gy/5次 / 瘤床加量')) +
      '<div class="hint" id="boostPreview" style="line-height:1.9">' +
      (base ? '原计划 ' + base + ' 次' + (endBefore ? '，结束于 ' + endBefore : '') : '尚未排程') + '</div>',
    onSave: function (v) {
      var n = parseInt(v.boostFractions, 10);
      if (v.boostFractions !== '' && v.boostFractions != null && (isNaN(n) || n < 0)) { toast('加量次数需为不小于 0 的整数'); return false; }
      if (!n) {
        if (!confirm('加量次数为 0，将取消加量。确定保存吗？')) return false;
      }
      p.boostFractions = n ? String(n) : '';
      p.boostNote = n ? String(v.boostNote || '').trim() : '';
      save(); render();
      var endAfter = scheduleEnd(p);
      toast(n
        ? ('已加量 ' + n + ' 次，总次数 ' + (base + n) + ' 次，结束日期 ' + (endAfter || '—'))
        : '已取消加量');
    },
    afterRender: function () {
      var el = document.querySelector('#sheetBody [name="boostFractions"]');
      if (!el) return;
      function upd() {
        var n = parseInt(el.value, 10) || 0;
        var pv = document.getElementById('boostPreview');
        if (!pv) return;
        if (!base) { pv.textContent = '尚未排程'; return; }
        if (!n) { pv.innerHTML = '原计划 <b>' + base + '</b> 次' + (endBefore ? '，结束于 ' + endBefore : ''); return; }
        pv.innerHTML = '原计划 <b>' + base + '</b> 次 + 加量 <b>' + n + '</b> 次 = 总 <b>' + (base + n) + '</b> 次' +
          '<br>加量部分将从 ' + (endBefore || '原计划结束后') + ' 之后继续顺排';
      }
      el.addEventListener('input', upd);
      el.addEventListener('change', upd);
      upd();
    }
  });
}

/* 提前终止：到某日为止，后续不再安排治疗 */
function sheetStop(p) {
  if (!p) { closeSheet(); return; }
  var planned = plannedCount(p);
  var tot = totalFractionsOf(p);
  var last = scheduleEnd(p);
  openSheet({
    title: '提前终止治疗', okText: '确认终止',
    body:
      '<div class="hint" style="margin-bottom:10px;line-height:1.7">' +
      '指定「最后一天治疗」，之后的计划不再执行。<b>原处方信息会保留</b>，便于记录与统计；' +
      '未完成的次数会明确标出。随时可取消终止、恢复原计划。</div>' +
      field('最后一天治疗（含当日）', textInput('stopDate', last || todayStr(), '', 'date'),
        '该日之后的治疗不再安排') +
      field('终止原因', areaInput('reason', '', '如 患者拒绝继续 / 出现放射性损伤 / 病情变化 / 转手术')) +
      '<div class="hint" id="stopPreview" style="line-height:1.9"></div>',
    onSave: function (v) {
      if (!v.stopDate) { toast('请填写最后一天治疗'); return false; }
      p.stopDate = v.stopDate;
      var real = plannedCount(p);
      save(); render();
      toast('已终止于 ' + dateOnly(v.stopDate) + '，实际安排 ' + real + '/' + tot + ' 次');
    },
    afterRender: function () {
      var el = document.querySelector('#sheetBody [name="stopDate"]');
      if (!el) return;
      function upd() {
        var prev = document.getElementById('stopPreview');
        if (!prev) return;
        var d = el.value;
        if (!d) { prev.textContent = ''; return; }
        var tmp = JSON.parse(JSON.stringify({ fractions: p.fractions, boostFractions: p.boostFractions, startDate: p.startDate, treatDays: p.treatDays, pauses: p.pauses, extras: p.extras, stopDate: d }));
        var cnt = computeSchedule(tmp).length;
        prev.innerHTML = '处方共 <b>' + tot + '</b> 次，终止后实际安排 <b>' + cnt + '</b> 次，' +
          '其中未执行 <b>' + Math.max(0, tot - cnt) + '</b> 次' +
          (cnt ? '<br>最后一天治疗：' + computeSchedule(tmp)[cnt - 1].date : '');
      }
      el.addEventListener('change', upd);
      el.addEventListener('input', upd);
      upd();
    }
  });
}
function cancelStop(p) {
  if (!p) return;
  if (!confirm('取消提前终止？将恢复原计划的全部 ' + totalFractionsOf(p) + ' 次治疗。')) return;
  p.stopDate = '';
  save(); render(); toast('已取消终止，恢复原计划');
}

function sheetListPauses(p) {
  if (!p) { closeSheet(); return; }
  openSheet({
    title: '中断记录',
    body: (p.pauses || []).map(function (pa) {
      return '<div class="event"><div class="head"><span class="chip warn">' + dateOnly(pa.from) + ' ~ ' + dateOnly(pa.to) + '</span>' +
        '<span class="chip sm">' + (daysBetween(pa.from, pa.to) + 1) + ' 天</span></div>' +
        '<div class="content" style="font-weight:400">' + esc(pa.reason || '未填写原因') + '</div>' +
        '<div class="acts"><button class="btn sm" data-act="pause-edit" data-id="' + pa.id + '">编辑</button>' +
        '<button class="btn sm danger" data-act="pause-del" data-id="' + pa.id + '">删除</button></div></div>';
    }).join('') || '<div class="hint">暂无中断记录</div>',
    actions: [{ label: '关闭', act: 'sheet-close', full: true }]
  });
}
function sheetExtraList(p) {
  if (!p) { closeSheet(); return; }
  openSheet({
    title: '加照记录',
    body: (p.extras || []).map(function (e) {
      return '<div class="event"><div class="head"><span class="chip warn">' + dateOnly(e.date) + '</span></div>' +
        '<div class="content" style="font-weight:400">' + esc(e.reason || '加照') + '</div>' +
        '<div class="acts"><button class="btn sm danger" data-act="extra-del" data-id="' + e.id + '">删除</button></div></div>';
    }).join('') || '<div class="hint">暂无加照记录</div>',
    actions: [{ label: '关闭', act: 'sheet-close', full: true }]
  });
}

/* ================= 备注 / 交班记录 ================= */
function sheetNote(p, note) {
  if (!p) { closeSheet(); return; }
  var isNew = !note;
  openSheet({
    title: isNew ? '添加备注' : '编辑备注',
    body: '<div class="field"><label>内容</label>' +
      '<textarea name="content" rows="4" placeholder="如：本周血象偏低已推迟一次；家属咨询放疗后复查安排…">' +
      esc(note ? note.content : '') + '</textarea></div>' +
      '<div class="field"><label>时间</label><input type="datetime-local" name="at" value="' +
      esc(note && note.at ? note.at : nowLocalInput()) + '"></div>',
    onSave: function (v) {
      if (!String(v.content || '').trim()) { toast('请填写备注内容'); return false; }
      if (isNew) {
        p.notes = p.notes || [];
        p.notes.push({ id: uid('n'), at: v.at || nowLocalInput(), content: String(v.content).trim() });
      } else {
        note.content = String(v.content).trim();
        if (v.at) note.at = v.at;
      }
      save(); render(); toast(isNew ? '已添加备注' : '已保存');
    }
  });
}
function delNote(pid, nid) {
  var p = getPatient(pid); if (!p) return;
  var n = (p.notes || []).filter(function (x) { return x.id === nid; })[0];
  if (!n) return;
  if (!confirm('删除这条备注？\n\n' + (n.content || '') + '\n\n删除后不可恢复。')) return;
  p.notes = (p.notes || []).filter(function (x) { return x.id !== nid; });
  save(); render(); toast('已删除备注');
}

/* ================= 日历日操作 =================
   完成状态按日期自动推算，因此这里不再有「标记完成」，
   只保留异常修正：本次未做（后续顺延）、停止治疗、加照、恢复治疗。 */
function sheetDayOverall(date) {
  if (!date) return;
  var arr = [];
  inTreat().forEach(function (p) {
    var it = scheduleOn(p, date);
    if (it) arr.push({ p: p, it: it });
  });
  /* 当日统计（含已归档患者的「结束」，口径与日历标注完全一致） */
  var st = dayStat(date);
  var hol = holidays(), mk = makeups();
  var isHol = Object.prototype.hasOwnProperty.call(hol, date);
  var isMk = Object.prototype.hasOwnProperty.call(mk, date);
  var tag = '';
  if (isHol && isMk) tag = '<span class="chip warn">节假日·已设为调休上班</span>';
  else if (isHol) tag = '<span class="chip danger">法定节假日 ' + esc(hol[date]) + '</span>';
  else if (isMk) tag = '<span class="chip warn">调休上班 ' + esc(mk[date]) + '</span>';
  var isPast = date < todayStr();
  var isToday = date === todayStr();

  /* 概览条：始终显示三类计数，让「0」也可见（用户明确要求标注在日期上） */
  var ov = '<div class="day-ov">' +
    '<span class="ov-i ov-start"><b>' + st.starting.length + '</b> 开始放疗</span>' +
    '<span class="ov-i ov-treat"><b>' + st.treating.length + '</b> 治疗中</span>' +
    '<span class="ov-i ov-end"><b>' + st.ending.length + '</b> 今日结束</span>' +
    '</div>';

  /* 「开始放疗」名单 */
  function sec(title, cls, items, verb) {
    if (!items.length) return '';
    return '<div class="day-sec"><div class="day-sec-t ' + cls + '">' + title + '（' + items.length + ' 人）</div>' +
      items.map(function (a) {
        return '<div class="cal-day-list"><div class="row"><span class="nm"><b>' + esc(a.p.name) + '</b>' +
          '<span class="sub2"> ' + esc(verb(a)) + '</span></span>' +
          (a.p.status === '在治' ? '' : '<span class="chip sm">' + esc(a.p.status) + '</span>') +
          '<button class="btn sm" data-act="open-patient" data-id="' + a.p.id + '">查看</button></div></div>';
      }).join('') + '</div>';
  }
  var head = ov +
    sec('开始放疗', 't-start', st.starting, function (a) { return '第 ' + a.it.fraction + ' 次起'; }) +
    sec('今日结束', 't-end', st.ending, function (a) { return '共 ' + plannedCount(a.p) + ' 次 · 末次' + (a.it.done ? '已完成' : '待治疗'); });

  openSheet({
    title: date + ' ' + WEEKDAYS[parseD(date).getDay()],
    body: '<div style="margin-bottom:8px">' + tag +
      (isToday ? '<span class="chip pri sm">今天</span>' : '') + '</div>' +
      head +
      (arr.length ? '<div class="day-sec-t t-all">全部治疗安排（' + arr.length + ' 人）</div>' + arr.map(function (a) {
        return '<div class="event"><div class="head"><span class="chip pri">第 ' + a.it.fraction + ' 次</span>' +
          (a.it.extra ? '<span class="chip warn sm">加照</span>' : '') +
          (a.it.done ? '<span class="chip ok sm">已完成</span>' : '<span class="chip sm">待治疗</span>') + '</div>' +
          '<div class="content">' + esc(a.p.name) + ' <span class="hint">' + esc(a.p.diagnosis || '') + '</span></div>' +
          '<div class="acts">' +
          (a.it.done || isToday
            ? '<button class="btn sm" data-act="skip-here" data-id="' + a.p.id + '" data-date="' + date + '">本次未做（顺延）</button>' : '') +
          '<button class="btn sm" data-act="open-patient" data-id="' + a.p.id + '">查看</button></div></div>';
      }).join('') : '<div class="hint">当天未安排治疗</div>'),
    actions: [{ label: '关闭', act: 'sheet-close', full: true }]
  });
  reopenSheet = function () { sheetDayOverall(date); };
}
function sheetDayPatient(p, date) {
  if (!p) { closeSheet(); return; }
  var it = scheduleOn(p, date);
  var pa = pauseOn(p, date);
  var isPause = !!pa;
  var body = '<div style="margin-bottom:8px">';
  if (it) body += '<span class="chip pri">第 ' + it.fraction + ' 次</span>' + (it.extra ? '<span class="chip warn sm">加照</span>' : '') +
    (it.done ? '<span class="chip ok sm">已完成</span>' : '<span class="chip sm">待治疗</span>');
  else if (isPause) body += '<span class="chip warn">中断中</span>';
  else body += '<span class="chip sm">非治疗日</span>';
  body += '</div>';
  if (isPause) body += '<div class="hint" style="margin-bottom:8px">中断：' + esc(pa.reason || '') + '（' + dateOnly(pa.from) + ' ~ ' + dateOnly(pa.to) + '）</div>';
  if (it && it.done) body += '<div class="hint" style="margin-bottom:8px">该次已按日期计入「已完成」。若当天实际未治疗，请点下方「本次未做」。</div>';
  if (!it && !isPause) body += '<div class="hint" style="margin-bottom:8px">该日不在治疗计划内，可加照（额外安排一次治疗）或设为中断起点。</div>';

  /* 操作按钮固定在底部，内容再长也始终可点 */
  var acts = [];
  /* 「本次未做」只对今天及过去显示（未来的治疗日尚未发生），与总日历口径一致 */
  if (it && date <= todayStr()) {
    acts.push({ label: '本次未做（后续顺延）', act: 'skip-here', id: p.id, date: date });
  }
  acts.push(isPause
    ? { label: '从此日恢复治疗', act: 'resume-here', id: p.id, date: date }
    : { label: '本日停止治疗（后续顺延）', act: 'stop-here', id: p.id, date: date });
  if (!it && !isPause) {
    acts.push({ label: '本日加照', act: 'add-extra-date', id: p.id, date: date, primary: true });
  }

  openSheet({ title: (p.name || '') + ' · ' + date, body: body, actions: acts });
  reopenSheet = function () { var q = getPatient(p.id); if (q) sheetDayPatient(q, date); else closeSheet(); };
}

/* ================= AI 操作 ================= */
function handleAiFiles(files, done) {
  if (!files || !files.length) return;
  var arr = Array.prototype.slice.call(files);
  var left = arr.length;
  arr.forEach(function (f) {
    compressImage(f, function (dataUrl) {
      if (dataUrl) aiDraft.images.push({ name: (f && f.name) || '图片', dataUrl: dataUrl });
      if (--left === 0 && done) done();
    });
  });
}
function pickAiImages(capture) {
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  if (capture) inp.setAttribute('capture', 'environment'); else inp.multiple = true;
  inp.onchange = function () { handleAiFiles(inp.files, renderAiThumbs); };
  inp.click();
}
function testAiConnection() {
  var v = sheetValues();
  var cfg = {
    baseUrl: String(v.baseUrl || '').trim(), apiKey: String(v.apiKey || '').trim(),
    model: String(v.model || '').trim(), prompt: ''
  };
  if (!cfg.baseUrl || !cfg.model) { toast('请先填写 API 地址与模型'); return; }
  var el = document.getElementById('aiStatus');
  if (el) el.textContent = '测试中…';
  aiChat(cfg, '回复两个字：正常', { maxTokens: 20, timeout: 30000 })
    .then(function (out) {
      if (el) el.innerHTML = '<span style="color:var(--ok)">✔ 连接正常</span>　模型回复：' + esc(String(out).slice(0, 60));
    })
    .catch(function (err) {
      if (el) el.innerHTML = '<span style="color:var(--danger)">✘ ' + esc(err.message) + '</span>';
    });
}
function fillAiProvider() {
  var sel = document.getElementById('aiProvider');
  if (!sel) return;
  var p = aiProviderPreset(sel.value);
  if (p.key === 'custom') { toast('自定义：请手动填写地址与模型'); return; }
  var bu = document.querySelector('#sheetBody [name="baseUrl"]');
  var md = document.querySelector('#sheetBody [name="model"]');
  var vm = document.querySelector('#sheetBody [name="visionModel"]');
  if (bu) bu.value = p.url;
  if (md) md.value = p.model;
  if (vm) vm.value = p.vision || '';
  toast('已填充「' + p.name + '」的地址与模型');
}

/* ================= 导出 / 导入 ================= */
function downloadBlob(blob, filename) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function csvCell(s) { s = String(s == null ? '' : s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function exportCsv() {
  var lines = [];
  var rows1 = [['住院号', '姓名', '性别', '年龄', '诊断', '目的', '技术', '主管医生', '处方', '加量', '开始日期', '预计结束', '已治', '累计剂量(Gy)', '未执行', '未闭环副反应', '今日待办', '中断']];
  var todoMap = {};
  buildTodo().forEach(function (it) { todoMap[it.p.id] = it.reasons.join('；'); });
  inTreat().forEach(function (p) {
    var boost = parseInt(p.boostFractions, 10) || 0;
    rows1.push([
      p.mrn || '', p.name || '', p.sex || '', p.age || '', p.diagnosis || '', p.purpose || '', p.technique || '', p.physician || '',
      (p.totalDose ? p.totalDose + 'Gy/' + p.fractions + '次' : ''), (boost ? boost + '次' + (p.boostNote ? '(' + p.boostNote + ')' : '') : ''),
      dateOnly(p.startDate), scheduleEnd(p),
      doneCount(p) + '/' + plannedCount(p), accumulatedDose(p).toFixed(1),
      (p.stopDate ? ('终止于' + dateOnly(p.stopDate) + '，未执行' + stoppedShortOf(p) + '次') : ''),
      openReactions(p).length, todoMap[p.id] || '',
      (p.pauses || []).map(function (x) { return dateOnly(x.from) + '~' + dateOnly(x.to) + (x.reason ? '(' + x.reason + ')' : ''); }).join('；')
    ]);
  });
  lines.push('交班摘要');
  rows1.forEach(function (r) { lines.push(r.map(csvCell).join(',')); });

  lines.push('', '治疗日程明细');
  lines.push(['住院号', '姓名', '第几次', '日期', '星期', '状态', '是否加照', '备注'].join(','));
  state.patients.forEach(function (p) {
    computeSchedule(p).forEach(function (it) {
      lines.push([p.mrn || '', p.name || '', it.fraction, it.date, WEEKDAYS[parseD(it.date).getDay()],
        it.done ? '已完成' : '待治疗', it.extra ? '加照' : '',
        it.reason || (inPause(p, it.date) ? '中断期' : '')].map(csvCell).join(','));
    });
  });

  lines.push('', '副反应记录');
  lines.push(['住院号', '姓名', '部位', '分级', '发现时间', '内容', '处理', '状态', '计划复查'].join(','));
  state.patients.forEach(function (p) {
    (p.reactions || []).forEach(function (r) {
      lines.push([p.mrn || '', p.name || '', r.site, r.grade, fmtDT(r.foundAt), r.content, r.plan, r.status, r.nextCheckAt ? fmtDT(r.nextCheckAt) : ''].map(csvCell).join(','));
    });
  });

  downloadBlob(new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }), '放疗交班_' + todayStr() + '.csv');
  toast('已导出 CSV');
}
function exportJson() {
  /* 备份文件同时带上设置层（节假日/调休/模板/默认治疗日）——
     否则「导出→导入」换设备后，同一患者会因假期不同算出不同的结束日期。
     结构：{ ...患者数据, settings: {...} }，把 settings 作为 state 的兄弟字段；
     老版本应用读这个文件时会忽略多出来的 settings，不影响兼容。 */
  var out = {};
  Object.keys(state).forEach(function (k) { out[k] = state[k]; });
  out.settings = exportSettings();
  downloadBlob(new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' }), '放疗患者备份_' + todayStr() + '.json');
  toast('已导出 JSON 备份（含设置）');
}
/* ================= 导入：合并 / 覆盖 ================= */
var pendingImport = null;

function importJson(file) {
  var reader = new FileReader();
  reader.onload = function () {
    var d;
    try { d = JSON.parse(reader.result); } catch (e) { alert('导入失败：文件内容不是有效的 JSON'); return; }
    if (!d || !Array.isArray(d.patients)) { alert('导入失败：这不是本应用的备份文件'); return; }
    /* 设置层：老备份文件没有 settings 字段，此时静默跳过（不报错、不清空） */
    var sm = importSettings(d.settings, true);
    if (sm.changed) { save(); settingsDirtyAt = ''; toast('已并入备份里的设置（' + sm.details.length + ' 项）'); }
    askImportMode(normalize(d));
  };
  reader.onerror = function () { alert('读取文件失败，请重试'); };
  reader.readAsText(file);
}

/* from 可选：{ label, desc } —— 用于标注来源（文件导入 / 云端拉取） */
function askImportMode(inc, from) {
  pendingImport = inc;
  var src = from || {};
  var srcLabel = src.label || '备份文件';
  var mine = state.patients.length, theirs = inc.patients.length;
  var mineNames = state.patients.map(function (p) { return p.name; }).join('、') || '无';
  openSheet({
    title: '选择导入方式',
    body: '<div class="hint" style="margin-bottom:10px;line-height:1.75">' + esc(srcLabel) + '含 <b>' + theirs + '</b> 位患者；本机现有 <b>' + mine + '</b> 位。' +
      (src.desc ? '<br><span style="color:var(--sub)">' + esc(src.desc) + '</span>' : '') + '</div>' +
      '<div class="event"><div class="head"><span class="chip pri">合并导入（推荐）</span></div>' +
      '<div class="content" style="font-weight:400">两边新增的患者与记录都会保留，按患者自动去重合并，<b>不会丢数据</b>。</div>' +
      '<div class="t">适合两台设备各自录过数据后合并</div></div>' +
      '<div class="event"><div class="head"><span class="chip warn">覆盖导入</span></div>' +
      '<div class="content" style="font-weight:400">用' + esc(srcLabel) + '<b>完全替换</b>本机数据，本机现有内容将丢失。</div>' +
      '<div class="t">仅在换新手机、需要完整搬迁时使用</div></div>' +
      '<div class="hint" style="padding:12px 4px 4px;line-height:1.7;border-top:1px dashed var(--line);margin-top:12px">本机现有：' + esc(mineNames) + '</div>',
    actions: [
      { label: '合并导入（推荐）', act: 'import-merge', primary: true, full: true },
      { label: '覆盖导入', act: 'import-overwrite', full: true }
    ]
  });
}

/* 按患者合并：以本机为基础，把备份里新增的内容并入，不删任何东西 */
function mergeImport(inc) {
  var base = normalize(state);
  var byId = {}, byKey = {};
  base.patients.forEach(function (p) { byId[p.id] = p; if (p.name || p.mrn) byKey[pkey(p)] = p; });

  var added = 0, merged = 0;
  inc.patients.forEach(function (ip) {
    var target = byId[ip.id];
    if (!target && (ip.name || ip.mrn)) target = byKey[pkey(ip)];
    if (!target) {
      base.patients.push(ip);
      byId[ip.id] = ip;
      if (ip.name || ip.mrn) byKey[pkey(ip)] = ip;
      added++;
      return;
    }
    mergePatient(target, ip);
    merged++;
  });
  return { state: base, added: added, merged: merged };
}
function pkey(p) { return (p.name || '') + '|' + (p.mrn || ''); }

/* 合并时「按记录并集」的字段（有 id 的集合） */
var MERGE_SET_FIELDS = ['reactions', 'pauses', 'extras', 'followupPlans', 'notes'];
/* 合并时「按值并集」的字段（纯值数组，如已完成日期） */
var MERGE_VALUE_FIELDS = ['doneDates'];
/* 需要特殊处理的字段（不参与自动标量合并） */
var MERGE_SKIP = ['id', 'treatDays', 'status', 'doneDates', 'pauses', 'extras',
  'reactions', 'followupPlans', 'notes', 'stopDate'];

function mergePatient(base, inc) {
  /* 标量字段：遍历 normalize() 产出的实际键自动合并，
     避免"新增字段忘记加入白名单"导致跨设备同步静默丢数据（BUG-02） */
  Object.keys(inc).forEach(function (k) {
    if (MERGE_SKIP.indexOf(k) >= 0) return;
    if (MERGE_SET_FIELDS.indexOf(k) >= 0 || MERGE_VALUE_FIELDS.indexOf(k) >= 0) return;
    if (base[k] === undefined) { base[k] = inc[k]; return; }
    if ((base[k] === '' || base[k] === null) && inc[k] !== '' && inc[k] != null) base[k] = inc[k];
  });
  /* 集合字段：按记录 id 并集去重 */
  MERGE_SET_FIELDS.forEach(function (k) {
    base[k] = unionById(base[k] || [], inc[k] || []);
  });
  /* 纯值数组 */
  MERGE_VALUE_FIELDS.forEach(function (k) {
    base[k] = unionValues(base[k] || [], inc[k] || []);
  });
  /* 治疗日：排程规则，不是记录集合 —— 取一侧，不做并集（BUG-09）。
     本机未设置时用备份的 */
  if (!(base.treatDays && base.treatDays.length) && inc.treatDays && inc.treatDays.length) {
    base.treatDays = inc.treatDays.slice().map(Number).sort();
  }
  /* 提前终止：取更早的终止日（更严格的一侧），避免合并后疗程被放宽 */
  if (inc.stopDate) {
    if (!base.stopDate || dateOnly(inc.stopDate) < dateOnly(base.stopDate)) base.stopDate = inc.stopDate;
  }
  /* 状态：已完成优先保留，避免被「在治」覆盖 */
  if (inc.status === '治疗完成' && base.status !== '治疗完成') base.status = '治疗完成';
}

/* 副反应状态机的推进程度（数值越大越"靠后"，合并时取更靠后的） */
var STATUS_RANK = { '未处理': 1, '已处理待复查': 2, '已复查未解除': 3, '已解除': 4, '长期随访': 5 };

/* 按 id 并集；同一条记录的两份副本会合并其追踪记录、状态与空字段 */
function unionById(a, b) {
  var seen = {}, out = [];
  a.concat(b).forEach(function (x) {
    if (!x) return;
    var key = x.id || JSON.stringify(x);
    if (seen[key]) {
      var t = seen[key];
      /* 追踪记录：并集去重 */
      if (Array.isArray(x.followups) || Array.isArray(t.followups)) {
        t.followups = unionById(t.followups || [], x.followups || []);
      }
      /* 追踪状态：取推进更深的那一侧，避免已处理的信息被「未处理」覆盖 */
      if (x.status && t.status && STATUS_RANK[x.status] && STATUS_RANK[t.status]) {
        if (STATUS_RANK[x.status] > STATUS_RANK[t.status]) {
          t.status = x.status;
          if (x.closedAt) t.closedAt = x.closedAt;
        }
      }
      /* 随访计划：任一侧已完成即视为已完成 */
      if (x.done === true && t.done !== true) { t.done = true; if (x.doneAt) t.doneAt = x.doneAt; }
      /* 其余字段：本机为空时用另一侧补上 */
      Object.keys(x).forEach(function (k) {
        if (k === 'followups' || k === 'id' || k === 'status' || k === 'done') return;
        if ((t[k] === '' || t[k] == null) && x[k]) t[k] = x[k];
      });
    } else {
      seen[key] = x; out.push(x);
    }
  });
  return out;
}
function unionValues(a, b) {
  var seen = {}, out = [];
  a.concat(b).forEach(function (x) { var k = String(x); if (!seen[k]) { seen[k] = 1; out.push(x); } });
  return out;
}

/* 依据模板顺序，生成某次随访之后的下一次 */
function nextAfter(p, f) {
  var tpl = followupTemplate(p);
  if (!tpl.length) return null;
  var idx = -1;
  for (var i = 0; i < tpl.length; i++) {
    if (tpl[i].offsetN === f.offsetN && tpl[i].offsetUnit === f.offsetUnit) { idx = i; break; }
  }
  if (idx < 0 || idx + 1 >= tpl.length) return null;   /* 已是最后一次 */
  var t = tpl[idx + 1];

      var to = v.to || v.from;

function findAct(el, acts) {
  var cur = el;
  while (cur && cur !== document) {
    if (cur.dataset && cur.dataset.act) { var f = acts[cur.dataset.act]; if (f) return { el: cur, fn: f }; }
    cur = cur.parentElement;
  }
  return null;
}
function shiftCal(n) {
  var m = view.calM + n, y = view.calY;
  if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }

}
