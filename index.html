<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>放疗患者管理</title>
<meta name="description" content="放疗科患者管理（离线使用，数据只存本机）">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="放疗管理">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{
  --bg:#f2f4f7; --card:#ffffff; --line:#e3e7ee; --text:#1b2430; --sub:#6b7686;
  --pri:#0f766e; --pri-soft:#e5f3f1; --warn:#b45309; --warn-soft:#fdf0e0;
  --danger:#c0392b; --danger-soft:#fdecea; --ok:#0f766e; --ok-soft:#e5f3f1;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--text); background:var(--bg); -webkit-text-size-adjust:100%;
  display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
.hint{color:var(--sub);font-size:13px}

.topbar{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:#fff;border-bottom:1px solid var(--line)}
.topbar h1{flex:1;margin:0;font-size:18px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{min-width:44px;height:44px;border:0;background:transparent;border-radius:10px;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn:active{background:var(--bg)}
.iconbtn[hidden]{display:none}

#view{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 28px}
.section{margin:0 0 14px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 8px;font-size:14px;color:var(--sub);font-weight:600}

.tabbar{flex:0 0 auto;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar[hidden]{display:none}
.tabbar button{flex:1;border:0;background:transparent;padding:9px 2px 7px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative}
.tabbar button .ico{font-size:19px;line-height:1}
.tabbar button.on{color:var(--pri);font-weight:600}
.tabbar .dot{position:absolute;top:4px;right:calc(50% - 24px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:600}
.tabbar .dot[hidden]{display:none}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;margin-bottom:10px}
.pcard{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.pcard:active{background:#fafbfc}
.badgebox{flex:0 0 auto;min-width:52px;padding:6px 6px;border-radius:10px;background:var(--pri-soft);color:var(--pri);text-align:center}
.badgebox .b{font-size:19px;font-weight:700;line-height:1.2;word-break:break-all}
.badgebox .t{font-size:11px;opacity:.8}
.pcard .pbody{flex:1;min-width:0}
.line1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pname{font-size:17px;font-weight:600}
.pdiag{margin-top:3px;font-size:14px;color:#39424f;word-break:break-all}
.pmeta{margin-top:4px;font-size:12px;color:var(--sub);line-height:1.6}
.pmeta b{font-weight:600;color:#4a5464}

.progress{height:8px;border-radius:4px;background:#eef1f5;overflow:hidden;margin-top:6px}
.progress .fill{height:100%;background:var(--pri);border-radius:4px}
.progress.warn .fill{background:var(--warn)}

.chip{display:inline-block;padding:1px 7px;border-radius:999px;font-size:12px;line-height:18px;background:#eef1f5;color:#4a5464;white-space:nowrap}
.chip.pri{background:var(--pri-soft);color:var(--pri)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.danger{background:var(--danger-soft);color:var(--danger)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.sm{font-size:11px;line-height:16px;padding:0 6px}
.count{display:inline-block;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--danger);color:#fff;font-size:12px;line-height:20px;text-align:center;font-weight:600}

.todocard{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.todocard:active{background:#fafbfc}
.todo-reasons{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}

.kv{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv .k{flex:0 0 82px;color:var(--sub)}
.kv .v{flex:1;word-break:break-all}
.hero{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.hero .badgebox{min-width:62px}
.hero .pname{font-size:20px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.event{padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff}
.event .head{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.event .content{font-size:15px;font-weight:600;word-break:break-all}
.event .t{font-size:12px;color:var(--sub);margin-top:2px}
.event .blk{margin-top:8px;padding:8px 10px;border-radius:9px;background:#f7f9fb;font-size:14px}
.event .blk .blk-t{font-size:12px;color:var(--sub);margin-bottom:2px}
.event .fu{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin-top:4px}
.event .fu .fut{flex:0 0 auto;font-size:12px;color:var(--sub);padding-top:1px}
.event .fu .fuc{flex:1;min-width:0;word-break:break-all}
.event .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;min-height:40px;font-size:14px;cursor:pointer}
.btn:active{background:#f4f6f9}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.primary:active{background:#0a5f58}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:#f0c9c4;background:#fff}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn.block{display:block;width:100%;text-align:center}
.btn[disabled]{opacity:.5}
.addbtn{color:var(--pri);border-color:#cfe2dc;background:var(--pri-soft)}

.empty{text-align:center;color:var(--sub);padding:44px 20px;font-size:14px}
.empty .big{font-size:34px;display:block;margin-bottom:8px;opacity:.5}

/* ---------- 日历 ---------- */
.cal-wrap{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 10px 12px;margin-bottom:10px}
.cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 2px}
.cal-top .mt{font-size:15px;font-weight:600}
.cal-nav{display:flex;gap:6px;align-items:center}
.cal-nav button{border:1px solid var(--line);background:#fff;border-radius:8px;min-width:34px;height:32px;font-size:15px;cursor:pointer;line-height:1}
.cal-nav button:active{background:#f4f6f9}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{text-align:center;font-size:11px;color:var(--sub);padding:3px 0;font-weight:600}
.cal-dow.we{color:var(--danger)}
.cal-cell{min-height:48px;border-radius:8px;background:#f7f9fb;padding:3px 4px;font-size:12px;display:flex;flex-direction:column;gap:1px;position:relative;border:1px solid transparent;overflow:hidden}
.cal-cell.out{opacity:.3}
.cal-cell.today{border-color:var(--pri);background:#fff}
.cal-cell.hol{background:#fdecea}
.cal-cell.hol .d{color:var(--danger)}
.cal-cell.mk{background:#fdf0e0}
.cal-cell .d{font-size:12px;font-weight:600;line-height:1.25}
.cal-cell .d.we{color:var(--danger)}
.cal-cell .tagline{font-size:10px;line-height:1.3;border-radius:4px;padding:1px 3px;background:var(--pri-soft);color:var(--pri);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-cell .tagline.done{opacity:.65;text-decoration:line-through}
.cal-cell .tagline.boost{background:#EEEDFE;color:#534AB7}
.cal-cell .tagline.miss{background:var(--danger-soft);color:var(--danger);text-decoration:none}
.cal-cell .tagline.extra{background:var(--warn-soft);color:var(--warn)}
.cal-cell .tagline.pause{background:#eef1f5;color:var(--sub)}
.cal-cell .cnt{font-size:10px;color:var(--pri);font-weight:700;line-height:1.3}
.cal-cell.clickable{cursor:pointer}
.cal-cell.clickable:active{background:#e9eef4}
.cal-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-top:9px;padding:0 2px}
.cal-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:middle}
.cal-day-list .row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)}
.cal-day-list .row:last-child{border-bottom:0}
.cal-day-list .row .nm{flex:1;font-size:14px}
.cal-day-list .row .nm b{font-weight:600}
.cal-day-list .row .sub2{font-size:12px;color:var(--sub)}

.mask{position:fixed;inset:0;background:rgba(16,24,40,.42);z-index:40;opacity:0;transition:opacity .18s}
.mask[hidden]{display:none}
.mask.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-radius:16px 16px 0 0;transform:translateY(102%);transition:transform .22s ease-out;display:flex;flex-direction:column;max-height:88vh;padding-bottom:env(safe-area-inset-bottom)}
.sheet.show{transform:translateY(0)}
.sheet .sh-bar{display:flex;align-items:center;padding:6px 8px 6px 16px;border-bottom:1px solid var(--line)}
.sheet .sh-title{flex:1;font-size:16px;font-weight:600}
.sheet .sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 8px}
.sheet .sh-foot{display:flex;gap:8px;padding:10px 16px 16px;border-top:1px solid var(--line)}
.sheet .sh-foot .btn{flex:1}
/* hidden 必须能真正隐藏：.sheet .sh-foot 的 display:flex 会覆盖 hidden 属性，
   这里显式补上，否则隐藏操作区后仍留空占位与多余按钮 */
#sheetFoot[hidden]{display:none!important}
#sheetOk[hidden],#sheetCancel[hidden]{display:none!important}
.sh-foot-inner{display:flex;gap:8px;flex-wrap:wrap}
.sh-foot-inner .btn{flex:1 1 calc(50% - 4px);min-width:0}
.sh-foot-inner .btn.full{flex:1 1 100%}

.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;background:#fff;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pri)}
.field textarea{min-height:76px;resize:vertical}
.field2{display:flex;gap:10px}
.field2 .field{flex:1}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri);font-weight:600}

.setgrp{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.setrow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.setrow:last-child{border-bottom:0}
.setrow:active{background:#fafbfc}
.setrow .n{flex:1;font-size:15px}
.setrow .sub2{font-size:12px;color:var(--sub);margin-top:2px}
.setrow .arw{color:var(--sub);font-size:18px}
.holitem{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px}
.holitem:last-child{border-bottom:0}
.holitem .dt{flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--sub);font-size:13px}
.holitem .nm{flex:1}
.holitem .x{flex:0 0 auto;border:0;background:transparent;color:var(--danger);font-size:16px;cursor:pointer;padding:4px 6px}

/* ---------- 平板 / 电脑：居中为手机宽度 ---------- */
@media (min-width:700px){
  body{max-width:560px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .mask{max-width:560px;margin-left:auto;margin-right:auto}
  .sheet{max-width:560px;margin-left:auto;margin-right:auto}
}
</style>
</head>
<body>
<header class="topbar">
  <button class="iconbtn" id="btnBack" hidden>‹</button>
  <h1 id="title">放疗患者管理</h1>
  <button class="iconbtn" id="btnData">⋯</button>
</header>
<main id="view"></main>
<nav class="tabbar" id="tabbar">
  <button data-tab="todo"><span class="ico">📌</span>待办<span class="dot" id="dotTodo" hidden></span></button>
  <button data-tab="ward"><span class="ico">🏥</span>在治<span class="dot" id="dotWard" hidden></span></button>
  <button data-tab="cal"><span class="ico">📅</span>日历</button>
  <button data-tab="done"><span class="ico">📁</span>完成</button>
</nav>
<div class="mask" id="mask" hidden></div>
<div class="sheet" id="sheet">
  <div class="sh-bar"><div class="sh-title" id="sheetTitle"></div><button class="iconbtn" id="sheetClose">✕</button></div>
  <div class="sh-body" id="sheetBody"></div>
  <div class="sh-foot" id="sheetFoot">
    <div class="sh-foot-inner" id="sheetFootInner">
      <button class="btn" id="sheetCancel">取消</button>
      <button class="btn primary" id="sheetOk">保存</button>
    </div>
  </div>
</div>
<script>
/* ================= 常量 ================= */
var LS_KEY = 'radiotherapy.v1';
var SNAP_PREFIX = 'radiotherapy.snap.';
var SNAP_KEEP = 7;
var APP_VERSION = '0.8.0';

var SEXES = ['男', '女'];
var PURPOSES = ['根治性', '术后辅助', '术前新辅助', '姑息性'];
var TECHNIQUES = ['IMRT', 'VMAT', 'SBRT', '3D-CRT', '电子线', 'TOMO', '其他'];
var PLAN_STATUSES = ['待定位', '待勾画', '待计划', '待验证', '已通过'];
var REACTION_SITES = ['皮肤反应', '口腔黏膜炎', '放射性食管炎', '放射性肺炎', '放射性肠炎', '放射性膀胱炎', '骨髓抑制', '乏力', '其他'];
var GRADES = ['1级（轻）', '2级（中）', '3级（重）', '4级（危及生命）'];
var REACTION_STATUSES = ['未处理', '已处理待复查', '已复查未解除', '已解除', '长期随访'];
var OPEN_STATUSES = ['未处理', '已处理待复查', '已复查未解除'];
var PATIENT_STATUSES = ['在治', '治疗完成', '失访'];
/* 历史版本状态映射（v0.1 → 当前）：避免更新应用后患者的旧状态被静默改写
   v0.1 的「暂停」在新版由 pauses 中断区间表达（状态回到「在治」+ 续存中断记录）；
   v0.1 的「随访中」在新版由「治疗完成」+ 随访计划表达。 */
var LEGACY_STATUS_MAP = { '暂停': '在治', '随访中': '治疗完成' };
/* 当前数据格式版本。LS_KEY 与 SCHEMA_VERSION 一旦发布就不能再改，
   否则老用户的数据将读不出来（浏览器按 key 存储）。 */
var SCHEMA_VERSION = 2;
var WEEKDAYS = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
var WD_ORDER = [1, 2, 3, 4, 5, 6, 0];
var DEFAULT_TREAT_DAYS = [1, 2, 3, 4, 5];

/* ================= 内置法定节假日数据 =================
   来源：国务院办公厅历年《关于部分节假日安排的通知》
   只作为「内置层」，用户可在设置中增删（存入独立覆盖层，升级不会丢失）。
   未内置的年份（如 2027 年及以后，国务院通常于前一年 11 月公布）
   会自动降级为「周一~周五为工作日、周末休息」排程。            */
var BUILTIN_HOLIDAYS = (function () {
  var o = {};
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function one(y, m, d, n) { o[y + '-' + p2(m) + '-' + p2(d)] = n; }
  function span(y, m, a, b, n) { for (var d = a; d <= b; d++) one(y, m, d, n); }

  /* —— 2025 年（国办发明电〔2024〕12号）—— */
  one(2025, 1, 1, '元旦');
  span(2025, 1, 28, 31, '春节'); span(2025, 2, 1, 4, '春节');
  span(2025, 4, 4, 6, '清明');
  span(2025, 5, 1, 5, '劳动节');
  one(2025, 5, 31, '端午'); span(2025, 6, 1, 2, '端午');
  span(2025, 10, 1, 8, '国庆中秋');

  /* —— 2026 年（国办发明电〔2025〕x号）—— */
  span(2026, 1, 1, 3, '元旦');
  span(2026, 2, 15, 23, '春节');
  span(2026, 4, 4, 6, '清明');
  span(2026, 5, 1, 5, '劳动节');
  span(2026, 6, 19, 21, '端午');
  span(2026, 9, 25, 27, '中秋');
  span(2026, 10, 1, 7, '国庆');
  return o;
})();

/* 调休上班的周末（按工作日治疗，可在设置中关闭或增删） */
var BUILTIN_MAKEUPS = (function () {
  var o = {};
  function one(y, m, d, n) { o[y + '-' + (m < 10 ? '0' : '') + m + '-' + (d < 10 ? '0' : '') + d] = n; }
  /* 2025 */
  one(2025, 1, 26, '春节调休'); one(2025, 2, 8, '春节调休');
  one(2025, 4, 27, '劳动节调休');
  one(2025, 9, 28, '国庆调休'); one(2025, 10, 11, '国庆调休');
  /* 2026 */
  one(2026, 1, 4, '元旦调休'); one(2026, 2, 14, '春节调休'); one(2026, 2, 28, '春节调休');
  one(2026, 5, 9, '劳动节调休'); one(2026, 9, 20, '国庆调休'); one(2026, 10, 10, '国庆调休');
  return o;
})();

/* 内置数据覆盖的年份 */
var BUILTIN_YEARS = (function () {
  var s = {};
  Object.keys(BUILTIN_HOLIDAYS).forEach(function (d) { s[d.slice(0, 4)] = 1; });
  return Object.keys(s).sort();
})();

/* ================= 基础工具 ================= */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function uid(p) { return p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }
function pad2(n) { n = parseInt(n, 10); return (n < 10 ? '0' : '') + n; }
function dstr(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayStr() { return dstr(new Date()); }
function nowLocalInput() { var d = new Date(); return dstr(d) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function fmtDT(s) { return s ? String(s).replace('T', ' ') : ''; }
function dateOnly(s) { return String(s || '').slice(0, 10); }
function parseD(s) { var d = new Date(String(s).slice(0, 10) + 'T00:00:00'); return isNaN(d.getTime()) ? null : d; }
function daysBetween(from, to) { var a = parseD(from), b = parseD(to); if (!a || !b) return 0; return Math.round((b - a) / 86400000); }
function addDays(s, n) { var d = parseD(s); if (!d) return s; d.setDate(d.getDate() + n); return dstr(d); }
function isOpen(r) { return OPEN_STATUSES.indexOf(r.status) >= 0; }
function mdLabel(s) { return String(s || '').slice(5).replace('-', '/'); }

/* ================= 数据读写 =================
   数据安全三道保护：
   1) 迁移前自动留一份原始数据（万一格式转换有问题可回退）
   2) 读不出来时「禁止保存」，避免空数据覆盖掉历史记录
   3) 归一化过程容错，单个患者字段异常不影响其他患者          */
var state = emptyState();
var loadError = false;      /* 数据读取失败（不可解析）→ 禁止写入 */
var rawSnapshot = null;     /* 读取失败时保留的原始文本，供抢救导出 */
var migrateNotice = '';     /* 迁移提示文案 */

var BACKUP_PREFIX = 'radiotherapy.backup.';
var BACKUP_KEEP = 3;

function emptyState() { return { version: SCHEMA_VERSION, updatedAt: '', patients: [] }; }

function load() {
  /* 每次读取都重置标记与状态，避免上一次的结果残留 */
  loadError = false;
  rawSnapshot = null;
  migrateNotice = '';
  state = emptyState();

  var raw = null;
  try { raw = localStorage.getItem(LS_KEY); }
  catch (e) { loadError = true; return; }

  if (!raw) return;                       /* 首次使用，无数据属正常 */

  var d = null;
  try { d = JSON.parse(raw); }
  catch (e) {                             /* 内容损坏：保留原文，禁止写入 */
    console.warn('数据解析失败', e);
    loadError = true; rawSnapshot = raw;
    return;
  }
  if (!d || !Array.isArray(d.patients)) { /* 结构异常：同样保护 */
    loadError = true; rawSnapshot = raw;
    return;
  }

  /* 迁移前自动备份原始数据 */
  var fromV = parseInt(d.version, 10) || 1;
  if (fromV < SCHEMA_VERSION) {
    try {
      var bk = BACKUP_PREFIX + 'v' + fromV + '.' + todayStr();
      if (!localStorage.getItem(bk)) localStorage.setItem(bk, raw);
      backupKeys().slice(BACKUP_KEEP).forEach(function (k) { localStorage.removeItem(k); });
      migrateNotice = '已自动备份更新前的数据（原始格式 v' + fromV + '）';
    } catch (e) { }
  }

  try { state = normalize(d); }
  catch (e) {                             /* 归一化意外失败 → 保护原始数据 */
    console.warn('数据归一化失败', e);
    loadError = true; rawSnapshot = raw;
    state = emptyState();
  }
}

function backupKeys() {
  var ks = [];
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf(BACKUP_PREFIX) === 0) ks.push(k);
    }
  } catch (e) { }
  return ks.sort();
}

/* 把任意历史版本的数据归一化为当前格式。
   原则：只做「补齐」，不丢弃任何已有内容。 */
function normalize(d) {
  var out = { version: SCHEMA_VERSION, updatedAt: d.updatedAt || '', patients: [] };
  (d.patients || []).forEach(function (p) {
    if (!p || typeof p !== 'object') return;      /* 跳过异常条目，不影响其余患者 */

    /* 旧字段 plannedStartDate 迁移为 startDate；旧 sessions 并入 doneDates */
    var start = p.startDate || p.plannedStartDate || '';
    var done = (p.doneDates || []).slice();
    (p.sessions || []).forEach(function (s) {
      var ds = dateOnly(s && s.date);
      if (ds && done.indexOf(ds) < 0) done.push(ds);
    });

    /* 状态：当前值直接用；旧版本值按映射表转换；不认识的值退回「在治」 */
    var st = PATIENT_STATUSES.indexOf(p.status) >= 0 ? p.status
      : (LEGACY_STATUS_MAP[p.status] || '在治');

    out.patients.push({
      id: p.id || uid('p'), mrn: p.mrn || '', name: p.name || '', sex: SEXES.indexOf(p.sex) >= 0 ? p.sex : '', age: p.age || '',
      physician: p.physician || '', diagnosis: p.diagnosis || '', purpose: PURPOSES.indexOf(p.purpose) >= 0 ? p.purpose : '',
      technique: TECHNIQUES.indexOf(p.technique) >= 0 ? p.technique : '',
      simDate: p.simDate || '', position: p.position || '', planStatus: PLAN_STATUSES.indexOf(p.planStatus) >= 0 ? p.planStatus : '',
      totalDose: p.totalDose || '', fractions: p.fractions || '', dosePerFraction: p.dosePerFraction || '',
      startDate: start,
      treatDays: (p.treatDays && p.treatDays.length) ? p.treatDays : treatDaysCfg(),
      pauses: (p.pauses || []).map(function (x) { return { id: x.id || uid('pa'), from: x.from || '', to: x.to || '', reason: x.reason || '' }; }),
      extras: (p.extras || []).map(function (x) { return { id: x.id || uid('ex'), date: x.date || '', reason: x.reason || '' }; }),
      /* 计划调整：加量（原计划结束后追加）与提前终止（排程截止日） */
      boostFractions: p.boostFractions == null ? '' : String(p.boostFractions),
      boostNote: p.boostNote || '',
      stopDate: p.stopDate || '',
      doneDates: done,
      reactions: (p.reactions || []).map(function (r) {
        return {
          id: r.id || uid('r'), site: REACTION_SITES.indexOf(r.site) >= 0 ? r.site : (r.site || '其他'), grade: GRADES.indexOf(r.grade) >= 0 ? r.grade : (r.grade || ''),
          foundAt: r.foundAt || '', content: r.content || '', plan: r.plan || '', planAt: r.planAt || '',
          status: REACTION_STATUSES.indexOf(r.status) >= 0 ? r.status : '未处理', nextCheckAt: r.nextCheckAt || '',
          followups: (r.followups || []).map(function (f) { return { id: f.id || uid('f'), at: f.at || '', content: f.content || '' }; }),
          closedAt: r.closedAt || '', readAt: r.readAt || ''
        };
      }),
      followupPlans: (p.followupPlans || []).map(function (f) {
        /* 旧版随访只存 dueDate；这里按「治疗完成日 → 到期日」反推间隔，迁移到新结构 */
        var base = f.baseDate || p.completedAt || '';
        var n = f.offsetN, u = f.offsetUnit;
        if (!n || !u) {
          var inf = inferInterval(base, f.dueDate);
          if (inf) { n = inf.n; u = inf.u; }
          else { n = 0; u = 'm'; }
        }
        return {
          id: f.id || uid('fp'), baseDate: base, offsetN: n, offsetUnit: u,
          dueDate: f.dueDate || '', note: f.note || '', done: !!f.done, doneAt: f.doneAt || ''
        };
      }),
      notes: (p.notes || []).map(function (n) { return { id: n.id || uid('n'), at: n.at || '', content: n.content || '' }; }),
      status: st, completedAt: p.completedAt || ''
    });
  });
  return out;
}

function save() {
  /* 读取失败时禁止写入：否则会把空数据覆盖到原有记录上 */
  if (loadError) {
    alert('为保护原有数据，本次未保存。\n\n上次打开时未能读取本机数据，原数据仍完整保留在本机。\n请先用「⋯ → 导出原始数据（抢救）」保存一份，再联系我们处理。');
    return false;
  }
  state.updatedAt = new Date().toISOString();
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); return true; }
  catch (e) { alert('保存失败：手机存储空间可能已满，请先导出备份并清理旧数据。'); return false; }
}

function lsGet(k, def) { try { var v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }

/* 用户覆盖层：{date:'名称'} = 新增或覆盖；{date:null} = 删除内置项。
   与内置层分离，内置数据升级后用户的增删依然保留。 */
function mergeLayer(base, ov) {
  var out = {};
  Object.keys(base).forEach(function (k) { out[k] = base[k]; });
  Object.keys(ov || {}).forEach(function (k) { if (ov[k] === null) delete out[k]; else out[k] = ov[k]; });
  return out;
}
function holidayOverride() { var v = lsGet('radiotherapy.holidays', null); return (v && typeof v === 'object') ? v : {}; }
function makeupOverride() { var v = lsGet('radiotherapy.makeups', null); return (v && typeof v === 'object') ? v : {}; }
function holidays() { return mergeLayer(BUILTIN_HOLIDAYS, holidayOverride()); }
function makeups() { return mergeLayer(BUILTIN_MAKEUPS, makeupOverride()); }
function setHoliday(date, name) { var o = holidayOverride(); o[date] = name; lsSet('radiotherapy.holidays', o); }
function delHoliday(date) { var o = holidayOverride(); o[date] = null; lsSet('radiotherapy.holidays', o); }
function resetHoliday(date) { var o = holidayOverride(); delete o[date]; lsSet('radiotherapy.holidays', o); }
function setMakeup(date, name) { var o = makeupOverride(); o[date] = name; lsSet('radiotherapy.makeups', o); }
function delMakeup(date) { var o = makeupOverride(); o[date] = null; lsSet('radiotherapy.makeups', o); }
function isBuiltinHol(date) { return Object.prototype.hasOwnProperty.call(BUILTIN_HOLIDAYS, date); }
function isBuiltinMk(date) { return Object.prototype.hasOwnProperty.call(BUILTIN_MAKEUPS, date); }

/* 已录入节假日数据的年份（内置年份 + 用户新增年份；删除个别日期不影响年份判断） */
function coveredYears() {
  var s = {};
  BUILTIN_YEARS.forEach(function (y) { s[y] = 1; });
  var ov = holidayOverride();
  Object.keys(ov).forEach(function (d) { if (ov[d] !== null) s[d.slice(0, 4)] = 1; });
  return Object.keys(s).sort();
}
/* [from, to] 区间内「无节假日数据」的年份 —— 这些年份自动降级为「工作日+周末」排程 */
function missingHolidayYears(from, to) {
  var y1 = parseInt(String(from || '').slice(0, 4), 10);
  var y2 = parseInt(String(to || from || '').slice(0, 4), 10);
  if (!y1 || !y2) return [];
  var cov = {};
  coveredYears().forEach(function (y) { cov[y] = 1; });
  var out = [];
  for (var y = y1; y <= y2; y++) if (!cov[y]) out.push(y);
  return out;
}

/* 图片压缩：手机原图动辄数 MB，压到最长边 1600px 再转 base64，避免请求过大 */
function compressImage(file, cb) {
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      var maxSide = 1600;
      var scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      var w = Math.max(1, Math.round(img.width * scale));
      var h = Math.max(1, Math.round(img.height * scale));
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      try { cb(c.toDataURL('image/jpeg', 0.82)); }
      catch (e) { cb(reader.result); }
    };
    img.onerror = function () { cb(null); };
    img.src = reader.result;
  };
  reader.onerror = function () { cb(null); };
  reader.readAsDataURL(file);
}

/* 从模型输出里稳妥地取出 JSON（可能被 markdown 包裹或带前后话术） */
function extractJson(s) {
  if (!s) return null;
  var t = String(s).trim();
  t = t.replace(/^```(?:json)?\s*/i, '').replace(/\s*```\s*$/, '');
  try { return JSON.parse(t); } catch (e) { }
  var i = t.indexOf('{'), j = t.lastIndexOf('}');
  if (i >= 0 && j > i) { try { return JSON.parse(t.slice(i, j + 1)); } catch (e) { } }
  return null;
}

/* 调用大模型。content 为字符串或（含图片时的）内容块数组 */
function aiChat(cfg, userContent, opts) {
  opts = opts || {};
  var body = {
    model: opts.model || cfg.model,
    messages: [
      { role: 'system', content: cfg.prompt || defaultAiPrompt() },
      { role: 'user', content: userContent }
    ],
    temperature: 0.1,
    max_tokens: opts.maxTokens || 4000
  };
  var headers = { 'Content-Type': 'application/json' };
  if (cfg.apiKey) headers['Authorization'] = 'Bearer ' + cfg.apiKey;

  var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, opts.timeout || 120000);

  return fetch(cfg.baseUrl, {
    method: 'POST',
    headers: headers,
    body: JSON.stringify(body),
    signal: ctrl ? ctrl.signal : undefined
  }).then(function (r) {
    return r.text().then(function (txt) {
      clearTimeout(timer);
      if (!r.ok) {
        var msg = 'HTTP ' + r.status;
        try { var e = JSON.parse(txt); msg += ' ' + ((e.error && (e.error.message || e.error.code)) || txt.slice(0, 200)); }
        catch (err) { msg += ' ' + txt.slice(0, 200); }
        throw new Error(msg);
      }
      var j = null;
      try { j = JSON.parse(txt); } catch (e) { throw new Error('返回内容不是合法 JSON：' + txt.slice(0, 200)); }
      var content = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
      if (content == null) throw new Error('返回结构异常：' + txt.slice(0, 200));
      return content;
    });
  }).catch(function (err) {
    clearTimeout(timer);
    if (err && (err.name === 'AbortError')) throw new Error('请求超时（' + Math.round((opts.timeout || 120000) / 1000) + ' 秒），可稍后重试或换更快的模型');
    if (err && /Failed to fetch|NetworkError|Load failed/i.test(String(err.message))) {
      throw new Error('网络请求失败。可能原因：①手机网络不通 ②该服务商不允许浏览器直连（CORS）③地址填错');
    }
    throw err;
  });
}

/* 把 AI 返回的说法映射到表单枚举；无法可靠判断时返回空串，交人工选择 */
function matchEnum(v, options, aliasKey) {
  if (v == null) return '';
  var s = String(v).trim();
  if (!s) return '';
  if (options.indexOf(s) >= 0) return s;
  var al = AI_ENUM_ALIAS[aliasKey] || {};
  /* 长键优先，避免「容积旋转调强」被「调强」抢先匹配 */
  var keys = Object.keys(al).sort(function (a, b) { return b.length - a.length; });
  var sl = s.toLowerCase();
  for (var i = 0; i < keys.length; i++) {
    if (sl === keys[i].toLowerCase() || s.indexOf(keys[i]) >= 0) return al[keys[i]];
  }

/* ============ 随访模板：内置层 + 用户覆盖层 ============

/* 放疗结束日：优先用排程算出的最后治疗日；
   无排程（缺开始日期或总次数）时退回「治疗完成」的归档日。
   随访序列一律以此为第 0 个月起算，与归档时间无关。 */

  if (!p) return '';

  if (end) return end;
  return p.completedAt ? dateOnly(p.completedAt) : '';
}
/* 相对放疗结束日的天数说明，用于界面提示 */
function treatmentEndNote(p) {
  var end = treatmentEndOf(p);
  if (!end) return '';
  var d = daysBetween(end, todayStr());
  if (d > 0) return '放疗结束第 ' + d + ' 天';

/* 在日期上叠加间隔（月/年走自然月，闰年与月末自动处理） */
function addInterval(base, n, unit) {

  return num + ' ' + u;
}
/* 从「基准日期 → 到期日」反推间隔（用于旧数据迁移：老版只存了到期日） */
function inferInterval(base, due) {

function dueDateOf(f, base) {

}
/* 把某个日期作为基线，批量生成随访计划 */
function buildFollowupPlans(items, base) {

/* 患者当前适用的随访起算点：

/* 患者随访模板（相对「放疗结束日」的序列） */
function followupTemplate(p) {
  return (p.followupPlans || []).filter(function (f) { return f.baseDate === 'TEMPLATE'; })
    .sort(function (a, b) { return (a.offsetN || 0) - (b.offsetN || 0); });
}
/* 模板记录的起算日 */
function followupTplBase(p) {

  for (var i = 0; i < t.length; i++) if (t[i].tplBase) return dateOnly(t[i].tplBase);
  return '';
}

  return pend[0] || null;

function followupProgress(p) {
  var real = (p.followupPlans || []).filter(function (f) { return f.baseDate !== 'TEMPLATE'; });
  return { done: real.filter(function (f) { return f.done; }).length, total: real.length };

/* 输入开始日期 + 总次数 → 按「每周治疗日」排，跳过节假日与中断区间，自动算出结束日期 */
/* ================= 自动排程引擎 =================
   输入开始日期 + 总次数 → 按「每周治疗日」排，跳过节假日与中断区间，自动算出结束日期 */
function computeSchedule(p) {
  var out = [];
  if (!p) return out;
  var base = parseInt(p.fractions, 10);
  if (!p.startDate || !base || base <= 0) return out;
  /* 加量：原计划结束后追加的次数（总次数 = 处方次数 + 加量次数） */
  var boost = parseInt(p.boostFractions, 10) || 0;
  if (boost < 0) boost = 0;

  /* 提前终止：排程截止到该日（含），之后的治疗不再安排 */
  var stopDate = p.stopDate ? dateOnly(p.stopDate) : '';
  var days = (p.treatDays && p.treatDays.length) ? p.treatDays : treatDaysCfg();
  var hol = holidays(), mk = makeups();
  var useMk = makeupAsWorkday();
  var extraMap = {};
  (p.extras || []).forEach(function (e) { if (e.date) extraMap[dateOnly(e.date)] = e.reason || '加照'; });

  var cur = parseD(p.startDate);
  if (!cur) return out;
  /* 患者是否按「整周工作日」治疗（周一~周五全选）。
     只有这种节奏才随国家调休上班日加班；周一三五等自定义节奏不受调休影响。 */
  var fullWeek = [1, 2, 3, 4, 5].every(function (d) { return days.indexOf(d) >= 0; });
  /* 完成状态按日期推算：计划日期 ≤ 今天即视为已完成。
     异常（当天确实未做）通过「中断/顺延」修正，无需逐次手工标记。 */
  var today = todayStr();
  var n = 0, guard = 0;
  while (n < total && guard < 5000) {
    guard++;

    /* 达到提前终止日之后，不再安排任何治疗 */
    if (stopDate && ds > stopDate) break;

    var isMakeup = Object.prototype.hasOwnProperty.call(mk, ds);
    /* 调休上班日优先于节假日：同一日期既在节假日又在调休时，按工作日治疗 */
    var baseOk = days.indexOf(dow) >= 0 || (useMk && isMakeup && fullWeek);
    var isExtra = Object.prototype.hasOwnProperty.call(extraMap, ds);

        extra: isExtra, reason: isExtra ? extraMap[ds] : '',

function scheduleEnd(p) { var s = computeSchedule(p); return s.length ? s[s.length - 1].date : ''; }

function doneCount(p) { return computeSchedule(p).filter(function (x) { return x.done; }).length; }

/* 今日治疗项（若有） */
function todayItemOf(p) { return scheduleOn(p, todayStr()); }
/* 剩余未治疗次数 */
function remainCount(p) { return Math.max(0, plannedCount(p) - doneCount(p)); }
/* 本次放疗的处方总次数（含加量） */

/* 提前终止了多少次未做（原计划 − 实际排出的次数） */

}
/* 某日是否已完成：按日期推算（计划日期 ≤ 今天），不再依赖手工标记 */

  var ds = dateOnly(date);

}

/* ================= 患者查询 ================= */
function isActive(p) { return p.status === '在治'; }
function inTreat() { return state.patients.filter(isActive); }
function completed() { return state.patients.filter(function (p) { return p.status !== '在治'; }); }
function getPatient(id) { for (var i = 0; i < state.patients.length; i++) if (state.patients[i].id === id) return state.patients[i]; return null; }

/* ================= 待办计算 ================= */
function buildTodo() {
  var today = todayStr(), items = [];
  var targets = inTreat().slice();
  completed().forEach(function (p) {
    var due = (p.followupPlans || []).some(function (f) { return f.dueDate && f.dueDate <= today && !f.done; });
    if (due) targets.push(p);
  });
  targets.forEach(function (p) {
    var reasons = [], details = [];
    if (p.status === '在治') {
      if (p.planStatus && p.planStatus !== '已通过') {
        reasons.push('流程：' + p.planStatus); details.push('治疗流程卡在「' + p.planStatus + '」');
      } else if (!p.startDate || !parseInt(p.fractions, 10)) {
        reasons.push('待排程'); details.push('请填写放疗开始日期与总次数，自动生成治疗日历');
      } else {
        var t = todayItems(p);
        if (t) { reasons.push('今日应治疗'); details.push('今日为第 ' + t.fraction + ' 次治疗日' + (t.extra ? '（加照）' : '')); }
        var tot = parseInt(p.fractions, 10);
        var dn = doneCount(p);
        var end = scheduleEnd(p);
        var plannedN = plannedCount(p);
        var stoppedN = stoppedShortOf(p);
        /* 疗程已排完（所有计划日期都已过去）但仍是「在治」→ 提示归档 */
        if (end && end < today && dn >= plannedN) {
          if (stoppedN > 0) {
            reasons.push('已提前终止');
            details.push('止于 ' + dateOnly(p.stopDate) + '，实际 ' + plannedN + '/' + totalFractionsOf(p) + ' 次（未执行 ' + stoppedN + ' 次），可确认「治疗完成」归档');
          } else {
            reasons.push('疗程已结束'); details.push('计划 ' + plannedN + ' 次已全部完成，可确认「治疗完成」归档');
          }
        } else if (dn >= Math.floor(plannedN * 0.95) && dn < plannedN) {
          reasons.push('即将完成'); details.push('已完成 ' + dn + '/' + plannedN + ' 次');
        }
      }
    }
    openReactions(p).forEach(function (r) {
      if (r.status === '未处理' && reasons.indexOf('副反应待处理') < 0) { reasons.push('副反应待处理'); details.push('副反应「' + r.site + '」待处理'); }
      if (r.nextCheckAt && r.nextCheckAt <= today) {
        var d = daysBetween(r.nextCheckAt, today);
        var label = d > 0 ? ('复查逾期' + d + '天') : '今日复查';
        if (reasons.indexOf(label) < 0) { reasons.push(label); details.push(r.site + ' ' + label + ' ' + fmtDT(r.nextCheckAt)); }
      }
    });
    (p.followupPlans || []).forEach(function (f) {
      if (f.dueDate && f.dueDate <= today && !f.done) { if (reasons.indexOf('随访到期') < 0) { reasons.push('随访到期'); details.push('随访计划到期 ' + dateOnly(f.dueDate)); } }
    });
    if (reasons.length) items.push({ p: p, reasons: reasons, details: details });
  });
  return items;
}

/* ================= 渲染：框架 ================= */
var view = { page: 'tab', tab: 'ward', pid: null, calY: 0, calM: 0 };
(function () { var t = new Date(); view.calY = t.getFullYear(); view.calM = t.getMonth() + 1; })();

  else renderWard();

}

function updateDots() {

function statusChip(s) {

  return '<span class="chip ' + cls + '">' + esc(s) + '</span>';
}
function gradeChip(g) { return g ? '<span class="chip danger sm">' + esc(g) + '</span>' : ''; }

/* ================= 日历组件 ================= */
function calHeader(y, m, extraRight) {
  return '<div class="cal-top"><div class="mt">' + y + ' 年 ' + m + ' 月</div><div class="cal-nav">' +
    (extraRight || '') +
    '<button data-act="cal-prev">‹</button><button data-act="cal-today">今天</button><button data-act="cal-next">›</button></div></div>';
}
function calDowRow() {
  return '<div class="cal-grid">' + WD_ORDER.map(function (d) {
    var we = (d === 0 || d === 6);
    return '<div class="cal-dow' + (we ? ' we' : '') + '">' + WEEKDAYS[d].replace('周', '') + '</div>';
  }).join('') + '</div>';
}
/* cells: { 'YYYY-MM-DD': innerHTML } */
function calBody(y, m, cells) {
  var first = new Date(y, m - 1, 1);
  var startDow = first.getDay();
  var lead = WD_ORDER.indexOf(startDow);
  var dim = new Date(y, m, 0).getDate();
  var prevDim = new Date(y, m - 1, 0).getDate();
  var hol = holidays(), mk = makeups(), today = todayStr();
  var h = '<div class="cal-grid">';
  var i, dObj, ds, dow;
  for (i = 0; i < lead; i++) {
    dObj = new Date(y, m - 1, 1 - (lead - i)); ds = dstr(dObj);
    h += '<div class="cal-cell out"><div class="d' + (isWe(dObj) ? ' we' : '') + '">' + dObj.getDate() + '</div></div>';
  }
  for (i = 1; i <= dim; i++) {
    dObj = new Date(y, m - 1, i); ds = dstr(dObj); dow = dObj.getDay();
    var cls = 'cal-cell';
    if (ds === today) cls += ' today';
    if (Object.prototype.hasOwnProperty.call(hol, ds)) cls += ' hol';
    if (Object.prototype.hasOwnProperty.call(mk, ds)) cls += ' mk';
    if (cells[ds] != null) cls += ' clickable';
    h += '<div class="' + cls + '" data-act="cal-day" data-date="' + ds + '">' +
      '<div class="d' + (ds === today ? '' : ((dow === 0 || dow === 6) ? ' we' : '')) + '">' + i + '</div>' +
      (cells[ds] || '') + '</div>';
  }
  var tail = (7 - ((lead + dim) % 7)) % 7;
  for (i = 1; i <= tail; i++) {
    dObj = new Date(y, m - 1, dim + i); ds = dstr(dObj);
    h += '<div class="cal-cell out"><div class="d' + (isWe(dObj) ? ' we' : '') + '">' + dObj.getDate() + '</div></div>';
  }
  return h + '</div>';
}
function isWe(d) { var w = d.getDay(); return w === 0 || w === 6; }

/* ================= 渲染：总体日历 ================= */
function renderOverallCal() {
  var y = view.calY, m = view.calM;
  var list = inTreat();
  var byDate = {};
  list.forEach(function (p) {
    computeSchedule(p).forEach(function (it) {
      (byDate[it.date] = byDate[it.date] || []).push({ p: p, it: it });
    });
  });
  var cells = {};
  Object.keys(byDate).forEach(function (ds) {
    var arr = byDate[ds];
    var dn = arr.filter(function (a) { return a.it.done; }).length;
    cells[ds] = '<div class="cnt">' + arr.length + ' 人</div>' +
      (dn ? '<div class="tagline done">已完成 ' + dn + '</div>' : '<div class="tagline">待治疗</div>');
  });
  var monthTotal = 0, monthDone = 0;
  Object.keys(byDate).forEach(function (ds) {
    if (ds.slice(0, 7) === y + '-' + pad2(m)) { monthTotal += byDate[ds].length; monthDone += byDate[ds].filter(function (a) { return a.it.done; }).length; }
  });
  var allMiss = {};
  list.forEach(function (pp) { missingHolidayYears(pp.startDate, scheduleEnd(pp)).forEach(function (y) { allMiss[y] = 1; }); });
  var missList = Object.keys(allMiss).sort();

  h += '<div class="cal-wrap">' +
    calHeader(y, m, '<span class="chip sm">本月 ' + monthDone + '/' + monthTotal + '</span>') +

    '<div class="cal-legend">' +
    '<span><i style="background:#e5f3f1"></i>有治疗安排</span>' +
    '<span><i style="background:#fdecea"></i>法定节假日</span>' +
    '<span><i style="background:#fdf0e0"></i>调休上班</span>' +
    '<span><i style="background:#fff;border:1px solid #0f766e"></i>今天</span></div>' +
    '</div>';
  if (!list.length) h += '<div class="empty"><span class="big">📅</span>暂无在治患者</div>';

  /* 近期日程速览 */
  var upcoming = [];

            '<span class="sub2"> 第 ' + u.it.fraction + ' 次' + (u.it.extra ? ' · 加照' : '') + '</span></span>' +
            (u.it.done ? '<span class="chip ok sm">已完成</span>' : '<span class="chip sm">待治疗</span>') + '</div></div>';
        }).join('') + '</div>';

  $('view').innerHTML = h + '<div style="height:60px"></div>';

      '<div class="kv"><div class="k">' + (p.stopDate ? '实际结束' : '预计结束') + '</div><div class="v">' + (end || '—') + (end ? '（' + WEEKDAYS[parseD(end).getDay()] + '）' : '') +
      (p.stopDate ? ' <span class="chip warn sm">按终止日重算</span>' : '') + (missY.length ? ' <span class="chip warn sm">含未录入年份</span>' : '') + '</div></div>' +

/* ================= 弹层 =================
   底部操作区（sh-foot）固定在弹层底部，不随内容滚动：
   - 普通表单：显示「取消 / 保存」
   - 操作型弹层：传 actions 数组，按钮始终可见可点（内容再长也不用滚动去找） */
var sheetCtx = null;
var reopenSheet = null;

function sheetActionsHtml(actions) {
  return actions.map(function (a) {
    var cls = 'btn' + (a.primary ? ' primary' : '') + (a.danger ? ' danger' : '') + (a.full ? ' full' : '');
    var attrs = ' data-act="' + esc(a.act) + '"';
    if (a.id) attrs += ' data-id="' + esc(a.id) + '"';
    if (a.date) attrs += ' data-date="' + esc(a.date) + '"';
    if (a.key) attrs += ' data-key="' + esc(a.key) + '"';
    return '<button class="' + cls + '"' + attrs + (a.disabled ? ' disabled' : '') + '>' + esc(a.label) + '</button>';
  }).join('');
}

function openSheet(o) {
  sheetCtx = o;
  $('sheetTitle').textContent = o.title || '';
  $('sheetBody').innerHTML = o.body || '';

  var foot = $('sheetFoot');
  if (o.actions && o.actions.length) {
    /* 操作型弹层：按钮固定在底部 */
    $('sheetFootInner').innerHTML = sheetActionsHtml(o.actions);
    foot.hidden = false;
  } else {
    /* 普通表单：取消 / 保存 */
    $('sheetFootInner').innerHTML =
      '<button class="btn" id="sheetCancel">取消</button>' +
      '<button class="btn primary" id="sheetOk">' + esc(o.okText || '保存') + '</button>';
    $('sheetOk').onclick = function () {
      var v = sheetValues();
      if (o.onSave && o.onSave(v) === false) return;
      closeSheet(false);
    };
    $('sheetCancel').onclick = function () { closeSheet(true); };
    foot.hidden = !!o.hideOk;
  }
  $('sheetClose').onclick = function () { closeSheet(true); };
  $('mask').hidden = false;
  requestAnimationFrame(function () { $('mask').classList.add('show'); $('sheet').classList.add('show'); });
  if (o.afterRender) o.afterRender();
}
function closeSheet() { reopenSheet = null; $('mask').classList.remove('show'); $('sheet').classList.remove('show'); setTimeout(function () { $('mask').hidden = true; sheetCtx = null; }, 220); }
function sheetValues() {
  var out = {};
  document.querySelectorAll('#sheetBody [name]').forEach(function (el) {
    if (el.type === 'checkbox') out[el.name] = el.checked; else out[el.name] = el.value;
  });
  return out;
}
function field(label, inner, hint) { return '<div class="field"><label>' + esc(label) + '</label>' + inner + (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') + '</div>'; }
function textInput(name, value, ph, type) { return '<input name="' + esc(name) + '" value="' + esc(value) + '" placeholder="' + esc(ph || '') + '"' + (type ? ' type="' + type + '"' : ' type="text"') + '>'; }
function numberInput(name, value, ph, step) { return '<input name="' + esc(name) + '" value="' + esc(value) + '" placeholder="' + esc(ph || '') + '" type="number" inputmode="decimal"' + (step ? ' step="' + step + '"' : '') + '>'; }
function areaInput(name, value, ph) { return '<textarea name="' + esc(name) + '" placeholder="' + esc(ph || '') + '">' + esc(value) + '</textarea>'; }
function selectInput(name, value, options) {

/* 真正发起识别 */
function runAiParse(text, images) {
  var cfg = aiConfig();
  var status = document.getElementById('aiStatus');
  var started = Date.now();
  var useVision = images.length > 0;
  var model = useVision ? (cfg.visionModel || cfg.model) : cfg.model;
  if (useVision && !cfg.visionModel) {
    if (!confirm('未设置「图片模型」，将尝试用文本模型识别图片（多数模型不支持）。继续？')) return;
  }
  var tick = setInterval(function () {
    if (status) status.textContent = '识别中… 已用 ' + Math.round((Date.now() - started) / 1000) + ' 秒';
  }, 1000);
  if (status) status.textContent = '识别中… 已用 0 秒';

  /* 组装内容：有图片时用多模态内容块 */
  var content;
  if (useVision) {
    content = [{ type: 'text', text: (text || '请从以下图片中提取患者信息。') }];
    images.forEach(function (im) { content.push({ type: 'image_url', image_url: { url: im.dataUrl } }); });
  } else {
    content = text;
  }

  aiChat(cfg, content, { model: model, maxTokens: 4000 })
    .then(function (out) {
      clearInterval(tick);
      var json = extractJson(out);
      var list = normalizeAiPatients(json);
      if (!list.length) {
        if (status) status.innerHTML = '<span style="color:var(--danger)">未能识别出患者信息。可换个更清晰的图片，或改用更强的模型。</span>' +
          '<br><span class="hint">模型原始输出：' + esc(String(out).slice(0, 300)) + '</span>';
        return;
      }
      aiDraft.patients = list;
      toast('识别到 ' + list.length + ' 位患者，请复核');
      openAiReview();
    })
    .catch(function (err) {
      clearInterval(tick);
      if (status) status.innerHTML = '<span style="color:var(--danger)">识别失败：' + esc(err.message) + '</span>';
    });
}

/* 从复核界面收集并写入 */
function commitAiDraft() {
  var vals = sheetValues();
  var list = aiDraft.patients;
  var added = 0, skipped = 0;
  var names = [];
  list.forEach(function (p, i) {
    var o = {};
    AI_FIELDS.forEach(function (k) { o[k] = String(vals[aiDraftKey(i, k)] == null ? '' : vals[aiDraftKey(i, k)]).trim(); });
    if (!o.name) { skipped++; return; }
    state.patients.push(normalize({
      patients: [Object.assign(o, {
        treatDays: treatDaysCfg(), pauses: [], extras: [], doneDates: [], reactions: [], followupPlans: [], notes: [], status: '在治'
      })]
    }).patients[0]);
    added++;
    names.push(o.name);
  });
  if (!added) { toast('没有可导入的患者（姓名不能为空）'); return false; }
  save();
  closeSheet();
  view.page = 'tab'; view.tab = 'ward'; render();
  toast('已导入 ' + added + ' 位' + (skipped ? '，跳过 ' + skipped + ' 条（无姓名）' : '') + '：' + names.join('、'));
  return true;
}

function sheetFollowup(p, f) {

  var isNew = !f;

  var d = f || { offsetN: 3, offsetUnit: 'm', note: '' };
  var initDue = addInterval(base, d.offsetN, d.offsetUnit);

  openSheet({
    title: isNew ? '添加随访' : '编辑随访', okText: '保存',
    body:
      '<div class="hint" style="margin-bottom:10px;line-height:1.7">到期日 = 起算日 + 间隔，自动推算</div>' +
      field('起算日期（放疗结束日）', textInput('baseDate', base, '', 'date'),
        treatmentEndOf(p) ? ('放疗结束日 ' + treatmentEndOf(p)) : '该患者尚无排程，可手动填写') +
      '<div class="field2">' +
      '<div class="field"><label>间隔</label>' + numberInput('offsetN', d.offsetN, '如 3', '1') + '</div>' +
      '<div class="field"><label>单位</label><select name="offsetUnit" id="fuUnit">' +
      FOLLOWUP_UNITS.map(function (u) { return '<option value="' + u.key + '"' + (u.key === d.offsetUnit ? ' selected' : '') + '>' + u.label + '</option>'; }).join('') +
      '</select></div></div>' +
      '<div class="field"><label>到期日（自动推算，可手动改）</label>' + textInput('dueDate', initDue, '', 'date') + '</div>' +
      '<div class="field"><label>快捷间隔</label><div class="seg">' +
      FOLLOWUP_PRESETS.map(function (n) { return '<button type="button" class="fupre" data-n="' + n + '">' + n + ' 个月</button>'; }).join('') +
      '</div></div>' +
      field('随访内容', areaInput('note', d.note, '如 复查盆腔 MRI、CEA；或复查 PSA')),
    onSave: function (v) {
      if (!v.dueDate) { toast('请填写到期日'); return false; }
      if (isNew) {
        p.followupPlans = p.followupPlans || [];
        p.followupPlans.push({
          id: uid('fp'), baseDate: v.baseDate || base, offsetN: parseInt(v.offsetN, 10) || 0,
          offsetUnit: v.offsetUnit || 'm', dueDate: v.dueDate, note: v.note, done: false, doneAt: ''
        });
        toast('已添加随访');
      } else {
        f.baseDate = v.baseDate || base;
        f.offsetN = parseInt(v.offsetN, 10) || 0;
        f.offsetUnit = v.offsetUnit || 'm';
        f.dueDate = v.dueDate; f.note = v.note;
        toast('已保存');
      }
      save(); render();
    },
    afterRender: function () {
      var nEl = document.querySelector('#sheetBody [name="offsetN"]');
      var uEl = document.getElementById('fuUnit');
      var bEl = document.querySelector('#sheetBody [name="baseDate"]');
      function recalc() {
        var dEl = document.querySelector('#sheetBody [name="dueDate"]');
        if (!dEl || !nEl || !uEl) return;
        dEl.value = addInterval((bEl && bEl.value) || base, nEl.value, uEl.value);
      }
      [nEl, uEl, bEl].forEach(function (el) { if (el) { el.addEventListener('input', recalc); el.addEventListener('change', recalc); } });
      document.querySelectorAll('#sheetBody .fupre').forEach(function (b) {
        if (d.offsetN === parseInt(b.dataset.n, 10) && d.offsetUnit === 'm') b.classList.add('on');
        b.addEventListener('click', function () {
          document.querySelectorAll('#sheetBody .fupre').forEach(function (x) { x.classList.remove('on'); });
          b.classList.add('on');
          if (nEl) nEl.value = b.dataset.n;
          if (uEl) uEl.value = 'm';
          recalc();
        });
      });
    }
  });
}

/* 把模板应用到某位患者：保留已完成记录，未完成部分按新模板重排（不重复已完成的次数） */
function applyTplToPatient(p, t) {
  var items = (t.items || []).filter(function (x) { return parseInt(x.n, 10) > 0; });
  if (!items.length) return false;
  var base = t.base || followupTplBase(p) || treatmentEndOf(p) || todayStr();
  var done = (p.followupPlans || []).filter(function (f) { return f.baseDate !== 'TEMPLATE' && f.done; });
  var doneKeys = {};
  done.forEach(function (f) { doneKeys[f.offsetN + '|' + f.offsetUnit] = 1; });
  var pendItems = items.filter(function (it) { return !doneKeys[it.n + '|' + (it.u || 'm')]; });
  var tplRows = buildFollowupPlans(items, base).map(function (f) {
    f.tplBase = base; f.baseDate = 'TEMPLATE'; return f;
  });
  p.followupPlans = done.concat(buildFollowupPlans(pendItems, base)).concat(tplRows);
  save();
  return true;
}

/* 随访模板：一次设定整条随访链，之后可随时改间隔并自动重排 */
function sheetFollowupTemplate(p) {
  if (!p) { closeSheet(); return; }
  var tpl = followupTemplate(p);
  var rows = tpl.length ? tpl.map(function (t) { return { n: t.offsetN, u: t.offsetUnit, note: t.note || '' }; })
    : [{ n: 1, u: 'm' }, { n: 3, u: 'm' }, { n: 6, u: 'm' }, { n: 12, u: 'm' }];
  /* 起算日默认为「放疗结束日」，与归档时间无关 */
  var base = followupTplBase(p) || treatmentEndOf(p) || todayStr();
  var schedEnd = scheduleEnd(p);

  /* 从界面读回编辑后的序列。
     必须定义在外层作用域：onSave 与 afterRender 都要用（放在 afterRender 内会取不到）。 */
  function readRows() {
    var nd = document.querySelectorAll('#tplRows .tplrow');
    var out = [];
    nd.forEach(function (r) {
      out.push({
        n: parseInt(r.querySelector('.t-n').value, 10) || 0,
        u: r.querySelector('.t-u').value,
        note: r.querySelector('.t-note').value
      });
    });
    if (out.length) rows = out;      /* 界面上没有行时保留原值（如测试环境） */
  }

  function rowsHtml() {
    return rows.map(function (r, i) {
      return '<div class="tplrow" style="display:flex;gap:6px;align-items:center;margin-bottom:8px">' +
        '<span class="hint" style="flex:0 0 auto">第 ' + (i + 1) + ' 次</span>' +
        '<input type="number" class="t-n" inputmode="numeric" value="' + r.n + '" style="flex:0 0 62px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:15px;min-width:0">' +
        '<select class="t-u" style="flex:0 0 78px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px">' +
        FOLLOWUP_UNITS.map(function (u) { return '<option value="' + u.key + '"' + (u.key === r.u ? ' selected' : '') + '>' + u.label + '</option>'; }).join('') +
        '</select>' +
        '<input type="text" class="t-note" placeholder="随访内容" value="' + esc(r.note || '') + '" style="flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px">' +
        '<button type="button" class="t-del" data-i="' + i + '" style="flex:0 0 auto;border:0;background:transparent;color:var(--danger);font-size:17px;cursor:pointer;padding:4px 6px">✕</button>' +
        '</div>';
    }).join('');
  }

  openSheet({
    title: '随访模板（自动排期）', okText: '保存并排期',
    body:
      '<div class="hint" style="margin-bottom:10px;line-height:1.7">设定「第几次、间隔多久」，保存后自动算出每次随访日期并排入待办。间隔以<b>放疗结束日</b>为第 0 个月计算。</div>' +
      field('起算日期（放疗结束日）', textInput('base', base, '', 'date'),
        schedEnd ? ('按排程算出的最后治疗日：' + schedEnd + '（＋' + treatmentEndNote(p) + '）') : '该患者尚无排程，可手动填写') +
      '<div class="field"><label>套用模板（点一下载入到下方序列，之后可逐行修改）</label><div class="seg">' +
      followupTemplates().map(function (t) {
        return '<button type="button" class="tpl" data-i="' + esc(t.name) + '">' + esc(t.name) +
          (t.builtin ? '' : ' ·自建') + '</button>';
      }).join('') +
      '</div>' +
      '<div class="btnrow" style="margin-top:8px">' +
      '<button type="button" class="btn sm" id="tplManage">⚙ 管理模板（' + followupTemplates().length + '）</button>' +
      '</div>' +
      '<div class="hint" style="margin-top:6px">模板为通用参考，请按本科室规程调整间隔与复查项目。</div></div>' +
      '<div class="field"><label>随访序列</label><div id="tplRows">' + rowsHtml() + '</div>' +
      '<button type="button" class="btn sm addbtn" id="tplAdd">＋ 增加一次随访</button></div>' +
      '<div class="field"><label>存为我的模板（可选）</label>' +
      '<div style="display:flex;gap:8px">' +
      '<input type="text" id="tplSaveName" placeholder="模板名称，如 本科室肺癌" style="flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:15px">' +
      '<button type="button" class="btn sm primary" id="tplSave" style="flex:0 0 auto">保存</button>' +
      '</div><div class="hint" style="margin-top:6px">把当前序列存成模板，以后一键套用；同名会覆盖。</div></div>' +
      '<div class="hint" id="tplPreview" style="line-height:1.9"></div>',
    onSave: function (v) {
      readRows();
      var items = rows.filter(function (r) { return parseInt(r.n, 10) > 0; });
      if (!items.length) { toast('请至少设置一次随访'); return false; }
      if (!v.base) { toast('请填写起算日期'); return false; }
      /* 保留已完成的随访记录，且不把已完成的次数重新生成为待随访（否则会重复） */
      var doneCnt = (p.followupPlans || []).filter(function (f) { return f.baseDate !== 'TEMPLATE' && f.done; }).length;
      applyTplToPatient(p, { items: items, base: v.base });
      var skipped = doneCnt;
      var plans = pendingFollowups(p).sort(function (a, b) { return String(a.dueDate).localeCompare(String(b.dueDate)); });
      render();
      toast('已按放疗结束日排出 ' + plans.length + ' 次随访' +
        (skipped ? '（' + skipped + ' 次已完成，不再重复）' : '') +
        (plans.length ? '，最早 ' + dateOnly(plans[0].dueDate) : ''));
    },
    afterRender: function () {
      function updatePreview() {
        var b = document.querySelector('#sheetBody [name="base"]');
        var base2 = (b && b.value) || base;
        readRows();
        var items = rows.filter(function (r) { return parseInt(r.n, 10) > 0; });
        var plans = buildFollowupPlans(items, base2);
        document.getElementById('tplPreview').innerHTML = plans.length
          ? '<b>将生成 ' + plans.length + ' 次随访（自 ' + dateOnly(base2) + ' 起算）：</b><br>' + plans.map(function (f, i) {
            var dd = daysBetween(base2, f.dueDate);
            return '第 ' + (i + 1) + ' 次 · ' + dateOnly(f.dueDate) + '（放疗后 ' + intervalText(f.offsetN, f.offsetUnit) +
              (dd > 0 ? '，约 ' + dd + ' 天' : '') + '）' + (f.note ? ' · ' + esc(f.note) : '');
          }).join('<br>')
          : '尚未设置随访';
      }
      function bindRows() {
        document.querySelectorAll('#tplRows .t-n, #tplRows .t-u, #tplRows .t-note').forEach(function (el) {
          el.addEventListener('input', updatePreview);
          el.addEventListener('change', updatePreview);
        });
        document.querySelectorAll('#tplRows .t-del').forEach(function (b) {
          b.addEventListener('click', function () { readRows(); rows.splice(parseInt(b.dataset.i, 10), 1); repaint(); });
        });
      }
      function repaint() {
        document.getElementById('tplRows').innerHTML = rowsHtml();
        bindRows(); updatePreview();
      }
      document.getElementById('tplAdd').addEventListener('click', function () {
        readRows();
        var last = rows[rows.length - 1] || { n: 0, u: 'm' };
        rows.push({ n: (parseInt(last.n, 10) || 0) + (last.u === 'm' ? 3 : 1), u: last.u || 'm', note: '' });
        repaint();
      });
      /* 套用模板：按名称查找（支持用户自建模板） */
      document.querySelectorAll('#sheetBody .tpl').forEach(function (b) {
        b.addEventListener('click', function () {
          var t = findTpl(b.dataset.i);
          if (!t) { toast('该模板已不存在'); return; }
          document.querySelectorAll('#sheetBody .tpl').forEach(function (x) { x.classList.remove('on'); });
          b.classList.add('on');
          rows = t.items.map(function (x) { return { n: x.n, u: x.u, note: x.note || '' }; });
          repaint();
          toast('已套用「' + t.name + '」，可继续修改');
        });
      });
      /* 把当前序列存成模板 */
      document.getElementById('tplSave').addEventListener('click', function () {
        readRows();
        var nameEl = document.getElementById('tplSaveName');
        var nm = (nameEl && nameEl.value || '').trim();
        if (!nm) { toast('请先填写模板名称'); if (nameEl) nameEl.focus(); return; }
        var items = rows.filter(function (r) { return parseInt(r.n, 10) > 0; });
        if (!items.length) { toast('随访序列为空，无法保存'); return; }
        if (isBuiltinTpl(nm) && !confirm('「' + nm + '」是内置模板，保存将覆盖它（可随时恢复内置）。确定继续？')) return;
        else if (!isBuiltinTpl(nm) && findTpl(nm) && !confirm('已存在同名模板「' + nm + '」，确定覆盖？')) return;
        if (!saveTpl(nm, items)) { toast('保存失败'); return; }
        if (nameEl) nameEl.value = '';
        toast('已保存模板「' + nm + '」');
        sheetFollowupTemplate(p);         /* 重开表单以刷新模板列表 */
      });
      document.getElementById('tplManage').addEventListener('click', function () { sheetTplManage(p); });
      var bEl = document.querySelector('#sheetBody [name="base"]');
      if (bEl) bEl.addEventListener('change', updatePreview);
      bindRows(); updatePreview();
    }
  });
}

/* 模板管理：查看 / 删除 / 恢复内置 */
function sheetTplManage(p) {
  var list = followupTemplates();
  var hasOverride = Object.keys(tplOverride()).length > 0;
  var body = '<div class="hint" style="margin-bottom:10px;line-height:1.7">' +
    '内置模板可删除（随时恢复）；自建模板可删除。点「套用」把该模板载入到序列编辑。</div>';
  if (!list.length) body += '<div class="hint">暂无可用模板，可在上一页把序列存为模板。</div>';

  var builtin = list.filter(function (t) { return t.builtin; });
  var custom = list.filter(function (t) { return !t.builtin; });

  function row(t) {
    return '<div class="event" style="padding:9px 11px"><div class="head" style="margin-bottom:4px">' +
      '<span class="chip ' + (t.builtin ? 'pri' : 'warn') + '">' + (t.builtin ? '内置' : '自建') + '</span>' +
      '<span style="flex:1;font-size:14px;font-weight:600">' + esc(t.name) + '</span></div>' +
      '<div class="hint" style="line-height:1.6">' + t.items.length + ' 次 · ' + esc(tplItemsText(t.items)) + '</div>' +
      '<div class="acts" style="margin-top:6px">' +
      '<button type="button" class="btn sm" data-act="tpl-use" data-name="' + esc(t.name) + '">套用</button>' +
      '<button type="button" class="btn sm danger" data-act="tpl-del" data-name="' + esc(t.name) + '">删除</button>' +
      '</div></div>';
  }

  if (builtin.length) {
    body += '<div class="hint" style="margin:10px 2px 6px;font-weight:600">内置模板（' + builtin.length + '）</div>';
    body += builtin.map(row).join('');
  }
  if (custom.length) {
    body += '<div class="hint" style="margin:14px 2px 6px;font-weight:600">我自建的（' + custom.length + '）</div>';
    body += custom.map(row).join('');
  }

  openSheet({
    title: '管理随访模板',
    body: body,
    actions: [
      hasOverride ? { label: '恢复内置模板', act: 'tpl-reset' } : null,
      { label: '返回编辑', act: 'tpl-back', full: !hasOverride }
    ].filter(Boolean)
  });
}

/* 待随访 / 随访历史列表 */
function sheetFollowupList(p, mode) {
  if (!p) { closeSheet(); return; }
  var list;
  if (mode === 'history') {
    list = (p.followupPlans || []).filter(function (f) { return f.baseDate !== 'TEMPLATE' && f.done; })
      .sort(function (a, b) { return String(b.doneAt).localeCompare(String(a.doneAt)); });
  } else {
    list = pendingFollowups(p).sort(function (a, b) { return String(a.dueDate).localeCompare(String(b.dueDate)); });
  }
  openSheet({
    title: mode === 'history' ? '随访历史' : '待随访安排',
    body: list.length ? list.map(function (f) {
      return '<div class="event"><div class="head">' +
        (f.done ? '<span class="chip ok">已完成</span>' : (f.dueDate <= todayStr() ? '<span class="chip danger">已到期</span>' : '<span class="chip warn">待随访</span>')) +
        '<span class="chip sm">' + esc(intervalText(f.offsetN, f.offsetUnit)) + '</span></div>' +
        '<div class="content" style="font-weight:400">' + (f.done ? dateOnly(f.doneAt) : dateOnly(f.dueDate)) +
        (f.note ? ' · ' + esc(f.note) : '') + '</div>' +
        (f.done ? '<div class="t">计划 ' + dateOnly(f.dueDate) + '</div>'
          : '<div class="acts"><button class="btn sm primary" data-act="followup-done" data-id="' + f.id + '">完成本次</button>' +
          '<button class="btn sm" data-act="followup-edit" data-id="' + f.id + '">改间隔</button>' +
          '<button class="btn sm danger" data-act="followup-del" data-id="' + f.id + '">删除</button></div>') +
        '</div>';
    }).join('') : '<div class="hint">暂无记录</div>',
    actions: [{ label: '关闭', act: 'sheet-close', full: true }]
  });
}


function sheetPause(p, pa) {
  if (!p) { closeSheet(); return; }
  var isNew = !pa;
  var d = pa || { from: todayStr(), to: addDays(todayStr(), 2), reason: '' };
  openSheet({
    title: isNew ? '中断 / 调整治疗' : '编辑中断', okText: '保存',
    body: '<div class="hint" style="margin-bottom:8px">该区间内不安排治疗，后续日期自动顺延，结束日期自动重算</div>' +
      '<div class="field2"><div class="field"><label>中断开始</label>' + textInput('from', d.from, '', 'date') + '</div>' +
      '<div class="field"><label>恢复治疗日期</label>' + textInput('to', d.to, '', 'date') + '</div></div>' +
      field('原因', areaInput('reason', d.reason, '如 机器故障维修 / 患者请假 / 骨髓抑制暂停')),
    onSave: function (v) {
      if (!v.from || !v.to) { toast('请填写起止日期'); return false; }
      if (v.to < v.from) { toast('恢复日期不能早于开始日期'); return false; }
      if (isNew) { p.pauses = p.pauses || []; p.pauses.push({ id: uid('pa'), from: v.from, to: v.to, reason: v.reason }); }
      else { pa.from = v.from; pa.to = v.to; pa.reason = v.reason; }
      save(); render(); toast('已保存，日程已重算');
    }
  });
}
function sheetExtra(p) {
  if (!p) { closeSheet(); return; }
  openSheet({
    title: '加照（额外治疗日）', okText: '保存',
    body: '<div class="hint" style="margin-bottom:10px;line-height:1.7">在某一天<b>额外补做一次</b>，用于补回漏做的次数。<br>' +
      '总次数不变，疗程相应提前结束。<br>（若要「原计划结束后再增加几次」，请用「加量」）</div>' +
      field('日期', textInput('date', todayStr(), '', 'date')) +
      field('原因', areaInput('reason', '', '如 周末补照 / 假期前加照')),
    onSave: function (v) {
      if (!v.date) { toast('请填写日期'); return false; }
      if (inPause(p, v.date)) { toast('该日期在中断区间内，请先调整中断'); return false; }
      p.extras = p.extras || [];
      p.extras.push({ id: uid('ex'), date: v.date, reason: v.reason });
      save(); render(); toast('已加照，日程已重算');
    }
  });
}

/* 加量：原计划结束后追加若干次（常见于局部加量 boost） */
function sheetBoost(p) {
  if (!p) { closeSheet(); return; }
  var base = parseInt(p.fractions, 10) || 0;
  var cur = parseInt(p.boostFractions, 10) || 0;
  var endBefore = scheduleEnd(p);
  openSheet({
    title: '加量（追加治疗次数）', okText: '保存',
    body:
      '<div class="hint" style="margin-bottom:10px;line-height:1.7">在原定 ' + base + ' 次<b>结束之后</b>再追加若干次，' +
      '总次数随之增加，疗程相应延长。<br>（若只是某天补做一次、次数不变，请用「加照」）</div>' +
      field('加量次数', numberInput('boostFractions', cur || '', '如 5', '1')) +
      field('加量说明', textInput('boostNote', p.boostNote, '如 局部加量 10Gy/5次 / 瘤床加量')) +
      '<div class="hint" id="boostPreview" style="line-height:1.9">' +
      (base ? '原计划 ' + base + ' 次' + (endBefore ? '，结束于 ' + endBefore : '') : '尚未排程') + '</div>',
    onSave: function (v) {
      var n = parseInt(v.boostFractions, 10);
      if (v.boostFractions !== '' && v.boostFractions != null && (isNaN(n) || n < 0)) { toast('加量次数需为不小于 0 的整数'); return false; }
      if (!n) {
        if (!confirm('加量次数为 0，将取消加量。确定保存吗？')) return false;
      }
      p.boostFractions = n ? String(n) : '';
      p.boostNote = n ? String(v.boostNote || '').trim() : '';
      save(); render();
      var endAfter = scheduleEnd(p);
      toast(n
        ? ('已加量 ' + n + ' 次，总次数 ' + (base + n) + ' 次，结束日期 ' + (endAfter || '—'))
        : '已取消加量');
    },
    afterRender: function () {
      var el = document.querySelector('#sheetBody [name="boostFractions"]');
      if (!el) return;
      function upd() {
        var n = parseInt(el.value, 10) || 0;
        var pv = document.getElementById('boostPreview');
        if (!pv) return;
        if (!base) { pv.textContent = '尚未排程'; return; }
        if (!n) { pv.innerHTML = '原计划 <b>' + base + '</b> 次' + (endBefore ? '，结束于 ' + endBefore : ''); return; }
        pv.innerHTML = '原计划 <b>' + base + '</b> 次 + 加量 <b>' + n + '</b> 次 = 总 <b>' + (base + n) + '</b> 次' +
          '<br>加量部分将从 ' + (endBefore || '原计划结束后') + ' 之后继续顺排';
      }
      el.addEventListener('input', upd);
      el.addEventListener('change', upd);
      upd();
    }
  });
}

/* 提前终止：到某日为止，后续不再安排治疗 */
function sheetStop(p) {
  if (!p) { closeSheet(); return; }
  var planned = plannedCount(p);
  var tot = totalFractionsOf(p);
  var last = scheduleEnd(p);
  openSheet({
    title: '提前终止治疗', okText: '确认终止',
    body:
      '<div class="hint" style="margin-bottom:10px;line-height:1.7">' +
      '指定「最后一天治疗」，之后的计划不再执行。<b>原处方信息会保留</b>，便于记录与统计；' +
      '未完成的次数会明确标出。随时可取消终止、恢复原计划。</div>' +
      field('最后一天治疗（含当日）', textInput('stopDate', last || todayStr(), '', 'date'),
        '该日之后的治疗不再安排') +
      field('终止原因', areaInput('reason', '', '如 患者拒绝继续 / 出现放射性损伤 / 病情变化 / 转手术')) +
      '<div class="hint" id="stopPreview" style="line-height:1.9"></div>',
    onSave: function (v) {
      if (!v.stopDate) { toast('请填写最后一天治疗'); return false; }
      p.stopDate = v.stopDate;
      var real = plannedCount(p);
      save(); render();
      toast('已终止于 ' + dateOnly(v.stopDate) + '，实际安排 ' + real + '/' + tot + ' 次');
    },
    afterRender: function () {
      var el = document.querySelector('#sheetBody [name="stopDate"]');
      if (!el) return;
      function upd() {
        var prev = document.getElementById('stopPreview');
        if (!prev) return;
        var d = el.value;
        if (!d) { prev.textContent = ''; return; }
        var tmp = JSON.parse(JSON.stringify({ fractions: p.fractions, boostFractions: p.boostFractions, startDate: p.startDate, treatDays: p.treatDays, pauses: p.pauses, extras: p.extras, stopDate: d }));
        var cnt = computeSchedule(tmp).length;
        prev.innerHTML = '处方共 <b>' + tot + '</b> 次，终止后实际安排 <b>' + cnt + '</b> 次，' +
          '其中未执行 <b>' + Math.max(0, tot - cnt) + '</b> 次' +
          (cnt ? '<br>最后一天治疗：' + computeSchedule(tmp)[cnt - 1].date : '');
      }
      el.addEventListener('change', upd);
      el.addEventListener('input', upd);
      upd();
    }
  });
}
function cancelStop(p) {
  if (!p) return;
  if (!confirm('取消提前终止？将恢复原计划的全部 ' + totalFractionsOf(p) + ' 次治疗。')) return;
  p.stopDate = '';
  save(); render(); toast('已取消终止，恢复原计划');
}

/* ================= 日历日操作 =================
   完成状态按日期自动推算，因此这里不再有「标记完成」，
   只保留异常修正：本次未做（后续顺延）、停止治疗、加照、恢复治疗。 */
function sheetDayOverall(date) {
  if (!date) return;
  var arr = [];
  inTreat().forEach(function (p) {
    var it = scheduleOn(p, date);
    if (it) arr.push({ p: p, it: it });
  });
  var hol = holidays(), mk = makeups();
  var isHol = Object.prototype.hasOwnProperty.call(hol, date);
  var isMk = Object.prototype.hasOwnProperty.call(mk, date);
  var tag = '';
  if (isHol && isMk) tag = '<span class="chip warn">节假日·已设为调休上班</span>';
  else if (isHol) tag = '<span class="chip danger">法定节假日 ' + esc(hol[date]) + '</span>';
  else if (isMk) tag = '<span class="chip warn">调休上班 ' + esc(mk[date]) + '</span>';
  var isPast = date < todayStr();
  var isToday = date === todayStr();
  openSheet({
    title: date + ' ' + WEEKDAYS[parseD(date).getDay()],
    body: '<div style="margin-bottom:8px">' + tag + '<span class="chip sm">共 ' + arr.length + ' 人</span>' +
      (isToday ? '<span class="chip pri sm">今天</span>' : '') + '</div>' +
      (arr.length ? arr.map(function (a) {
        return '<div class="event"><div class="head"><span class="chip pri">第 ' + a.it.fraction + ' 次</span>' +
          (a.it.extra ? '<span class="chip warn sm">加照</span>' : '') +
          (a.it.done ? '<span class="chip ok sm">已完成</span>' : '<span class="chip sm">待治疗</span>') + '</div>' +
          '<div class="content">' + esc(a.p.name) + ' <span class="hint">' + esc(a.p.diagnosis || '') + '</span></div>' +
          '<div class="acts">' +
          (a.it.done || isToday
            ? '<button class="btn sm" data-act="skip-here" data-id="' + a.p.id + '" data-date="' + date + '">本次未做（顺延）</button>' : '') +
          '<button class="btn sm" data-act="open-patient" data-id="' + a.p.id + '">查看</button></div></div>';
      }).join('') : '<div class="hint">当天未安排治疗</div>'),
    actions: [{ label: '关闭', act: 'sheet-close', full: true }]
  });
  reopenSheet = function () { sheetDayOverall(date); };
}
function sheetDayPatient(p, date) {
  if (!p) { closeSheet(); return; }
  var it = scheduleOn(p, date);
  var pa = pauseOn(p, date);
  var isPause = !!pa;
  var body = '<div style="margin-bottom:8px">';
  if (it) body += '<span class="chip pri">第 ' + it.fraction + ' 次</span>' + (it.extra ? '<span class="chip warn sm">加照</span>' : '') +
    (it.done ? '<span class="chip ok sm">已完成</span>' : '<span class="chip sm">待治疗</span>');
  else if (isPause) body += '<span class="chip warn">中断中</span>';
  else body += '<span class="chip sm">非治疗日</span>';
  body += '</div>';
  if (isPause) body += '<div class="hint" style="margin-bottom:8px">中断：' + esc(pa.reason || '') + '（' + dateOnly(pa.from) + ' ~ ' + dateOnly(pa.to) + '）</div>';
  if (it && it.done) body += '<div class="hint" style="margin-bottom:8px">该次已按日期计入「已完成」。若当天实际未治疗，请点下方「本次未做」。</div>';
  if (!it && !isPause) body += '<div class="hint" style="margin-bottom:8px">该日不在治疗计划内，可加照（额外安排一次治疗）或设为中断起点。</div>';

  /* 操作按钮固定在底部，内容再长也始终可点 */
  var acts = [];
  if (it && scheduleEnd(p) > todayStr() || (it && it.done)) {
    acts.push({ label: '本次未做（后续顺延）', act: 'skip-here', id: p.id, date: date });
  }
  acts.push(isPause
    ? { label: '从此日恢复治疗', act: 'resume-here', id: p.id, date: date }
    : { label: '本日停止治疗（后续顺延）', act: 'stop-here', id: p.id, date: date });
  if (!it && !isPause) {
    acts.push({ label: '本日加照', act: 'add-extra-date', id: p.id, date: date, primary: true });
  }

  openSheet({ title: (p.name || '') + ' · ' + date, body: body, actions: acts });
  reopenSheet = function () { var q = getPatient(p.id); if (q) sheetDayPatient(q, date); else closeSheet(); };
}

/* ================= AI 操作 ================= */
function handleAiFiles(files, done) {
  if (!files || !files.length) return;
  var arr = Array.prototype.slice.call(files);
  var left = arr.length;
  arr.forEach(function (f) {
    compressImage(f, function (dataUrl) {
      if (dataUrl) aiDraft.images.push({ name: (f && f.name) || '图片', dataUrl: dataUrl });
      if (--left === 0 && done) done();
    });
  });

/* 按患者合并：以本机为基础，把备份里新增的内容并入，不删任何东西 */
function mergeImport(inc) {
  var base = normalize(state);
  var byId = {}, byKey = {};
  base.patients.forEach(function (p) { byId[p.id] = p; if (p.name || p.mrn) byKey[pkey(p)] = p; });

  var added = 0, merged = 0;
  inc.patients.forEach(function (ip) {
    var target = byId[ip.id];
    if (!target && (ip.name || ip.mrn)) target = byKey[pkey(ip)];
    if (!target) {
      base.patients.push(ip);
      byId[ip.id] = ip;
      if (ip.name || ip.mrn) byKey[pkey(ip)] = ip;
      added++;
      return;
    }
    mergePatient(target, ip);
    merged++;
  });
  return { state: base, added: added, merged: merged };
}
function pkey(p) { return (p.name || '') + '|' + (p.mrn || ''); }

function mergePatient(base, inc) {
  /* 标量字段：本机为空时用备份的值补上（不用空值覆盖已有内容） */
  ['mrn', 'sex', 'age', 'physician', 'diagnosis', 'purpose', 'technique',
    'simDate', 'position', 'planStatus', 'totalDose', 'fractions',
    'dosePerFraction', 'startDate', 'completedAt'].forEach(function (k) {
      if (!base[k] && inc[k]) base[k] = inc[k];
    });
  /* 集合字段：按记录 id 并集去重 */
  ['reactions', 'pauses', 'extras', 'followupPlans', 'notes'].forEach(function (k) {
    base[k] = unionById(base[k] || [], inc[k] || []);
  });
  /* 纯值数组 */
  base.doneDates = unionValues(base.doneDates || [], inc.doneDates || []);
  if (!(base.treatDays && base.treatDays.length) && inc.treatDays) base.treatDays = inc.treatDays;
  /* 治疗日：取并集，避免丢失任一边的排程设定 */
  if (base.treatDays && inc.treatDays && inc.treatDays.length) {
    base.treatDays = unionValues(base.treatDays, inc.treatDays).map(Number).sort();
  }
  /* 状态：已完成优先保留，避免被「在治」覆盖 */
  if (inc.status === '治疗完成' && base.status !== '治疗完成') base.status = '治疗完成';
}

/* 副反应状态机的推进程度（数值越大越"靠后"，合并时取更靠后的） */
var STATUS_RANK = { '未处理': 1, '已处理待复查': 2, '已复查未解除': 3, '已解除': 4, '长期随访': 5 };

/* 按 id 并集；同一条记录的两份副本会合并其追踪记录、状态与空字段 */
function unionById(a, b) {
  var seen = {}, out = [];
  a.concat(b).forEach(function (x) {
    if (!x) return;
    var key = x.id || JSON.stringify(x);
    if (seen[key]) {
      var t = seen[key];
      /* 追踪记录：并集去重 */
      if (Array.isArray(x.followups) || Array.isArray(t.followups)) {
        t.followups = unionById(t.followups || [], x.followups || []);
      }
      /* 追踪状态：取推进更深的那一侧，避免已处理的信息被「未处理」覆盖 */
      if (x.status && t.status && STATUS_RANK[x.status] && STATUS_RANK[t.status]) {
        if (STATUS_RANK[x.status] > STATUS_RANK[t.status]) {
          t.status = x.status;
          if (x.closedAt) t.closedAt = x.closedAt;
        }
      }
      /* 随访计划：任一侧已完成即视为已完成 */
      if (x.done === true && t.done !== true) { t.done = true; if (x.doneAt) t.doneAt = x.doneAt; }
      /* 其余字段：本机为空时用另一侧补上 */
      Object.keys(x).forEach(function (k) {
        if (k === 'followups' || k === 'id' || k === 'status' || k === 'done') return;
        if ((t[k] === '' || t[k] == null) && x[k]) t[k] = x[k];
      });
    } else {
      seen[key] = x; out.push(x);
    }
  });
  return out;
}
function unionValues(a, b) {
  var seen = {}, out = [];
  a.concat(b).forEach(function (x) { var k = String(x); if (!seen[k]) { seen[k] = 1; out.push(x); } });
  return out;
}

/* 异常修正：某次实际未做 → 记 1 天中断，该次不计入已完成，后续自动顺延。

function getReaction(pid, rid) { var p = getPatient(pid); return p && (p.reactions || []).filter(function (r) { return r.id === rid; })[0]; }
function getFollowup(pid, fid) { var p = getPatient(pid); return p && (p.followupPlans || []).filter(function (f) { return f.id === fid; })[0]; }
function getPause(pid, id) { var p = getPatient(pid); return p && (p.pauses || []).filter(function (x) { return x.id === id; })[0]; }

/* 标记随访完成：从该次完成日自动生成下一次（沿用模板，形成随访链） */
function markFollowupDone(pid, fid) {
  var p = getPatient(pid); if (!p) return;
  var f = getFollowup(pid, fid); if (!f || f.done) return;
  f.done = true; f.doneAt = nowLocalInput();
  var nxt = nextAfter(p, f);
  save(); render();
  if (reopenSheet) reopenSheet();
  if (nxt) toast('已完成，下次随访 ' + dateOnly(nxt.dueDate));
  else toast('已标记完成（本次为最后一次随访）');
}
/* 依据模板顺序，生成某次随访之后的下一次 */
function nextAfter(p, f) {
  var tpl = followupTemplate(p);
  if (!tpl.length) return null;
  var idx = -1;
  for (var i = 0; i < tpl.length; i++) {
    if (tpl[i].offsetN === f.offsetN && tpl[i].offsetUnit === f.offsetUnit) { idx = i; break; }
  }
  if (idx < 0 || idx + 1 >= tpl.length) return null;   /* 已是最后一次 */
  var t = tpl[idx + 1];
  /* 起算点仍锚定「放疗结束日」，不随上一次实际完成时间漂移 */
  var base = followupBase(p) || todayStr();
  /* 若该次已存在（未完成）则不重复生成 */
  var exist = pendingFollowups(p).filter(function (x) {
    return x.offsetN === t.offsetN && x.offsetUnit === t.offsetUnit;
  })[0];
  if (exist) return exist;
  var plan = {
    id: uid('fp'), baseDate: base, offsetN: t.offsetN, offsetUnit: t.offsetUnit,
    dueDate: addInterval(base, t.offsetN, t.offsetUnit), note: t.note || '', done: false, doneAt: ''
  };
  p.followupPlans.push(plan);
  return plan;
}

function delPause(pid, id) { var p = getPatient(pid); if (!p) return; if (!confirm('确定删除这条中断记录？日程将重算。')) return; p.pauses = (p.pauses || []).filter(function (x) { return x.id !== id; }); save(); render(); toast('已删除'); }
function delExtra(pid, id) { var p = getPatient(pid); if (!p) return; if (!confirm('确定删除这条加照记录？')) return; p.extras = (p.extras || []).filter(function (x) { return x.id !== id; }); save(); render(); toast('已删除'); }
function completePatient(p) {

function restoreSnap(key) {

  try { state = normalize(JSON.parse(localStorage.getItem(key))); save(); render(); toast('已恢复快照'); } catch (e) { alert('恢复失败'); }
}
/* 从「更新前自动备份」回退（备份是原始格式，需经 normalize 转换） */
function restoreBackup(key) {
  if (!confirm('用这份更新前备份覆盖当前数据？\n\n当前数据会被替换，建议先导出一次现有数据。')) return;
  if (!confirm('再次确认：覆盖当前数据？')) return;
  var raw;
  try { raw = localStorage.getItem(key); } catch (e) { }
  if (!raw) { alert('备份内容已不存在'); return; }
  var d;
  try { d = JSON.parse(raw); } catch (e) { alert('备份内容无法解析'); return; }
  var keep = loadError;                 /* 回退成功后解除保护 */
  loadError = false;
  try { state = normalize(d); if (!save()) { loadError = keep; return; } }
  catch (e) { loadError = keep; alert('回退失败'); return; }
  view.page = 'tab'; render(); toast('已回退到该备份');
}
function clearAll() {

  state = { version: 2, updatedAt: '', patients: [] }; save(); view.page = 'tab'; view.tab = 'ward'; render(); toast('已清空');
}

function sheetAddHoliday() {
  openSheet({
    title: '添加节假日', okText: '添加',
    body: '<div class="hint" style="margin-bottom:8px">可填日期区间，一次添加整段假期（如春节 9 天）</div>' +
      '<div class="field2"><div class="field"><label>开始日期</label>' + textInput('from', todayStr(), '', 'date') + '</div>' +
      '<div class="field"><label>结束日期</label>' + textInput('to', todayStr(), '', 'date') + '</div></div>' +
      field('名称', textInput('name', '', '如 元旦 / 春节')),
    onSave: function (v) {
      if (!v.from) { toast('请选择开始日期'); return false; }
      var to = v.to || v.from;
      if (to < v.from) { toast('结束日期不能早于开始日期'); return false; }
      var n = daysBetween(v.from, to);
      if (n > 60) { toast('区间过长（最多 60 天）'); return false; }
      /* 与调休上班日重叠时先提示：该日期实际仍会安排治疗 */
      var mk = makeups(), clash = [];
      for (var k = 0; k <= n; k++) {
        var d0 = addDays(v.from, k);
        if (Object.prototype.hasOwnProperty.call(mk, d0)) clash.push(d0);
      }
      if (clash.length && !confirm('以下日期已设为「调休上班日」：' + clash.join('、') +
        '\n\n同一日期既在节假日又在调休时，排程按「调休上班」处理，当天仍会安排治疗。\n仍要作为节假日添加吗？')) return false;
      for (var i = 0; i <= n; i++) setHoliday(addDays(v.from, i), v.name || '节假日');
      render(); toast('已添加 ' + (n + 1) + ' 天');
      sheetHolidayManage();      /* 保存后回到列表 */
      return false;
    }
  });
}

function findAct(el, acts) {
  var cur = el;
  while (cur && cur !== document) {
    if (cur.dataset && cur.dataset.act) { var f = acts[cur.dataset.act]; if (f) return { el: cur, fn: f }; }
    cur = cur.parentElement;
  }
  return null;
}
function shiftCal(n) {
  var m = view.calM + n, y = view.calY;
  if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
  view.calY = y; view.calM = m; render();
}
