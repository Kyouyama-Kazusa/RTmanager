/* ================= 云同步（加密后存到 GitHub Gist） =================
   为什么这样设计：
   1. 密钥与 Token 只存本机，云端只有密文。GitHub 的 Secret Gist 并非真正私有
      （官方文档明确：知道 URL 就能访问），所以加密是必须的，不是可选项。
   2. 读写一律走 api.github.com 且禁用缓存。Gist API 带 Cache-Control: max-age=60，
      raw 路径还有 5 分钟 CDN 缓存（X-Cache: HIT），否则会「刚上传完拉取到旧数据」。
   3. 拉取后走「合并导入」，复用已有的合并逻辑 —— 两台设备各改各的不会互相覆盖。

   配置结构（localStorage: radiotherapy.sync）：
   { token, gistId, password, remember, device, lastSyncAt, lastRemoteUpdatedAt, lastEtag } */

function syncCfg() {
  var v = lsGet(SYNC_KEY, null);
  return (v && typeof v === 'object') ? v : {};
}
function setSyncCfg(o) { lsSet(SYNC_KEY, o || {}); }
function syncHasToken() { return !!String(syncCfg().token || '').trim(); }
function syncHasGist() { return !!String(syncCfg().gistId || '').trim(); }
/* 加密依赖 crypto.subtle：必须 https 或 localhost，file:// 下多数浏览器不可用 */
function syncSupported() { return !!(window.crypto && window.crypto.subtle && window.TextEncoder); }

function syncSubText() {
  if (!syncSupported()) return '当前环境不可用（需 https 或 localhost 打开）';
  var c = syncCfg();
  if (!syncHasToken()) return '未配置 · 加密备份到你的 GitHub，跨设备可用';
  if (!c.gistId) return '已配置 · 尚未上传（首次上传会自动创建云端数据）';
  return '已连接 · 上次同步 ' + (c.lastSyncAt ? fmtDT(String(c.lastSyncAt).slice(0, 16)) : '从未') +
    (autoSyncOn() ? ' · ⏱ 自动同步已开启' : '');
}

/* ---------- base64（分块，避免大数组触发 apply 参数上限） ---------- */
function syncToB64(buf) {
  var bytes = new Uint8Array(buf), s = '', CH = 0x8000;
  for (var i = 0; i < bytes.length; i += CH) {
    s += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + CH, bytes.length)));
  }
  return btoa(s);
}
function syncFromB64(str) {
  var bin = atob(str), a = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
}

/* ---------- 加密：PBKDF2-SHA256 派生 + AES-GCM-256 ----------
   密文自带 salt 与 iv，所以跨设备只需要「同一个密码」即可解密。
   AES-GCM 带认证标签：密码错或密文被改动都会直接失败，不会解出乱码。 */
function syncDeriveKey(pass, salt) {
  var enc = new TextEncoder();
  return crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey'])
    .then(function (base) {
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salt, iterations: SYNC_ITER, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    });
}
function syncEncrypt(pass, plain) {
  var salt = crypto.getRandomValues(new Uint8Array(16));
  var iv = crypto.getRandomValues(new Uint8Array(12));
  return syncDeriveKey(pass, salt).then(function (key) {
    return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(plain));
  }).then(function (ct) {
    return JSON.stringify({
      v: 1, app: 'RTmanager', alg: 'PBKDF2-SHA256/AES-GCM-256', iter: SYNC_ITER,
      salt: syncToB64(salt), iv: syncToB64(iv), data: syncToB64(ct)
    });
  });
}
function syncDecrypt(pass, blobStr) {
  var b;
  try { b = JSON.parse(blobStr); } catch (e) { return Promise.reject(new Error('云端内容不是有效的加密数据')); }
  if (!b || b.app !== 'RTmanager' || !b.salt || !b.iv || !b.data) {
    return Promise.reject(new Error('云端内容不是本应用的加密数据'));
  }
  return syncDeriveKey(pass, syncFromB64(b.salt)).then(function (key) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: syncFromB64(b.iv) }, key, syncFromB64(b.data));
  }).then(function (pt) {
    return new TextDecoder().decode(pt);
  }, function () {
    throw new Error('解密失败：同步密码不对（两台设备必须使用同一个密码）');
  });
}

/* ---------- GitHub API ---------- */
function ghFetch(path, opts) {
  opts = opts || {};
  var token = opts.token || String(syncCfg().token || '').trim();
  var headers = {
    'Authorization': 'Bearer ' + token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
  if (opts.body) headers['Content-Type'] = 'application/json';
  return fetch(SYNC_API + path, {
    method: opts.method || 'GET',
    headers: headers,
    body: opts.body,
    cache: 'no-store'          /* 关键：Gist API 带 max-age=60，不禁用会读到旧数据 */
  }).then(function (r) {
    return r.text().then(function (t) {
      var j = null;
      try { j = JSON.parse(t); } catch (e) { }
      return { ok: r.ok, status: r.status, json: j, text: t, etag: r.headers.get('etag') || '' };
    });
  }, function () {
    throw new Error('网络请求失败：请检查网络连接（浏览器直连 api.github.com）');
  });
}
function ghErrMsg(r) {
  var m = (r && r.json && r.json.message) || '';
  if (!r) return '请求失败';
  if (r.status === 401) return 'Token 无效或已过期（401）';
  if (r.status === 403) return 'Token 权限不足或已限流（403）' + (m ? '：' + m : '');
  if (r.status === 404) return '找不到云端数据（404）：地址可能不对，或 Token 无权访问';
  if (r.status === 422) return '内容被拒绝（422）' + (m ? '：' + m : '');
  return 'HTTP ' + r.status + (m ? '：' + m : '');
}
/* 支持粘贴 gist 网页链接或纯 id */
function parseGistId(s) {
  s = String(s || '').trim();
  if (!s) return '';
  var m = s.match(/gist\.github\.com\/(?:[^\/\s]+\/)?([0-9a-f]{16,})/i);
  if (m) return m[1];
  m = s.match(/([0-9a-f]{16,})/i);
  if (m) return m[1];
  return '';
}
/* 设备标识：只用于在两台设备之间辨认「这份数据是谁传的」 */
function syncDeviceLabel() {
  var c = syncCfg();
  if (c.device) return c.device;
  var ua = navigator.userAgent || '';
  var kind = /iPhone|iPad|iPod/.test(ua) ? 'iOS'
    : (/Android/.test(ua) ? 'Android' : (/Macintosh/.test(ua) ? 'Mac' : '电脑'));
  var label = kind + '-' + Math.random().toString(36).slice(2, 6);
  var o = syncCfg(); o.device = label; setSyncCfg(o);
  return label;
}
function syncPayload() {
  return {
    app: 'RTmanager',
    appVersion: APP_VERSION,
    schema: SCHEMA_VERSION,
    savedAt: new Date().toISOString(),
    device: syncDeviceLabel(),
    state: state,
    /* 设置层（节假日/调休/模板/默认治疗日）随数据一起走。
       它们决定排程结果，两台设备不一致会算出不同的结束日期。 */
    settings: exportSettings()
  };
}
function syncSetStatus(html) {
  var el = document.getElementById('syncStatus');
  if (el) el.innerHTML = html;
}
function syncFiles(blob) { var f = {}; f[SYNC_FILE] = { content: blob }; return f; }

/* 需要密码时：优先用已保存的，否则弹窗输入一次（不落库） */
function syncWithPassword(ok) {
  var p = String(syncCfg().password || '');
  if (p) { ok(p); return; }
  openSheet({
    title: '输入同步密码', okText: '继续',
    body: field('同步密码', textInput('password', '', '加密/解密用的密码', 'password'),
      '本机未保存密码，本次操作需要输入一次'),
    onSave: function (v) {
      var s = String(v.password || '');
      if (!s) { toast('请输入同步密码'); return false; }
      ok(s);
      return false;
    }
  });
}

/* ================= 定时自动同步 =================
   设计要点（安全优先）：
   1. 只上传、不拉取 —— 自动拉取可能覆盖另一台设备的改动，风险高，改由用户手动「合并导入」。
   2. 必须已在本机保存密码 —— 否则无法静默加密。不弹窗打断用户，只记录原因供界面展示。
   3. 本机无患者数据时不上传 —— 防止把空数据覆盖到云端已有备份。
   4. 云端被别的设备改过就跳过 —— 不覆盖、不弹窗（手动 syncPush 才有覆盖确认，自动路径不给这个口子）。
   5. 失败不更新 lastAutoSyncAt —— 否则会静默跳过一个周期。
   6. 全程不弹 alert/confirm/toast、不调 render，避免打断录入。 */

/* 间隔（分钟）：非法值一律回落默认 60 */
function autoSyncMin() {
  var n = parseInt(syncCfg().autoSyncMin, 10);
  return (AUTO_SYNC_OPTIONS.indexOf(n) >= 0) ? n : AUTO_SYNC_DEFAULT_MIN;
}
function setAutoSyncMin(n) {
  var v = parseInt(n, 10);
  var o = syncCfg();
  o.autoSyncMin = (AUTO_SYNC_OPTIONS.indexOf(v) >= 0) ? v : AUTO_SYNC_DEFAULT_MIN;
  setSyncCfg(o);
}
function autoSyncOn() { return syncCfg().autoSync === true; }
function setAutoSyncOn(b) {
  var o = syncCfg();
  o.autoSync = !!b;
  if (b) {
    /* 开启时重置计时基准，让用户立刻看到一次同步（而不是等满一个间隔） */
    o.lastAutoSyncAt = '';
    o.lastAutoSyncErr = '';
  }
  setSyncCfg(o);
}
/* 间隔文案：60 → “1 小时”；30 → “30 分钟” */
function autoSyncMinText(n) {
  n = n || autoSyncMin();
  if (n < 60) return n + ' 分钟';
  var h = n / 60;
  return (h === Math.floor(h) ? h : h.toFixed(1)) + ' 小时';
}
/* 是否具备“静默同步”的条件。缺任何一项都不执行，并给出具体原因。 */
function autoSyncBlockReason() {
  if (!syncSupported()) return '当前环境不支持加密（需 https 或 localhost 打开）';
  if (!syncHasToken()) return '尚未配置云同步（缺少 Token）';
  if (!String(syncCfg().password || '')) return '未在本机保存密码，无法自动同步（请在云同步设置里勾选「在本机记住密码」）';
  return '';
}
function autoSyncEnabled() { return autoSyncOn() && !autoSyncBlockReason(); }

/* 距上次自动同步是否已超过设定间隔。从未成功同步过 → 立即到期。 */
function autoSyncDue() {
  var last = String(syncCfg().lastAutoSyncAt || '');
  if (!last) return true;
  var t = new Date(last).getTime();
  if (isNaN(t)) return true;                       /* 时间戳损坏 → 视为到期 */
  return (Date.now() - t) >= autoSyncMin() * 60000;
}
/* 设置层指纹：改了节假日/调休/模板/治疗日也算「有变更」。
   与患者数据不同，设置不在 state.updatedAt 里，必须单独比。 */
function settingsSig() {
  try { return JSON.stringify(exportSettings()); } catch (e) { return ''; }
}
/* 本次运行期间设置是否被动过（用于「刚打开就自动传」时也能识别本机改动） */
function settingsDirty() { return !!settingsDirtyAt; }
/* 数据自上次自动同步以来是否变过（患者数据比 updatedAt，设置比指纹） */
function autoSyncDataChanged() {
  var s = syncCfg();
  if (String(state.updatedAt || '') !== String(s.lastAutoSyncState || '')) return true;
  if (settingsDirty() && settingsSig() !== String(s.lastAutoSyncSettings || '')) return true;
  return false;
}
/* 三条件与门：开关可用 + 已到期 + 数据变过 */
function autoSyncShouldRun() {
  return state && autoSyncEnabled() && autoSyncDue() && autoSyncDataChanged();
}

/* 静默上传：不弹窗、不 render、不 toast，仅更新配置里的状态字段 */
function autoSyncSilentPush(reason) {
  if (autoSyncBusy) return Promise.resolve(false);   /* 并发去重 */
  if (!state.patients.length) {                      /* 空数据绝不覆盖云端 */
    var e0 = syncCfg();
    e0.lastAutoSyncErr = '本机暂无患者数据，已跳过自动上传';
    setSyncCfg(e0);
    return Promise.resolve(false);
  }
  autoSyncBusy = true;
  var pw = String(syncCfg().password || '');
  var okFlag = false;
  return syncEncrypt(pw, JSON.stringify(syncPayload())).then(function (blob) {
    if (!syncHasGist()) return syncCreate(blob);
    /* 自动路径：先比对云端 updated_at，被别的设备改过就跳过（不覆盖、不弹窗） */
    var c = syncCfg();
    return ghFetch('/gists/' + c.gistId).then(function (r) {
      if (!r.ok) throw new Error(ghErrMsg(r));
      var remoteUpdated = r.json && r.json.updated_at ? r.json.updated_at : '';
      if (c.lastRemoteUpdatedAt && remoteUpdated && remoteUpdated !== c.lastRemoteUpdatedAt) {
        var err = new Error('云端已被其他设备更新，已跳过自动上传（可手动「从云端拉取」后再上传）');
        err.autoSkip = true;
        throw err;
      }
      return ghFetch('/gists/' + c.gistId, {
        method: 'PATCH',
        body: JSON.stringify({ files: syncFiles(blob) })
      }).then(function (r2) {
        if (!r2.ok) throw new Error(ghErrMsg(r2));
        var o = syncCfg();
        o.lastRemoteUpdatedAt = (r2.json && r2.json.updated_at) || '';
        o.lastEtag = r2.etag || '';
        setSyncCfg(o);
      });
    });
  }).then(function () {
    var o = syncCfg();
    o.lastAutoSyncAt = new Date().toISOString();
    o.lastSyncAt = o.lastAutoSyncAt;
    o.lastRemoteSavedAt = o.lastAutoSyncAt;
    o.lastAutoSyncState = String(state.updatedAt || '');   /* 记下"已同步到哪个版本" */
    o.lastAutoSyncSettings = settingsSig();                /* 记下设置层指纹 */
    o.lastAutoSyncErr = '';
    o.lastAutoSyncReason = reason || '';
    setSyncCfg(o);
    okFlag = true;
    return true;
  }).catch(function (e) {
    /* 失败不更新 lastAutoSyncAt，下个触发点会重试 */
    var o = syncCfg();
    o.lastAutoSyncErr = (e && e.message) ? e.message : String(e);
    setSyncCfg(o);
    return false;
  }).then(function (r) {
    autoSyncBusy = false;
    return r;
  });
}

/* 唯一入口：满足全部条件才真正上传 */
function autoSyncTick(reason) {
  if (loadError) return false;                       /* 读取异常时绝不动作 */
  if (!autoSyncShouldRun()) return false;
  autoSyncSilentPush(reason);
  return true;
}

/* 数据变更后的去抖：连续录入时只在停手 20 秒后同步一次 */
function autoSyncSchedule() {
  if (!autoSyncEnabled()) return;
  if (autoSyncTimer) { try { clearTimeout(autoSyncTimer); } catch (e) { } }
  autoSyncTimer = setTimeout(function () {
    autoSyncTimer = null;
    autoSyncTick('change');
  }, AUTO_SYNC_DEBOUNCE_MS);
}

function autoSyncSubText() {
  if (!syncHasToken()) return '需先配置云同步';
  if (!autoSyncOn()) return '已关闭 · 定时把本机数据备份到云端';
  var block = autoSyncBlockReason();
  if (block) return '已开启但无法执行 · ' + block;
  var c = syncCfg();
  var s = '每 ' + autoSyncMinText() + ' 检查 · ';
  s += c.lastAutoSyncAt ? ('上次 ' + fmtDT(String(c.lastAutoSyncAt).slice(0, 16))) : '尚未同步';
  if (c.lastAutoSyncErr) s += ' · ⚠ ' + c.lastAutoSyncErr;
  return s;
}

/* ---------- 上传 ---------- */
function syncPush() {
  if (!syncSupported()) { toast('当前环境不支持加密，请用 https 或 localhost 打开'); return; }
  if (!syncHasToken()) { toast('请先完成云同步设置'); sheetSyncSetup(); return; }
  if (!state.patients.length && !confirm('本机暂无患者数据。\n\n仍要上传吗？上传会覆盖云端已有的数据。')) return;

  syncWithPassword(function (pw) {
    syncSetStatus('正在加密本机数据…');
    syncEncrypt(pw, JSON.stringify(syncPayload())).then(function (blob) {
      if (!syncHasGist()) return syncCreate(blob);
      return syncUpdate(blob);
    }).then(function () {
      var o = syncCfg();
      o.lastSyncAt = new Date().toISOString();
      o.lastRemoteSavedAt = o.lastSyncAt;
      /* 手动上传也把「已同步到哪个版本」推进，避免刚传完又被自动同步再传一次 */
      o.lastAutoSyncState = String(state.updatedAt || '');
      o.lastAutoSyncSettings = settingsSig();
      o.lastAutoSyncErr = '';
      setSyncCfg(o);
      settingsDirtyAt = '';
      render();
      toast('已上传到云端 · ' + state.patients.length + ' 位患者' +
        (settingsSummary(exportSettings()) ? '（含设置：' + settingsSummary(exportSettings()) + '）' : ''));
      if (reopenSheet) reopenSheet();
    }).catch(function (e) {
      if (e && e.cancelled) { syncSetStatus('已取消上传'); return; }
      var msg = (e && e.message) ? e.message : String(e);
      syncSetStatus('<span style="color:var(--danger)">✘ ' + esc(msg) + '</span>');
      alert('上传失败：' + msg);
    });
  });
}
function syncCreate(blob) {
  syncSetStatus('正在创建云端数据…');
  return ghFetch('/gists', {
    method: 'POST',
    body: JSON.stringify({
      description: 'RTmanager 加密同步数据 · 请勿删除',
      public: false,
      files: syncFiles(blob)
    })
  }).then(function (r) {
    if (!r.ok) throw new Error(ghErrMsg(r));
    var o = syncCfg();
    o.gistId = r.json.id;
    o.lastRemoteUpdatedAt = r.json.updated_at || '';
    o.lastEtag = r.etag || '';
    setSyncCfg(o);
  });
}
function syncUpdate(blob) {
  syncSetStatus('正在检查云端版本…');
  var c = syncCfg();
  return ghFetch('/gists/' + c.gistId).then(function (r) {
    if (!r.ok) throw new Error(ghErrMsg(r));
    var remoteUpdated = r.json.updated_at || '';
    if (c.lastRemoteUpdatedAt && remoteUpdated && remoteUpdated !== c.lastRemoteUpdatedAt) {
      if (!confirm('⚠ 云端数据在上次同步之后被改动过，可能是另一台设备上传的。\n\n' +
        '继续上传会覆盖云端那一份。\n建议先「从云端拉取」合并，再上传。\n\n仍要覆盖上传吗？')) {
        var err = new Error('已取消上传');
        err.cancelled = true;
        throw err;
      }
    }
    syncSetStatus('正在上传…');
    return ghFetch('/gists/' + c.gistId, {
      method: 'PATCH',
      body: JSON.stringify({ files: syncFiles(blob) })
    });
  }).then(function (r) {
    if (!r.ok) throw new Error(ghErrMsg(r));
    var o = syncCfg();
    o.lastRemoteUpdatedAt = (r.json && r.json.updated_at) || '';
    o.lastEtag = r.etag || '';
    setSyncCfg(o);
  });
}

/* ---------- 拉取 ---------- */
function syncPull() {
  if (!syncSupported()) { toast('当前环境不支持解密，请用 https 或 localhost 打开'); return; }
  if (!syncHasToken()) { toast('请先完成云同步设置'); sheetSyncSetup(); return; }
  if (!syncHasGist()) { toast('还没有云端数据，请先在本机上传一次'); return; }

  syncWithPassword(function (pw) {
    var gid = syncCfg().gistId;
    syncSetStatus('正在从云端下载…');
    var remoteUpdated = '', remoteEtag = '';
    ghFetch('/gists/' + gid).then(function (r) {
      if (!r.ok) throw new Error(ghErrMsg(r));
      var file = (r.json.files || {})[SYNC_FILE];
      if (!file) {
        var ks = Object.keys(r.json.files || {});
        throw new Error('云端数据里找不到 ' + SYNC_FILE + (ks.length ? '（现有文件：' + ks.join('、') + '）' : ''));
      }
      if (file.truncated) throw new Error('云端数据过大被截断，无法完整读取');
      remoteUpdated = r.json.updated_at || '';
      remoteEtag = r.etag || '';
      syncSetStatus('正在解密…');
      return syncDecrypt(pw, file.content);
    }).then(function (text) {
      var payload;
      try { payload = JSON.parse(text); } catch (e) { throw new Error('解密成功但内容格式不对，可能不是本应用的数据'); }
      if (!payload || payload.app !== 'RTmanager' || !payload.state || !Array.isArray(payload.state.patients)) {
        throw new Error('云端数据不是本应用的备份');
      }
      var o = syncCfg();
      o.lastRemoteUpdatedAt = remoteUpdated;
      o.lastEtag = remoteEtag;
      o.lastSyncAt = new Date().toISOString();
      o.lastRemoteSavedAt = payload.savedAt || '';
      o.lastRemoteDevice = payload.device || '';
      setSyncCfg(o);      syncSetStatus('已解密云端数据');
      /* 设置层（节假日/调休/模板/默认治疗日）先合并落地 ——
         用户点「导入」之后是 normalize/合并患者，设置此时已可安全并入：
         取并集、本机优先、删除（null）同样参与合并，不会把本机删掉的节日「复活」。 */
      var sm = importSettings(payload.settings, true);
      if (sm.changed) save();
      /* 设置已并入本机，指纹随之更新，避免下次自动同步又传一遍 */
      var o2 = syncCfg();
      o2.lastAutoSyncSettings = settingsSig();
      setSyncCfg(o2);
      settingsDirtyAt = '';
      askImportMode(normalize(payload.state), {
        label: '云端数据',
        desc: '由「' + (payload.device || '未知设备') + '」于 ' +
          fmtDT(String(payload.savedAt || '').slice(0, 16)) + ' 上传（应用 v' + (payload.appVersion || '?') + '）' +
          (settingsSummary(payload.settings) ? '；含设置：' + settingsSummary(payload.settings) : '') +
          (sm.changed ? '；已并入本机设置（' + sm.details.length + ' 项）' : '；设置无变化')
      });
    }).catch(function (e) {
      var msg = (e && e.message) ? e.message : String(e);
      syncSetStatus('<span style="color:var(--danger)">✘ ' + esc(msg) + '</span>');
      alert('拉取失败：' + msg);
    });
  });
}

/* ---------- 测试连接 ---------- */
function syncTest() {
  var v = sheetValues();
  var token = String(v.token || syncCfg().token || '').trim();
  var gidRaw = String(v.gistId || '').trim();
  var el = document.getElementById('syncTest');
  if (!token) { toast('请先填写 Token'); return; }
  if (el) el.textContent = '测试中…';
  ghFetch('/user', { token: token }).then(function (r) {
    if (!r.ok) throw new Error(ghErrMsg(r));
    var login = (r.json && r.json.login) || '?';
    /* 顺带验证 gist 权限 */
    return ghFetch('/gists?per_page=1', { token: token }).then(function (r2) {
      if (r2.status === 403) throw new Error('Token 缺少 gist 权限（403）：请勾选 gist 或 Gists: Read and write');
      if (!r2.ok) throw new Error(ghErrMsg(r2));
      var gid = parseGistId(gidRaw);
      var extra = '';
      if (gid) {
        return ghFetch('/gists/' + gid, { token: token }).then(function (r3) {
          if (!r3.ok) throw new Error('云端地址读取失败：' + ghErrMsg(r3));
          extra = '　云端数据可访问（更新于 ' + String(r3.json.updated_at || '').slice(0, 16).replace('T', ' ') + '）';
          if (el) el.innerHTML = '<span style="color:var(--ok)">✔ 连接正常：' + esc(login) + '</span>' + esc(extra);
        });
      }
      if (el) el.innerHTML = '<span style="color:var(--ok)">✔ 连接正常：' + esc(login) + '，可用 gist</span>' + esc(extra);
    });
  }).catch(function (e) {
    if (el) el.innerHTML = '<span style="color:var(--danger)">✘ ' + esc(e.message || String(e)) + '</span>';
  });
}

/* ---------- 定时自动同步面板 ---------- */
function sheetAutoSync() {
  reopenSheet = sheetAutoSync;
  var c = syncCfg();
  var block = autoSyncBlockReason();
  var on = autoSyncOn();

  var statusHtml;
  if (block) {
    statusHtml = '<div style="background:var(--warn-soft);border-radius:10px;padding:11px 12px;line-height:1.75;font-size:14px">' +
      '<b>暂时无法执行</b><br>' + esc(block) + '</div>';
  } else if (!on) {
    statusHtml = '<div class="hint" style="line-height:1.85">当前<b>已关闭</b>。开启后，应用会在你每次回到界面、' +
      '网络恢复、或改完数据约 20 秒后，检查距上次同步是否已超过设定间隔，超过就自动上传一次。</div>';
  } else {
    statusHtml = '<div style="line-height:1.95;font-size:14px">' +
      '间隔：<b>' + esc(autoSyncMinText()) + '</b><br>' +
      '上次自动同步：' + (c.lastAutoSyncAt ? esc(fmtDT(String(c.lastAutoSyncAt).slice(0, 16))) : '尚未同步（下次触发时执行）') + '<br>' +
      '上次结果：' + (c.lastAutoSyncErr
        ? '<span style="color:var(--danger)">✘ ' + esc(c.lastAutoSyncErr) + '</span>'
        : '<span style="color:var(--ok)">✔ 正常</span>') +
      '</div>';
  }

  var actions = [
    { label: (on ? '⏸ 关闭自动同步' : '▶ 开启自动同步'), act: 'autosync-toggle', primary: !on, full: true, disabled: !!block && !on },
    { label: '同步间隔：' + autoSyncMinText(), act: 'autosync-interval', full: true, disabled: !on },
    { label: '立即同步一次', act: 'autosync-now', full: true, disabled: !syncSupported() },
    { label: '返回云同步', act: 'sync-panel', full: true }
  ];

  openSheet({
    title: '定时自动同步',
    body: statusHtml +
      '<div class="hint" style="margin-top:12px;line-height:1.85;border-top:1px dashed var(--line);padding-top:10px">' +
      '· <b>只上传、不拉取</b>：自动同步只把本机数据备份到云端；换设备或要合并，请手动「从云端拉取」<br>' +
      '· 上传内容含患者数据与<b>节假日/调休等设置</b>，换设备后排程结果与这边一致<br>' +
      '· <b>要静默加密必须先在本机保存密码</b>（云同步设置里勾选「在本机记住密码」）<br>' +
      '· 本机没有任何患者数据时<b>不会上传</b>，避免把空数据覆盖到云端<br>' +
      '· 云端若已被另一台设备更新，会自动跳过并提示，<b>不覆盖</b><br>' +
      '· 因系统限制，手机切到后台时网页无法定时运行；同步会在你回到应用时补上</div>' +
      '<div id="autoSyncStatus" class="hint" style="margin-top:8px;min-height:1px"></div>',
    actions: actions
  });
}

/* 间隔选择弹层 */
function sheetAutoSyncInterval() {
  reopenSheet = sheetAutoSync;
  var cur = autoSyncMin();
  var rows = AUTO_SYNC_OPTIONS.map(function (n) {
    return '<div class="setrow" data-act="autosync-set" data-min="' + n + '">' +
      '<div style="font-size:18px">' + (n === cur ? '✅' : '⏱') + '</div>' +
      '<div class="n">' + esc(autoSyncMinText(n)) + '</div>' +
      (n === cur ? '<div class="arw" style="color:var(--ok)">当前</div>' : '<div class="arw">›</div>') + '</div>';
  }).join('');
  openSheet({
    title: '同步间隔',
    body: '<div class="hint" style="margin-bottom:10px;line-height:1.8">间隔指的是「两次自动同步之间至少相隔多久」。' +
      '应用不会在后台定时唤醒，而是在你回到界面时检查是否已超过该间隔。</div>' + rows,
    actions: [{ label: '返回', act: 'autosync-panel', full: true }]
  });
}

/* 手动触发一次自动同步（走静默路径，但会给用户可见的反馈） */
function autoSyncNow() {
  var block = autoSyncBlockReason();
  if (block) { toast(block); return; }
  if (!state.patients.length) { toast('本机暂无患者数据，无需同步'); return; }
  var el = document.getElementById('autoSyncStatus');
  if (el) el.textContent = '正在同步…';
  autoSyncSilentPush('manual').then(function (okFlag) {
    var c = syncCfg();
    var el2 = document.getElementById('autoSyncStatus');
    if (okFlag) {
      if (el2) el2.innerHTML = '<span style="color:var(--ok)">✔ 已同步到云端（' + state.patients.length + ' 位患者）</span>';
      if (reopenSheet) reopenSheet();
    } else {
      if (el2) el2.innerHTML = '<span style="color:var(--danger)">✘ ' + esc(c.lastAutoSyncErr || '同步失败') + '</span>';
      if (reopenSheet) reopenSheet();
    }
  });
}

function sheetSyncSetup() {
  var c = syncCfg();
  reopenSheet = sheetSync;
  openSheet({
    title: '云同步设置', okText: '保存',
    body:
      '<div class="hint" style="padding:9px 11px;background:var(--warn-soft);border-radius:9px;line-height:1.75;margin-bottom:12px">' +
      'Token 与密码只保存在本机浏览器，不会上传。云端只存加密后的数据。</div>' +
      field('GitHub Token', textInput('token', c.token || '', 'ghp_… 或 github_pat_…', 'password'),
        '只需 gist 权限。Classic：勾选 gist；Fine-grained：Gists 设为 Read and write') +
      field('同步密码', textInput('password', c.password || '', '自定密码，两台设备要一致'),
        '用于加解密，建议 8 位以上。忘记密码将无法解密云端数据（本机数据不受影响）。') +
      field('云端地址（可留空）', textInput('gistId', c.gistId || '', '留空则首次上传时自动创建'),
        '换设备时把另一台设备的云端地址粘贴到这里，支持粘贴完整网页链接') +
      '<label style="display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;color:var(--text)">' +
      '<input type="checkbox" name="remember" ' + (c.remember !== false ? 'checked' : '') + ' style="width:auto">' +
      '<span>在本机记住密码（下次免输入）</span></label>' +
      '<div class="btnrow"><button type="button" class="btn sm" data-act="sync-test">测试连接</button></div>' +
      '<div id="syncTest" class="hint" style="margin-top:8px;min-height:1px"></div>',
    onSave: function (v) {
      var token = String(v.token || '').trim();
      var pass = String(v.password || '');
      var gidRaw = String(v.gistId || '').trim();
      if (!token) { toast('请填写 GitHub Token'); return false; }
      if (!pass) { toast('请设置同步密码'); return false; }
      if (pass.length < 8) { toast('同步密码至少 8 位'); return false; }
      var gid = parseGistId(gidRaw);
      if (gidRaw && !gid) { toast('云端地址无法识别，请粘贴 gist 网页链接或 gist id'); return false; }
      var o = syncCfg();
      o.token = token;
      o.gistId = gid;
      /* 复选框：正常取值是布尔；测试环境取不到时沿用原设置 */
      o.remember = (v.remember === undefined) ? (o.remember !== false) : !!v.remember;
      o.password = o.remember ? pass : '';
      setSyncCfg(o);
      render(); toast('已保存云同步设置');
      sheetSync();
      return false;                  /* 不关闭，直接回到同步面板 */
    }
  });
}

function syncCopyUrl() {
  var c = syncCfg();
  if (!c.gistId) { toast('还没有云端数据'); return; }
  var url = 'https://gist.github.com/' + c.gistId;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(function () {
      toast('已复制云端地址，可在另一台设备粘贴');
    }, function () {
      if (typeof prompt === 'function') prompt('复制下面的地址：', url);
    });
  } else if (typeof prompt === 'function') {
    prompt('复制下面的地址：', url);
  }
}

function syncForget() {
  if (!confirm('清除本机保存的云同步设置？\n\nToken 与密码会从本机删除，' +
    '云端已上传的数据不会受影响；本机患者数据也不受影响。')) return;
  lsSet(SYNC_KEY, {});
  render(); toast('已清除云同步设置');
  sheetSync();
}

      ]
    });
  } else if (migrateNotice) {
    toast(migrateNotice);
  }
}

/* ================= 新版本提示 ================= */
/* 发布新版本后，SW 在 activate 阶段广播 RT_SW_UPDATED；
   页面据此提示用户刷新（HTML 走网络优先，刷新即拿到新版）。 */
var updateBarShown = false;
function showUpdateBar() {
  if (updateBarShown) return;
  updateBarShown = true;
  var bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;left:12px;right:12px;bottom:72px;z-index:98;background:#0f766e;color:#fff;' +
    'border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:14px;' +
    'box-shadow:0 8px 24px rgba(15,118,110,.32)';
  var txt = document.createElement('div');
  txt.style.cssText = 'flex:1;line-height:1.45';
  txt.textContent = '应用已更新到新版本，刷新后生效';
  var go = document.createElement('button');
  go.textContent = '刷新';
  go.style.cssText = 'border:0;border-radius:8px;padding:7px 14px;background:#fff;color:#0f766e;font-size:14px;font-weight:600';
  go.addEventListener('click', function () { location.reload(); });
  var no = document.createElement('button');
  no.textContent = '稍后';
  no.style.cssText = 'border:0;background:transparent;color:rgba(255,255,255,.85);font-size:13px;padding:6px 4px';
  no.addEventListener('click', function () { if (bar.parentElement) bar.parentElement.removeChild(bar); });
  bar.appendChild(txt); bar.appendChild(go); bar.appendChild(no);
  document.body.appendChild(bar);
}

/* ================= 初始化 ================= */
function init() {
  load();
  bind();
  /* 演示模式仅在数据可正常读取且为空时生效，避免覆盖受影响的数据 */
  if (!loadError && /[?&]demo=\d/.test(location.search) && !state.patients.length) {
    state = buildDemoState(); save();
    var dm = location.search.match(/[?&]demo=(\d)/);
    view.tab = dm ? (['todo', 'ward', 'cal', 'done'][parseInt(dm[1], 10) - 1] || 'todo') : 'todo';
  }
  render();
  showDataNotice();
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('./sw.js').then(function (reg) {
      /* 已存在等待中的新版本（例如后台更新已完成）→ 直接提示 */
      if (reg.waiting && navigator.serviceWorker.controller) showUpdateBar();
      reg.addEventListener('updatefound', function () {
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBar();
        });
      });
    }).catch(function () { });
    /* SW 广播的版本更新消息 */
    navigator.serviceWorker.addEventListener('message', function (ev) {
      if (ev.data && ev.data.type === 'RT_SW_UPDATED') showUpdateBar();
    });
  }
  bindAutoSync();
}

/* 定时自动同步的生命周期挂钩。
   刻意不用 setInterval：装到手机的 PWA 切到后台后定时器会被系统挂起或销毁，
   间隔设 1 小时也可能永远不触发。改在这些可靠的节点上"检查是否到点"。 */
function bindAutoSync() {
  /* 兜底：个别宿主环境（旧 WebView、极简嵌入式壳）可能没有 window.addEventListener。
     自动同步是"锦上添花"的功能，绝不能因为它让整个应用起不来。 */
  var onWin = (typeof window !== 'undefined' && window && typeof window.addEventListener === 'function')
    ? function (ev, fn) { window.addEventListener(ev, fn); }
    : function () { };
  var onDoc = (typeof document !== 'undefined' && document && typeof document.addEventListener === 'function')
    ? function (ev, fn) { document.addEventListener(ev, fn); }
    : function () { };
  /* 回到应用（从后台切回、解锁手机）——最主要的触发时机 */
  onDoc('visibilitychange', function () {
    if (document.visibilityState === 'visible') autoSyncTick('visible');
  });
  /* 网络恢复 —— 之前失败的那次可以补上 */
  onWin('online', function () { autoSyncTick('online'); });
  /* 离开页面 —— 用 keepalive 兜底发一次，不等结果。
     移动端关页时普通 fetch 常被中断，keepalive 能让请求在页面销毁后继续完成。 */
  onWin('pagehide', function () {
    if (loadError || !autoSyncShouldRun() || !state.patients.length) return;
    try {
      var pw = String(syncCfg().password || '');
      syncEncrypt(pw, JSON.stringify(syncPayload())).then(function (blob) {
        var c = syncCfg();
        if (!c.gistId) return;                 /* 首次创建需要读响应，来不及，留给下次 */
        fetch(SYNC_API + '/gists/' + c.gistId, {
          method: 'PATCH',
          keepalive: true,
          cache: 'no-store',
          headers: {
            'Authorization': 'Bearer ' + String(c.token || '').trim(),
            'Accept': 'application/vnd.github+json',
            'Content-Type': 'application/json',
            'X-GitHub-Api-Version': '2022-11-28'
          },
          body: JSON.stringify({ files: syncFiles(blob) })
        }).catch(function () { });
      }).catch(function () { });
    } catch (e) { }
  });
  /* 启动时先检查一次（可能是隔了一夜后第一次打开） */
  autoSyncTick('start');
}
init();
</script>
