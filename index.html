    'cal-day': function (el) {
      var date = el.dataset.date;
      if (view.page === 'patient' && view.pid) sheetDayPatient(getPatient(view.pid), date);
      else sheetDayOverall(date);
    },
    'skip-here': function (el) { skipHere(el.dataset.id, el.dataset.date); },
    'stop-here': function (el) { stopHere(el.dataset.id, el.dataset.date); },
    'resume-here': function (el) { resumeHere(el.dataset.id, el.dataset.date); },
    'add-extra-date': function (el) { addExtraDate(el.dataset.id, el.dataset.date); },
    'export-csv': function () { exportCsv(); },
    'export-json': function () { exportJson(); },
    'import-json': function () { var i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json'; i.onchange = function () { if (i.files[0]) importJson(i.files[0]); }; i.click(); },
    'import-merge': function () {
      if (!pendingImport) return;
      var r = mergeImport(pendingImport);
      state = r.state; pendingImport = null;
      save(); closeSheet(); render();
      toast('已合并：新增 ' + r.added + ' 位，合并 ' + r.merged + ' 位');
    },
    'import-overwrite': function () {
      if (!pendingImport) return;
      if (!confirm('将用备份文件完全替换本机数据，本机现有内容会丢失。确定继续？')) return;
      state = pendingImport; pendingImport = null;
      save(); closeSheet(); view.page = 'tab'; render();
      toast('已覆盖导入');
    },
    'restore-snap': function (el) { restoreSnap(el.dataset.key); },
    'restore-backup': function (el) { restoreBackup(el.dataset.key); },
    'treat-days': function () { sheetTreatDays(); },
    'hol-manage': function () { sheetHolidayManage(); },
    'mk-manage': function () { sheetMakeupManage(); },
    'hol-add': function () { sheetAddHoliday(); },
    'mk-add': function () { sheetAddMakeup(); },
    'hol-del': function (el) {
      var d = el.dataset.date;
      if (isBuiltinHol(d) && !confirm('「' + d + '」是内置假期，删除后将不再作为假期排程。确定继续？')) return;
      delHoliday(d); render(); toast('已删除');
      if (reopenSheet) reopenSheet();
    },
    'mk-del': function (el) {
      var d = el.dataset.date;
      if (isBuiltinMk(d) && !confirm('「' + d + '」是内置调休上班日，删除后将不再按工作日治疗。确定继续？')) return;
      delMakeup(d); render(); toast('已删除');
      if (reopenSheet) reopenSheet();
    },
    'hol-reset': function () {
      if (!confirm('恢复内置假期数据？将清除你添加/删除的全部假期设置。')) return;
      lsSet('radiotherapy.holidays', {}); lsSet('radiotherapy.makeups', {});
      render(); toast('已恢复内置数据');
      if (reopenSheet) reopenSheet();
    },
    /* ---- 随访模板管理 ---- */
    'tpl-manage': function () { sheetTplManage(getPatient(view.pid)); },
    'tpl-settings': function () { sheetTplManage(null); },
    'tpl-del': function (el) {
      var nm = el.dataset.name;
      var isB = isBuiltinTpl(nm);
      if (!confirm('删除模板「' + nm + '」？' + (isB ? '（内置模板可随时恢复）' : '（自建模板删除后需重新保存）'))) return;
      delTpl(nm);
      toast('已删除模板「' + nm + '」');
      sheetTplManage(getPatient(view.pid));
    },
    'tpl-reset': function () {
      if (!confirm('恢复内置模板？将清除你新建的全部自建模板与删除操作。')) return;
      resetTpls();
      toast('已恢复内置模板');
      sheetTplManage(getPatient(view.pid));
    },
    'tpl-use': function (el) {
      var nm = el.dataset.name;
      var t = findTpl(nm);
      if (!t) { toast('该模板已不存在'); return; }
      var pp = getPatient(view.pid);
      if (!pp) { closeSheet(); toast('「' + t.name + '」共 ' + t.items.length + ' 次随访。请进入患者详情页套用。'); return; }
      applyTplToPatient(pp, { name: t.name, items: t.items, base: followupTplBase(pp) || treatmentEndOf(pp) });
      render();
      toast('已按「' + t.name + '」排出 ' + t.items.length + ' 次随访');
      sheetFollowupTemplate(pp);
    },
    'tpl-back': function () {
      var pp = getPatient(view.pid);
      if (pp) sheetFollowupTemplate(pp); else closeSheet();
    },
    'tpl-back': function () { sheetFollowupTemplate(getPatient(view.pid)); },
    'toggle-makeup': function () { setMakeupAsWorkday(!makeupAsWorkday()); render(); toast(makeupAsWorkday() ? '调休上班日已按工作日治疗' : '调休上班日不再治疗'); },
    'selftest': function () { runSelfTest(); },
    'export-raw': function () { exportRawData(); },
    'sheet-close': function () { closeSheet(); },
    'demo-data': function () { seedDemo(); },
    'clear-all': function () { clearAll(); }
  };

  /* 视图 + 弹层统一委托 */
  document.addEventListener('click', function (e) {
    var hit = findAct(e.target, acts);
    if (hit) hit.fn(hit.el);
  });
}

/* ================= 数据迁移 / 读取失败提示 ================= */
function showDataNotice() {
  if (loadError) {
    openSheet({
      title: '未能读取本机数据',
      body: '<div style="background:var(--danger-soft);border-radius:10px;padding:12px;margin-bottom:12px;line-height:1.8;font-size:14px">' +
        '⚠ 原数据<b>仍完整保留在本机</b>，没有被删除。<br>' +
        '为防止误覆盖，此次已<b>暂停保存功能</b>。</div>' +
        '<div class="hint" style="line-height:1.8">建议按顺序操作：<br>' +
        '1. 先点下方「导出原始数据」保存一份；<br>' +
        '2. 把文件发给技术支持，尝试恢复；<br>' +
        '3. 在确认数据安全前，请勿清空数据或卸载浏览器。</div>',
      actions: [
        { label: '导出原始数据（抢救）', act: 'export-raw', primary: true, full: true },
        { label: '知道了', act: 'sheet-close', full: true }
      ]
    });
  } else if (migrateNotice) {
    toast(migrateNotice);
  }
}

/* ================= 初始化 ================= */
function init() {
  load();
  bind();
  /* 演示模式仅在数据可正常读取且为空时生效，避免覆盖受影响的数据 */
  if (!loadError && /[?&]demo=\d/.test(location.search) && !state.patients.length) {
    state = buildDemoState(); save();
    var dm = location.search.match(/[?&]demo=(\d)/);
    view.tab = dm ? (['todo', 'ward', 'cal', 'done'][parseInt(dm[1], 10) - 1] || 'todo') : 'todo';
  }
  render();
  showDataNotice();
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('./sw.js').catch(function () { });
  }
}
init();
</script>
</body>
