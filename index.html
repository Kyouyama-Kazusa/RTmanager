<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>放疗患者管理</title>
<!-- 发布链路验证：本次改动不含功能变更，用于确认改应用后 SW 缓存号自动递增（v13 → v14）并推送到线上。
     发布一律走 dev-tools/release.sh：它会跑完 1031 项回归 + 兼容性门禁，再递增此处的缓存号、推送并验证 Pages。 -->
<meta name="description" content="放疗科患者管理（离线使用，数据只存本机）">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="放疗管理">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{
  --bg:#f2f4f7; --card:#ffffff; --line:#e3e7ee; --text:#1b2430; --sub:#6b7686;
  --pri:#0f766e; --pri-soft:#e5f3f1; --warn:#b45309; --warn-soft:#fdf0e0;
  --danger:#c0392b; --danger-soft:#fdecea; --ok:#0f766e; --ok-soft:#e5f3f1;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--text); background:var(--bg); -webkit-text-size-adjust:100%;
  display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
.hint{color:var(--sub);font-size:13px}

.topbar{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:#fff;border-bottom:1px solid var(--line)}
.topbar h1{flex:1;margin:0;font-size:18px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{min-width:44px;height:44px;border:0;background:transparent;border-radius:10px;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn:active{background:var(--bg)}
.iconbtn[hidden]{display:none}

#view{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 28px}
.section{margin:0 0 14px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 8px;font-size:14px;color:var(--sub);font-weight:600}

.tabbar{flex:0 0 auto;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar[hidden]{display:none}
.tabbar button{flex:1;border:0;background:transparent;padding:9px 2px 7px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative}
.tabbar button .ico{font-size:19px;line-height:1}
.tabbar button.on{color:var(--pri);font-weight:600}
.tabbar .dot{position:absolute;top:4px;right:calc(50% - 24px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:600}
.tabbar .dot[hidden]{display:none}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;margin-bottom:10px}
.pcard{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.pcard:active{background:#fafbfc}
.badgebox{flex:0 0 auto;min-width:52px;padding:6px 6px;border-radius:10px;background:var(--pri-soft);color:var(--pri);text-align:center}
.badgebox .b{font-size:19px;font-weight:700;line-height:1.2;word-break:break-all}
.badgebox .t{font-size:11px;opacity:.8}
.pcard .pbody{flex:1;min-width:0}
.line1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pname{font-size:17px;font-weight:600}
.pdiag{margin-top:3px;font-size:14px;color:#39424f;word-break:break-all}
.pmeta{margin-top:4px;font-size:12px;color:var(--sub);line-height:1.6}
.pmeta b{font-weight:600;color:#4a5464}

.progress{height:8px;border-radius:4px;background:#eef1f5;overflow:hidden;margin-top:6px}
.progress .fill{height:100%;background:var(--pri);border-radius:4px}
.progress.warn .fill{background:var(--warn)}

.chip{display:inline-block;padding:1px 7px;border-radius:999px;font-size:12px;line-height:18px;background:#eef1f5;color:#4a5464;white-space:nowrap}
.chip.pri{background:var(--pri-soft);color:var(--pri)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.danger{background:var(--danger-soft);color:var(--danger)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.sm{font-size:11px;line-height:16px;padding:0 6px}
.count{display:inline-block;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--danger);color:#fff;font-size:12px;line-height:20px;text-align:center;font-weight:600}

.todocard{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.todocard:active{background:#fafbfc}
.todo-reasons{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.todo-sum{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--pri);margin-bottom:9px;padding:0 2px}
.todo-sum .ts-i{background:var(--pri-soft);border-radius:10px;padding:2px 9px;font-weight:600}
.todo-acts{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}

.kv{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv .k{flex:0 0 82px;color:var(--sub)}
.kv .v{flex:1;word-break:break-all}
.hero{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.hero .badgebox{min-width:62px}
.hero .pname{font-size:20px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.event{padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff}
.event .head{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.event .content{font-size:15px;font-weight:600;word-break:break-all}
.event .t{font-size:12px;color:var(--sub);margin-top:2px}
.event .blk{margin-top:8px;padding:8px 10px;border-radius:9px;background:#f7f9fb;font-size:14px}
/* 日期弹层：当日人数概览与分段名单 */
.day-ov{display:flex;gap:6px;margin-bottom:10px}
.day-ov .ov-i{flex:1;text-align:center;padding:8px 4px;border-radius:10px;font-size:11px;line-height:1.4}
.day-ov .ov-i b{display:block;font-size:19px;font-weight:700}
.day-ov .ov-start{background:#e3f0fd;color:#1d5fa8}
.day-ov .ov-treat{background:#e5f3f1;color:var(--pri)}
.day-ov .ov-end{background:#fde8e4;color:#b3261e}
.day-sec{margin-bottom:10px}
.day-sec-t{font-size:12px;font-weight:700;margin:10px 0 2px;padding-left:7px;border-left:3px solid var(--line)}
.day-sec-t.t-start{border-color:#1d5fa8;color:#1d5fa8}
.day-sec-t.t-end{border-color:#b3261e;color:#b3261e}
.day-sec-t.t-all{border-color:var(--pri);color:var(--pri)}
.event .blk .blk-t{font-size:12px;color:var(--sub);margin-bottom:2px}
.event .fu{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin-top:4px}
.event .fu .fut{flex:0 0 auto;font-size:12px;color:var(--sub);padding-top:1px}
.event .fu .fuc{flex:1;min-width:0;word-break:break-all}
.event .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;min-height:40px;font-size:14px;cursor:pointer}
.btn:active{background:#f4f6f9}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.primary:active{background:#0a5f58}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:#f0c9c4;background:#fff}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn.block{display:block;width:100%;text-align:center}
.btn[disabled]{opacity:.5}
.addbtn{color:var(--pri);border-color:#cfe2dc;background:var(--pri-soft)}

.empty{text-align:center;color:var(--sub);padding:44px 20px;font-size:14px}
.empty .big{font-size:34px;display:block;margin-bottom:8px;opacity:.5}

/* ---------- 日历 ---------- */
.cal-wrap{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 10px 12px;margin-bottom:10px}
.cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 2px}
.cal-top .mt{font-size:15px;font-weight:600}
.cal-nav{display:flex;gap:6px;align-items:center}
.cal-nav button{border:1px solid var(--line);background:#fff;border-radius:8px;min-width:34px;height:32px;font-size:15px;cursor:pointer;line-height:1}
.cal-nav button:active{background:#f4f6f9}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{text-align:center;font-size:11px;color:var(--sub);padding:3px 0;font-weight:600}
.cal-dow.we{color:var(--danger)}
.cal-cell{min-height:48px;border-radius:8px;background:#f7f9fb;padding:3px 4px;font-size:12px;display:flex;flex-direction:column;gap:1px;position:relative;border:1px solid transparent;overflow:hidden}
.cal-cell.out{opacity:.3}
.cal-cell.today{border-color:var(--pri);background:#fff}
.cal-cell.hol{background:#fdecea}
.cal-cell.hol .d{color:var(--danger)}
.cal-cell.mk{background:#fdf0e0}
.cal-cell .d{font-size:12px;font-weight:600;line-height:1.25}
.cal-cell .d.we{color:var(--danger)}
.cal-cell .tagline{font-size:10px;line-height:1.3;border-radius:4px;padding:1px 3px;background:var(--pri-soft);color:var(--pri);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-cell .tagline.done{opacity:.65;text-decoration:line-through}
.cal-cell .tagline.boost{background:#EEEDFE;color:#534AB7}
.cal-cell .tagline.miss{background:var(--danger-soft);color:var(--danger);text-decoration:none}
.cal-cell .tagline.extra{background:var(--warn-soft);color:var(--warn)}
.cal-cell .tagline.pause{background:#eef1f5;color:var(--sub)}
.cal-cell .cnt{font-size:10px;color:var(--pri);font-weight:700;line-height:1.3}
/* 当日人数标注：始（开始放疗）/ 终（放疗结束） */
.cal-cell .statrow{display:flex;gap:2px;flex-wrap:wrap;line-height:1.2}
.cal-cell .statrow span{font-size:9px;font-weight:700;border-radius:3px;padding:1px 3px;white-space:nowrap}
.cal-cell .statrow .b-start{background:#e3f0fd;color:#1d5fa8}
.cal-cell .statrow .b-end{background:#fde8e4;color:#b3261e}
.cal-cell .tagline.s-start{background:#e3f0fd;color:#1d5fa8;text-decoration:none}
.cal-cell .tagline.s-end{background:#fde8e4;color:#b3261e;text-decoration:none}
.cal-cell.clickable{cursor:pointer}
.cal-cell.clickable:active{background:#e9eef4}
.cal-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-top:9px;padding:0 2px}
.cal-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:middle}
.cal-wrap .month-stat{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-top:9px;padding:7px 9px;background:#f7f9fb;border-radius:8px}
.cal-wrap .month-stat .ms-i{display:inline-flex;align-items:center}
.cal-wrap .month-stat i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
.cal-wrap .month-stat i.b-start{background:#e3f0fd}
.cal-wrap .month-stat i.b-end{background:#fde8e4}
.cal-wrap .month-stat i.b-treat{background:#e5f3f1}
.cal-day-list .row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)}
.cal-day-list .row:last-child{border-bottom:0}
.cal-day-list .row .nm{flex:1;font-size:14px}
.cal-day-list .row .nm b{font-weight:600}
.cal-day-list .row .sub2{font-size:12px;color:var(--sub)}

/* ---------- 全程治疗时间轴 ---------- */
.tl{margin-top:4px}
.tl-course{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:10px 0 4px;padding:6px 8px;background:#f7f9fb;border-radius:9px}
.tl-course .tl-cname{font-size:13px;font-weight:600;flex:0 1 auto;word-break:break-all}
.tl-course .tl-cnt{font-size:11px;color:var(--sub);margin-left:auto}
.tl-course .tl-cacts{display:flex;gap:5px;flex-wrap:wrap}
.tl-course .tl-cacts .btn{padding:3px 7px;min-height:28px;font-size:12px}
.tl-gap{height:6px}
.tl-year{font-size:12px;font-weight:700;color:var(--sub);margin:8px 0 4px;padding-left:7px;border-left:3px solid var(--pri)}
.tl-item{position:relative;padding:6px 0 10px 16px;border-left:2px solid var(--line);margin-left:5px}
.tl-item::before{content:"";position:absolute;left:-6px;top:13px;width:9px;height:9px;border-radius:50%;background:var(--pri);box-shadow:0 0 0 2px #fff}
.tl-item.surgery::before{background:var(--warn)}
.tl-item.chemo::before{background:var(--danger)}
.tl-item.sub{padding-left:30px;border-left-style:dashed;opacity:.95}
.tl-item.sub::before{width:6px;height:6px;left:-4px;top:14px;background:var(--sub)}
.tl-item .tl-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tl-item .tl-date{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.tl-item .tl-body{font-size:14px;font-weight:600;word-break:break-all;margin-top:1px}
.tl-item.sub .tl-body{font-weight:400;font-size:13px;color:#4a5464}
.tl-item .tl-note{font-size:12px;color:var(--sub);margin-top:2px;word-break:break-all}
.tl-item .tl-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tl-item .tl-acts .btn{padding:4px 8px;min-height:30px;font-size:12px}
.tl-fold{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--pri);cursor:pointer;background:none;border:0;padding:2px 0;min-height:auto}
.tl-empty{color:var(--sub);font-size:13px;padding:6px 2px}

.mask{position:fixed;inset:0;background:rgba(16,24,40,.42);z-index:40;opacity:0;transition:opacity .18s}
.mask[hidden]{display:none}
.mask.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-radius:16px 16px 0 0;transform:translateY(102%);transition:transform .22s ease-out;display:flex;flex-direction:column;max-height:88vh;padding-bottom:env(safe-area-inset-bottom)}
.sheet.show{transform:translateY(0)}
.sheet .sh-bar{display:flex;align-items:center;padding:6px 8px 6px 16px;border-bottom:1px solid var(--line)}
.sheet .sh-title{flex:1;font-size:16px;font-weight:600}
.sheet .sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 8px}
.sheet .sh-foot{display:flex;gap:8px;padding:10px 16px 16px;border-top:1px solid var(--line)}
.sheet .sh-foot .btn{flex:1}
/* hidden 必须能真正隐藏：.sheet .sh-foot 的 display:flex 会覆盖 hidden 属性，
   这里显式补上，否则隐藏操作区后仍留空占位与多余按钮 */
#sheetFoot[hidden]{display:none!important}
#sheetOk[hidden],#sheetCancel[hidden]{display:none!important}
.sh-foot-inner{display:flex;gap:8px;flex-wrap:wrap}
.sh-foot-inner .btn{flex:1 1 calc(50% - 4px);min-width:0}
.sh-foot-inner .btn.full{flex:1 1 100%}

.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;background:#fff;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pri)}
.field textarea{min-height:76px;resize:vertical}
.field2{display:flex;gap:10px}
.field2 .field{flex:1}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri);font-weight:600}

.setgrp{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.setrow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.setrow:last-child{border-bottom:0}
.setrow:active{background:#fafbfc}
.setrow .n{flex:1;font-size:15px}
.setrow .sub2{font-size:12px;color:var(--sub);margin-top:2px}
.setrow .arw{color:var(--sub);font-size:18px}
.holitem{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px}
.holitem:last-child{border-bottom:0}
.holitem .dt{flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--sub);font-size:13px}
.holitem .nm{flex:1}
.holitem .x{flex:0 0 auto;border:0;background:transparent;color:var(--danger);font-size:16px;cursor:pointer;padding:4px 6px}

/* ---------- 平板 / 电脑：居中为手机宽度 ---------- */
@media (min-width:700px){
  body{max-width:560px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .mask{max-width:560px;margin-left:auto;margin-right:auto}
  .sheet{max-width:560px;margin-left:auto;margin-right:auto}
}
</style>
</head>
<body>
<header class="topbar">
  <button class="iconbtn" id="btnBack" hidden>‹</button>
  <h1 id="title">放疗患者管理</h1>
  <button class="iconbtn" id="btnData">⋯</button>
</header>
<main id="view"></main>
<nav class="tabbar" id="tabbar">
  <button data-tab="todo"><span class="ico">📌</span>待办<span class="dot" id="dotTodo" hidden></span></button>
  <button data-tab="ward"><span class="ico">🏥</span>在治<span class="dot" id="dotWard" hidden></span></button>
  <button data-tab="cal"><span class="ico">📅</span>日历</button>
  <button data-tab="done"><span class="ico">📁</span>完成</button>
</nav>
<div class="mask" id="mask" hidden></div>
<div class="sheet" id="sheet">
  <div class="sh-bar"><div class="sh-title" id="sheetTitle"></div><button class="iconbtn" id="sheetClose">✕</button></div>
  <div class="sh-body" id="sheetBody"></div>
  <div class="sh-foot" id="sheetFoot">
    <div class="sh-foot-inner" id="sheetFootInner">
      <button class="btn" id="sheetCancel">取消</button>
      <button class="btn primary" id="sheetOk">保存</button>
    </div>
  </div>
</div>
<script>
/* ================= 常量 ================= */
var LS_KEY = 'radiotherapy.v1';
var SNAP_PREFIX = 'radiotherapy.snap.';
var SNAP_KEEP = 7;
var APP_VERSION = '0.13.0';

var SEXES = ['男', '女'];
var PURPOSES = ['根治性', '术后辅助', '术前新辅助', '姑息性'];
var TECHNIQUES = ['IMRT', 'VMAT', 'SBRT', '3D-CRT', '电子线', 'TOMO', '其他'];
var PLAN_STATUSES = ['待定位', '待勾画', '待计划', '待验证', '已通过'];
/* 放疗验证提醒的提前量（次）：第 N 次验证，则从第 N-2 次治疗日起开始提醒。
   取 2 是为了给排班/机器预留准备时间，同时不至于过早刷屏。 */
var VERIFY_LEAD_FRACTIONS = 2;
/* 待办「即将结束」阈值：剩余治疗次数 ≤ 这个值就提醒 */
var TODO_NEAR_END_LEFT = 5;
var REACTION_SITES = ['皮肤反应', '口腔黏膜炎', '放射性食管炎', '放射性肺炎', '放射性肠炎', '放射性膀胱炎', '骨髓抑制', '乏力', '其他'];
var GRADES = ['1级（轻）', '2级（中）', '3级（重）', '4级（危及生命）'];
var REACTION_STATUSES = ['未处理', '已处理待复查', '已复查未解除', '已解除', '长期随访'];
var OPEN_STATUSES = ['未处理', '已处理待复查', '已复查未解除'];
var PATIENT_STATUSES = ['在治', '治疗完成', '失访'];
/* 治疗疗程类别：一个患者可先后/同时接受多种治疗，统一挂在 p.courses 下。
   放疗疗程不回填排程，只用 radioRef 回指顶层 startDate/fractions 等字段，
   保证 computeSchedule(p) 始终是放疗排程的唯一真相。 */
var COURSE_KINDS = ['surgery', 'chemo', 'radio'];
var COURSE_KIND_LABELS = { surgery: '手术', chemo: '化疗', radio: '放疗' };
var COURSE_KIND_CHIPS = { surgery: 'warn', chemo: 'danger', radio: 'pri' };
/* 历史版本状态映射（v0.1 → 当前）：避免更新应用后患者的旧状态被静默改写
   v0.1 的「暂停」在新版由 pauses 中断区间表达（状态回到「在治」+ 续存中断记录）；
   v0.1 的「随访中」在新版由「治疗完成」+ 随访计划表达。 */
var LEGACY_STATUS_MAP = { '暂停': '在治', '随访中': '治疗完成' };
/* 当前数据格式版本。LS_KEY 与 SCHEMA_VERSION 一旦发布就不能再改，
   否则老用户的数据将读不出来（浏览器按 key 存储）。 */
var SCHEMA_VERSION = 2;
var WEEKDAYS = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
var WD_ORDER = [1, 2, 3, 4, 5, 6, 0];
var DEFAULT_TREAT_DAYS = [1, 2, 3, 4, 5];

/* ================= 内置法定节假日数据 =================
   来源：国务院办公厅历年《关于部分节假日安排的通知》
   只作为「内置层」，用户可在设置中增删（存入独立覆盖层，升级不会丢失）。
   未内置的年份（如 2027 年及以后，国务院通常于前一年 11 月公布）
   会自动降级为「周一~周五为工作日、周末休息」排程。            */
var BUILTIN_HOLIDAYS = (function () {
  var o = {};
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function one(y, m, d, n) { o[y + '-' + p2(m) + '-' + p2(d)] = n; }
  function span(y, m, a, b, n) { for (var d = a; d <= b; d++) one(y, m, d, n); }

  /* —— 2025 年（国办发明电〔2024〕12号）—— */
  one(2025, 1, 1, '元旦');
  span(2025, 1, 28, 31, '春节'); span(2025, 2, 1, 4, '春节');
  span(2025, 4, 4, 6, '清明');
  span(2025, 5, 1, 5, '劳动节');
  one(2025, 5, 31, '端午'); span(2025, 6, 1, 2, '端午');
  span(2025, 10, 1, 8, '国庆中秋');

  /* —— 2026 年（国办发明电〔2025〕x号）—— */
  span(2026, 1, 1, 3, '元旦');
  span(2026, 2, 15, 23, '春节');
  span(2026, 4, 4, 6, '清明');
  span(2026, 5, 1, 5, '劳动节');
  span(2026, 6, 19, 21, '端午');
  span(2026, 9, 25, 27, '中秋');
  span(2026, 10, 1, 7, '国庆');
  return o;
})();

/* 调休上班的周末（按工作日治疗，可在设置中关闭或增删） */
var BUILTIN_MAKEUPS = (function () {
  var o = {};
  function one(y, m, d, n) { o[y + '-' + (m < 10 ? '0' : '') + m + '-' + (d < 10 ? '0' : '') + d] = n; }
  /* 2025 */
  one(2025, 1, 26, '春节调休'); one(2025, 2, 8, '春节调休');
  one(2025, 4, 27, '劳动节调休');
  one(2025, 9, 28, '国庆调休'); one(2025, 10, 11, '国庆调休');
  /* 2026 */
  one(2026, 1, 4, '元旦调休'); one(2026, 2, 14, '春节调休'); one(2026, 2, 28, '春节调休');
  one(2026, 5, 9, '劳动节调休'); one(2026, 9, 20, '国庆调休'); one(2026, 10, 10, '国庆调休');
  return o;
})();

/* 内置数据覆盖的年份 */
var BUILTIN_YEARS = (function () {
  var s = {};
  Object.keys(BUILTIN_HOLIDAYS).forEach(function (d) { s[d.slice(0, 4)] = 1; });
  return Object.keys(s).sort();
})();

/* ================= 基础工具 ================= */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function uid(p) { return p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }
function pad2(n) { n = parseInt(n, 10); return (n < 10 ? '0' : '') + n; }
function dstr(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayStr() { return dstr(new Date()); }
function nowLocalInput() { var d = new Date(); return dstr(d) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function fmtDT(s) { return s ? String(s).replace('T', ' ') : ''; }
function dateOnly(s) { return String(s || '').slice(0, 10); }
function parseD(s) { var d = new Date(String(s).slice(0, 10) + 'T00:00:00'); return isNaN(d.getTime()) ? null : d; }
function daysBetween(from, to) { var a = parseD(from), b = parseD(to); if (!a || !b) return 0; return Math.round((b - a) / 86400000); }
function addDays(s, n) { var d = parseD(s); if (!d) return s; d.setDate(d.getDate() + n); return dstr(d); }
function isOpen(r) { return OPEN_STATUSES.indexOf(r.status) >= 0; }
function mdLabel(s) { return String(s || '').slice(5).replace('-', '/'); }

/* ================= 数据读写 =================
   数据安全三道保护：
   1) 迁移前自动留一份原始数据（万一格式转换有问题可回退）
   2) 读不出来时「禁止保存」，避免空数据覆盖掉历史记录
   3) 归一化过程容错，单个患者字段异常不影响其他患者          */
var state = emptyState();
var loadError = false;      /* 数据读取失败（不可解析）→ 禁止写入 */
var rawSnapshot = null;     /* 读取失败时保留的原始文本，供抢救导出 */
var settingsDirtyAt = '';   /* 设置层（节假日/调休/模板/治疗日）最近一次改动时间 */
var migrateNotice = '';     /* 迁移提示文案 */

var BACKUP_PREFIX = 'radiotherapy.backup.';
var BACKUP_KEEP = 3;

/* 云同步（加密后存到 GitHub Gist）
   - 配置只存本机（radiotherapy.sync），Token 与密码都不上传
   - 云端只存密文：PBKDF2-SHA256 派生密钥 + AES-GCM-256 加密
   - 读写一律走 api.github.com，且禁用缓存（Gist API 带 max-age=60，
     否则「刚上传完立刻拉取」会读到旧数据） */
var SYNC_KEY = 'radiotherapy.sync';
var SYNC_FILE = 'rt-sync.json.enc';
var SYNC_ITER = 250000;
var SYNC_API = 'https://api.github.com';

/* 定时自动同步（仅本机 → 云端备份，不做自动拉取）
   为什么不用 setInterval：本应用是装到手机桌面的离线 PWA，切到后台后 JS 定时器
   会被系统挂起甚至销毁，设 1 小时也可能永远不触发（iOS 尤其严格）。
   Service Worker 的 Periodic Background Sync 只有 Chromium 支持，iOS 完全没有，
   且最短间隔不受应用控制。
   因此改为「按时间间隔判定 + 在页面生命周期节点触发」：不用任何定时器，在
   用户回到应用 / 网络恢复 / 数据变更后 / 离开页面前检查「距上次是否已超过间隔」。
   数据只可能在用户使用应用时产生，故效果与真正定时几乎等价，且 100% 可靠。 */
var AUTO_SYNC_DEFAULT_MIN = 60;            /* 默认间隔：1 小时 */
var AUTO_SYNC_OPTIONS = [30, 60, 120, 360, 720, 1440];   /* 可选间隔（分钟） */
var AUTO_SYNC_DEBOUNCE_MS = 20000;         /* 数据变更后的去抖延时：20 秒 */
var autoSyncTimer = null;                  /* 去抖用的 setTimeout 句柄 */
var autoSyncBusy = false;                  /* 并发去重：同一时刻只允许一次自动上传 */

function emptyState() { return { version: SCHEMA_VERSION, updatedAt: '', patients: [] }; }

function load() {
  /* 每次读取都重置标记与状态，避免上一次的结果残留 */
  loadError = false;
  rawSnapshot = null;
  migrateNotice = '';
  state = emptyState();

  var raw = null;
  try { raw = localStorage.getItem(LS_KEY); }
  catch (e) { loadError = true; return; }

  if (!raw) return;                       /* 首次使用，无数据属正常 */

  var d = null;
  try { d = JSON.parse(raw); }
  catch (e) {                             /* 内容损坏：保留原文，禁止写入 */
    console.warn('数据解析失败', e);
    loadError = true; rawSnapshot = raw;
    return;
  }
  if (!d || !Array.isArray(d.patients)) { /* 结构异常：同样保护 */
    loadError = true; rawSnapshot = raw;
    return;
  }

  /* 迁移前自动备份原始数据 */
  var fromV = parseInt(d.version, 10) || 1;
  if (fromV < SCHEMA_VERSION) {
    try {
      var bk = BACKUP_PREFIX + 'v' + fromV + '.' + todayStr();
      if (!localStorage.getItem(bk)) localStorage.setItem(bk, raw);
      backupKeysToDelete(BACKUP_KEEP).forEach(function (k) { localStorage.removeItem(k); });
      migrateNotice = '已自动备份更新前的数据（原始格式 v' + fromV + '）';
    } catch (e) { }
  }

  try { state = normalize(d); }
  catch (e) {                             /* 归一化意外失败 → 保护原始数据 */
    console.warn('数据归一化失败', e);
    loadError = true; rawSnapshot = raw;
    state = emptyState();
  }
}

/* 备份键：按时间升序。保留策略需要"删最旧、留最新"，见 BUG-11 */
function backupKeys() {
  var ks = [];
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf(BACKUP_PREFIX) === 0) ks.push(k);
    }
  } catch (e) { }
  return ks.sort();
}
/* 保留最新的 n 份，返回应删除的键（升序中前面的即最旧） */
function backupKeysToDelete(n) {
  return backupKeys().slice(0, -n);
}

/* 归一化辅助：把来源对象里「目标尚未包含」的字段一并带上。
   目的：以后新增字段时，normalize 只需声明需要转换/校验的字段，
   其余字段自动保留，避免"新字段被静默丢弃"（如 BUG-03 的 tplBase）。 */
function keepExtra(src, out) {
  if (!src || typeof src !== 'object') return out;
  Object.keys(src).forEach(function (k) {
    if (!(k in out) && src[k] !== undefined) out[k] = src[k];
  });
  return out;
}

/* 把任意历史版本的数据归一化为当前格式。
   原则：只做「补齐」，不丢弃任何已有内容。 */
function normalize(d) {
  var out = { version: SCHEMA_VERSION, updatedAt: d.updatedAt || '', patients: [] };
  (d.patients || []).forEach(function (p) {
    if (!p || typeof p !== 'object') return;      /* 跳过异常条目，不影响其余患者 */

    /* 旧字段 plannedStartDate 迁移为 startDate；旧 sessions 并入 doneDates */
    var start = p.startDate || p.plannedStartDate || '';
    var done = (p.doneDates || []).slice();
    (p.sessions || []).forEach(function (s) {
      var ds = dateOnly(s && s.date);
      if (ds && done.indexOf(ds) < 0) done.push(ds);
    });

    /* 状态：当前值直接用；旧版本值按映射表转换；不认识的值退回「在治」 */
    var st = PATIENT_STATUSES.indexOf(p.status) >= 0 ? p.status
      : (LEGACY_STATUS_MAP[p.status] || '在治');

    out.patients.push(keepExtra(p, {
      id: p.id || uid('p'), mrn: p.mrn || '', name: p.name || '', sex: SEXES.indexOf(p.sex) >= 0 ? p.sex : '', age: p.age || '',
      physician: p.physician || '', diagnosis: p.diagnosis || '', purpose: PURPOSES.indexOf(p.purpose) >= 0 ? p.purpose : '',
      technique: TECHNIQUES.indexOf(p.technique) >= 0 ? p.technique : '',
      simDate: p.simDate || '', position: p.position || '', planStatus: PLAN_STATUSES.indexOf(p.planStatus) >= 0 ? p.planStatus : '',
      totalDose: p.totalDose || '', fractions: p.fractions || '', dosePerFraction: p.dosePerFraction || '',
      startDate: start,
      treatDays: (p.treatDays && p.treatDays.length) ? p.treatDays : treatDaysCfg(),
      pauses: (p.pauses || []).map(function (x) { return keepExtra(x, { id: x.id || uid('pa'), from: x.from || '', to: x.to || '', reason: x.reason || '' }); }),
      extras: (p.extras || []).map(function (x) { return keepExtra(x, { id: x.id || uid('ex'), date: x.date || '', reason: x.reason || '' }); }),
      /* 计划调整：加量（原计划结束后追加）与提前终止（排程截止日） */
      boostFractions: p.boostFractions == null ? '' : String(p.boostFractions),
      boostNote: p.boostNote || '',
      stopDate: p.stopDate || '',
      /* 疗程中验证：fractions 存原始输入串（保留用户写法），查询走 parseVerifyNums */
      verifyAt: keepExtra(p.verifyAt || {}, {
        fractions: (p.verifyAt && p.verifyAt.fractions != null) ? String(p.verifyAt.fractions) : '',
        note: (p.verifyAt && p.verifyAt.note) || '',
        done: ((p.verifyAt && p.verifyAt.done) || []).map(function (x) { return String(x); })
      }),
      doneDates: done,
      reactions: (p.reactions || []).map(function (r) {
        return keepExtra(r, {
          id: r.id || uid('r'), site: REACTION_SITES.indexOf(r.site) >= 0 ? r.site : (r.site || '其他'), grade: GRADES.indexOf(r.grade) >= 0 ? r.grade : (r.grade || ''),
          foundAt: r.foundAt || '', content: r.content || '', plan: r.plan || '', planAt: r.planAt || '',
          status: REACTION_STATUSES.indexOf(r.status) >= 0 ? r.status : '未处理', nextCheckAt: r.nextCheckAt || '',
          followups: (r.followups || []).map(function (f) { return keepExtra(f, { id: f.id || uid('f'), at: f.at || '', content: f.content || '' }); }),
          closedAt: r.closedAt || '', readAt: r.readAt || ''
        });
      }),
      followupPlans: (p.followupPlans || []).map(function (f) {
        /* 旧版随访只存 dueDate；这里按「治疗完成日 → 到期日」反推间隔，迁移到新结构 */
        var base = f.baseDate || p.completedAt || '';
        var n = f.offsetN, u = f.offsetUnit;
        if (!n || !u) {
          var inf = inferInterval(base, f.dueDate);
          if (inf) { n = inf.n; u = inf.u; }
          else { n = 0; u = 'm'; }
        }
        var o = keepExtra(f, {
          id: f.id || uid('fp'), baseDate: base, offsetN: n, offsetUnit: u,
          dueDate: f.dueDate || '', note: f.note || '', done: !!f.done, doneAt: f.doneAt || ''
        });
        return o;
      }),
      notes: (p.notes || []).map(function (n) { return keepExtra(n, { id: n.id || uid('n'), at: n.at || '', content: n.content || '' }); }),
      /* 治疗疗程（手术 / 化疗 / 放疗）——全程治疗时间轴的数据源。
         三层都走 keepExtra：未来给某层加字段时，旧数据不会静默丢失。
         注意：这里绝不复制放疗排程，放疗疗程只用 radioRef 回指顶层字段。 */
      courses: (p.courses || []).map(function (c) {
        return keepExtra(c, {
          id: c.id || uid('co'),
          kind: COURSE_KINDS.indexOf(c.kind) >= 0 ? c.kind : 'chemo',
          title: c.title || '', site: c.site || '', date: c.date || '',
          startDate: c.startDate || '', endDate: c.endDate || '',
          regimen: c.regimen || '', radioRef: !!c.radioRef,
          note: c.note || '', createdVia: c.createdVia || 'manual',
          cycles: (c.cycles || []).map(function (cy) {
            return keepExtra(cy, {
              id: cy.id || uid('cy'), n: parseInt(cy.n, 10) || 1,
              startDate: cy.startDate || '', endDate: cy.endDate || '', note: cy.note || '',
              doses: (cy.doses || []).map(function (d) {
                return keepExtra(d, {
                  id: d.id || uid('d'), date: d.date || '', drug: d.drug || '',
                  dose: (d.dose == null ? '' : String(d.dose)), unit: d.unit || '', note: d.note || ''
                });
              })
            });
          })
        });
      }),
      status: st, completedAt: p.completedAt || ''
    }));
  });
  return out;
}

function save() {
  /* 读取失败时禁止写入：否则会把空数据覆盖到原有记录上 */
  if (loadError) {
    alert('为保护原有数据，本次未保存。\n\n上次打开时未能读取本机数据，原数据仍完整保留在本机。\n请先用「⋯ → 导出原始数据（抢救）」保存一份，再联系我们处理。');
    return false;
  }
  state.updatedAt = new Date().toISOString();
  var saved = false;
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); saved = true; }
  catch (e) { alert('保存失败：手机存储空间可能已满，请先导出备份并清理旧数据。'); return false; }
  /* 数据已变更 → 安排一次自动同步（去抖，见 autoSyncSchedule）。
     放在 save() 这个唯一收口点，就不必改 36 个调用点。 */
  if (saved) autoSyncSchedule();
  return saved;
}

/* 设置（节假日/调休/模板/默认治疗日）存在独立键里，不走 save()。
   但它们同样决定排程结果，必须一并纳入自动同步的「有变更」判定，
   否则改了调休却不上传，另一台设备会算出不同的结束日期。 */
function saveSettings() {
  settingsDirtyAt = new Date().toISOString();   /* 供 autoSyncDataChanged 比对 */
  return true;
}

/* 抢救导出：把读不出来的原始文本原样存成文件，便于人工恢复 */
function exportRawData() {
  var raw = rawSnapshot;
  if (!raw) { try { raw = localStorage.getItem(LS_KEY); } catch (e) { } }
  if (!raw) { toast('没有可导出的数据'); return; }
  downloadBlob(new Blob([raw], { type: 'application/json' }), '放疗原始数据_抢救_' + todayStr() + '.json');
  toast('已导出原始数据');
}

function snapKeys() {
  var ks = [];
  for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf(SNAP_PREFIX) === 0) ks.push(k); }
  return ks.sort().reverse();
}
function maybeSnapshot() {
  try {
    var k = SNAP_PREFIX + todayStr();
    if (localStorage.getItem(k)) return;
    if (!state.patients.length) return;
    localStorage.setItem(k, JSON.stringify(state));
    snapKeys().slice(SNAP_KEEP).forEach(function (old) { localStorage.removeItem(old); });
  } catch (e) { }
}

/* ================= 全局配置（治疗日 / 节假日） ================= */
function lsGet(k, def) { try { var v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }

function treatDaysCfg() {
  var v = lsGet('radiotherapy.treatDays', null);
  return (v && v.length) ? v : DEFAULT_TREAT_DAYS.slice();
}
function setTreatDaysCfg(days) { lsSet('radiotherapy.treatDays', days); saveSettings(); }

/* 用户覆盖层：{date:'名称'} = 新增或覆盖；{date:null} = 删除内置项。
   与内置层分离，内置数据升级后用户的增删依然保留。 */
function mergeLayer(base, ov) {
  var out = {};
  Object.keys(base).forEach(function (k) { out[k] = base[k]; });
  Object.keys(ov || {}).forEach(function (k) { if (ov[k] === null) delete out[k]; else out[k] = ov[k]; });
  return out;
}
function holidayOverride() { var v = lsGet('radiotherapy.holidays', null); return (v && typeof v === 'object') ? v : {}; }
function makeupOverride() { var v = lsGet('radiotherapy.makeups', null); return (v && typeof v === 'object') ? v : {}; }
function holidays() { return mergeLayer(BUILTIN_HOLIDAYS, holidayOverride()); }
function makeups() { return mergeLayer(BUILTIN_MAKEUPS, makeupOverride()); }
function setHoliday(date, name) { var o = holidayOverride(); o[date] = name; lsSet('radiotherapy.holidays', o); saveSettings(); }
function delHoliday(date) { var o = holidayOverride(); o[date] = null; lsSet('radiotherapy.holidays', o); saveSettings(); }
function setMakeup(date, name) { var o = makeupOverride(); o[date] = name; lsSet('radiotherapy.makeups', o); saveSettings(); }
function delMakeup(date) { var o = makeupOverride(); o[date] = null; lsSet('radiotherapy.makeups', o); saveSettings(); }function isBuiltinHol(date) { return Object.prototype.hasOwnProperty.call(BUILTIN_HOLIDAYS, date); }
function isBuiltinMk(date) { return Object.prototype.hasOwnProperty.call(BUILTIN_MAKEUPS, date); }

/* 已录入节假日数据的年份（内置年份 + 用户新增年份；删除个别日期不影响年份判断） */
function coveredYears() {
  var s = {};
  BUILTIN_YEARS.forEach(function (y) { s[y] = 1; });
  var ov = holidayOverride();

/* 图片压缩：手机原图动辄数 MB，压到最长边 1600px 再转 base64，避免请求过大 */
function compressImage(file, cb) {
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      var maxSide = 1600;
      var scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      var w = Math.max(1, Math.round(img.width * scale));
      var h = Math.max(1, Math.round(img.height * scale));
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      try { cb(c.toDataURL('image/jpeg', 0.82)); }
      catch (e) { cb(reader.result); }
    };
    img.onerror = function () { cb(null); };
    img.src = reader.result;
  };
  reader.onerror = function () { cb(null); };
  reader.readAsDataURL(file);
}

/* 从模型输出里稳妥地取出 JSON（可能被 markdown 包裹或带前后话术） */
function extractJson(s) {
  if (!s) return null;
  var t = String(s).trim();
  t = t.replace(/^```(?:json)?\s*/i, '').replace(/\s*```\s*$/, '');
  try { return JSON.parse(t); } catch (e) { }
  var i = t.indexOf('{'), j = t.lastIndexOf('}');
  if (i >= 0 && j > i) { try { return JSON.parse(t.slice(i, j + 1)); } catch (e) { } }
  return null;
}

/* 调用大模型。content 为字符串或（含图片时的）内容块数组 */
function aiChat(cfg, userContent, opts) {
  opts = opts || {};
  var body = {
    model: opts.model || cfg.model,
    messages: [
      { role: 'system', content: cfg.prompt || defaultAiPrompt() },
      { role: 'user', content: userContent }
    ],
    temperature: 0.1,
    max_tokens: opts.maxTokens || 4000
  };
  var headers = { 'Content-Type': 'application/json' };
  if (cfg.apiKey) headers['Authorization'] = 'Bearer ' + cfg.apiKey;

  var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, opts.timeout || 120000);

  return fetch(cfg.baseUrl, {
    method: 'POST',
    headers: headers,
    body: JSON.stringify(body),
    signal: ctrl ? ctrl.signal : undefined
  }).then(function (r) {
    return r.text().then(function (txt) {
      clearTimeout(timer);
      if (!r.ok) {
        var msg = 'HTTP ' + r.status;
        try { var e = JSON.parse(txt); msg += ' ' + ((e.error && (e.error.message || e.error.code)) || txt.slice(0, 200)); }
        catch (err) { msg += ' ' + txt.slice(0, 200); }
        throw new Error(msg);
      }
      var j = null;
      try { j = JSON.parse(txt); } catch (e) { throw new Error('返回内容不是合法 JSON：' + txt.slice(0, 200)); }
      var content = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
      if (content == null) throw new Error('返回结构异常：' + txt.slice(0, 200));
      return content;
    });
  }).catch(function (err) {
    clearTimeout(timer);
    if (err && (err.name === 'AbortError')) throw new Error('请求超时（' + Math.round((opts.timeout || 120000) / 1000) + ' 秒），可稍后重试或换更快的模型');
    if (err && /Failed to fetch|NetworkError|Load failed/i.test(String(err.message))) {
      throw new Error('网络请求失败。可能原因：①手机网络不通 ②该服务商不允许浏览器直连（CORS）③地址填错');
    }
    throw err;
  });
}

/* 把 AI 返回的说法映射到表单枚举；无法可靠判断时返回空串，交人工选择 */
function matchEnum(v, options, aliasKey) {
  if (v == null) return '';
  var s = String(v).trim();
  if (!s) return '';
  if (options.indexOf(s) >= 0) return s;
  var al = AI_ENUM_ALIAS[aliasKey] || {};
  /* 长键优先，避免「容积旋转调强」被「调强」抢先匹配 */
  var keys = Object.keys(al).sort(function (a, b) { return b.length - a.length; });
  var sl = s.toLowerCase();
  for (var i = 0; i < keys.length; i++) {
    if (sl === keys[i].toLowerCase() || s.indexOf(keys[i]) >= 0) return al[keys[i]];
  }
  for (var j = 0; j < options.length; j++) {
    if (s.indexOf(options[j]) >= 0) return options[j];
  }
  return '';
}

/* ============ 随访模板：内置层 + 用户覆盖层 ============
   与节假日同一套思路：内置模板随版本升级，用户的自定义增删存在独立层，
   升级不会丢失。{ 名称: {items:[...]} } 为新增/覆盖；{ 名称: null } 为删除内置项。 */
function tplOverride() { var v = lsGet('radiotherapy.tpls', null); return (v && typeof v === 'object') ? v : {}; }

/* 当前可用模板列表：[{name, items, builtin}]，按「内置在前、自定义在后」排列 */
function followupTemplates() {
  var ov = tplOverride();
  var out = [];
  FOLLOWUP_TEMPLATES.forEach(function (t) {
    if (ov[t.name] === null) return;                       /* 被用户删除 */
    var o = ov[t.name];
    out.push({ name: t.name, items: (o && o.items) ? o.items : t.items, builtin: true });
  });
  Object.keys(ov).forEach(function (n) {
    var o = ov[n];
    if (o === null || !o || !o.items) return;
    if (!isBuiltinTpl(n)) out.push({ name: n, items: o.items, builtin: false });
  });
  return out;
}
function isBuiltinTpl(name) {
  return FOLLOWUP_TEMPLATES.some(function (t) { return t.name === name; });
}
function findTpl(name) {
  var l = followupTemplates();
  for (var i = 0; i < l.length; i++) if (l[i].name === name) return l[i];
  return null;
}
/* 保存/覆盖一个模板 */
function saveTpl(name, items) {

  var clean = (items || []).filter(function (x) { return parseInt(x.n, 10) > 0; })
    .map(function (x) { return { n: parseInt(x.n, 10), u: x.u || 'm', note: x.note || '' }; });
  if (!clean.length) return false;
  var o = tplOverride();
  o[name] = { items: clean };
  lsSet('radiotherapy.tpls', o);
  saveSettings();
  return true;
}
function delTpl(name) { var o = tplOverride(); o[name] = null; lsSet('radiotherapy.tpls', o); saveSettings(); }

/* ================= 设置层：跨设备同步用 =================
   以下设置都存在**独立的 localStorage 键**里（不在 state 内）：
     radiotherapy.holidays / .makeups / .makeupWorkday / .treatDays / .tpls
   它们决定排程结果，若两台设备不一致，同一患者会算出不同的结束日期 ——
   所以必须随云同步一起走。

   合并策略（用户 2026-10-07 确认）：
     - 取并集，不覆盖本机已有的（与本应用「合并导入不丢数据」的一贯口径一致）
     - **删除也算变更**：这些覆盖层用 null 表示「删除内置项」，
       null 必须被同等对待并参与合并，否则本机删掉的节日会在下次拉取时「复活」
     - 标量（makeupWorkday / treatDays）：本机已设则保留本机，未设则取云端 */

var SETTINGS_KEYS = {
  holidays: 'radiotherapy.holidays',
  makeups: 'radiotherapy.makeups',
  tpls: 'radiotherapy.tpls',
  makeupWorkday: 'radiotherapy.makeupWorkday',
  treatDays: 'radiotherapy.treatDays'
};

/* 导出当前设置（供 syncPayload 使用）。
   localStorage 里没有的键**不写入**，避免把「本机未设」当成「本机设为空」，
   否则拉取时会误判成「本机显式置空」而覆盖云端。 */
function exportSettings() {
  var out = {};
  Object.keys(SETTINGS_KEYS).forEach(function (name) {
    var raw = lsGet(SETTINGS_KEYS[name], undefined);
    if (raw === undefined) return;
    out[name] = raw;
  });
  return out;
}

/* 合并两层覆盖（节假日 / 调休 / 模板）。

   这里要同时满足两条**互相拉扯**的规则，不能简单地「谁优先」了事：

   ① 不覆盖本机已有的内容 —— 本机把某天设成 A，云端设成 B，保留 A。
      否则「从云端拉取」会把本机刚录的节日改掉。
   ② 删除也要能同步 —— 覆盖层用 null 表示「删除」。云端删掉某天后，
      本机必须跟着删，否则两台设备会各算各的排程（本功能存在的意义）。

   两条合起来只有一种自洽解法：
     具体值（非 null）只在云端有具体值时才新增；
     任一方是 null（明确删除）就取 null —— 删除的优先级高于「不覆盖」。
   因为你「本机设了 A」表达的只是「那天是假期 A」，而 null 表达的是
   「那天不该是假期」这种**否定性事实**，两者冲突时否定必须先落地。

  var ro = (remoteOv && typeof remoteOv === 'object') ? remoteOv : {};
  var keys = {};
  Object.keys(ro).forEach(function (k) { keys[k] = 1; });
  Object.keys(lo).forEach(function (k) { keys[k] = 1; });
  Object.keys(keys).forEach(function (k) {
    var hasL = Object.prototype.hasOwnProperty.call(lo, k);
    var hasR = Object.prototype.hasOwnProperty.call(ro, k);
    var lv = hasL ? lo[k] : undefined;
    var rv = hasR ? ro[k] : undefined;
    if (lv === null || rv === null) { out[k] = null; return; }      /* ② 删除优先 */
    if (hasL) { out[k] = lv; return; }                              /* ① 本机已有 → 保留 */
    out[k] = rv;                                                    /* 本机没有 → 取云端 */

function mergeOverride(localOv, remoteOv) {
  return installOverride(localOv, remoteOv);
}

/* 把云端设置并入本机，返回变更摘要 {changed, details:[...]}。
   只写真正有变化的键，避免无谓的写盘与快照。 */
function importSettings(remote, apply) {
  var details = [], changed = 0;
  if (!remote || typeof remote !== 'object') return { changed: 0, details: [] };

  ['holidays', 'makeups', 'tpls'].forEach(function (name) {
    if (!(name in remote)) return;
    var localOv = lsGet(SETTINGS_KEYS[name], null);
    var merged = mergeOverride(localOv, remote[name]);
    if (JSON.stringify(merged) !== JSON.stringify(localOv || {})) {
      changed++;
      details.push(name);
      if (apply) { lsSet(SETTINGS_KEYS[name], merged); saveSettings(); }
    }
  });

  /* 标量：本机已有明确取值就不动；本机没有才采纳云端 */
  ['makeupWorkday', 'treatDays'].forEach(function (name) {
    if (!(name in remote)) return;
    var cur = lsGet(SETTINGS_KEYS[name], null);
    var hasLocal = (cur !== null && cur !== undefined);
    if (!hasLocal) {
      changed++;
      details.push(name);
      if (apply) { lsSet(SETTINGS_KEYS[name], remote[name]); saveSettings(); }
    }
  });

  return { changed: changed, details: details };

/* 统计本机自定义设置条数（用于同步界面展示「云端还带了哪些设置」） */

/* ================= 放疗验证（可选的疗程中验证） =================

/* ================= 日历：当日人数统计 =================
   在日历上标注每天的三类人数，点击可看名单：
     treating 治疗中 —— 当天排了治疗的患者（与总日历原有「N 人」同一口径）
     starting 开始放疗 —— 排程第一天落在当天
     ending   今日结束 —— 排程最后一天落在当天

   关键：ending 必须能被看到。患者疗程结束当天往往已归档为「治疗完成」，
   就不在 inTreat() 里了 —— 若只扫在治患者，「今日结束」永远是 0，功能形同虚设。
   所以统计范围放宽为「在治 + 近期结束的归档」，并以**排程日期**判定首末日，

/* 归档患者纳入统计的窗口（天）：只回看，避免扫全量历史。

function calStatScope() {
  var today = todayStr();
  var out = [];
  state.patients.forEach(function (p) {

    /* 归档患者：只有排程末日落在「过去 90 天 ~ 未来」才纳入。

    var end = scheduleEnd(p);
    if (!end) return;

  calStatScope().forEach(function (p) {

    if (!sched.length) return;                    /* 无排程不计入任何一类 */
    var hasTreat = false, i;
    for (i = 0; i < sched.length; i++) if (sched[i].date === date) { hasTreat = true; break; }
    if (hasTreat) treating.push({ p: p, it: sched[i] });
    if (sched[0].date === date) starting.push({ p: p, it: sched[0] });

function dayStatHas(s) {
  return !!(s && (s.treating.length || s.starting.length || s.ending.length));
}

/* 日历格子里的标注（紧凑两行，小屏不撑破） */
function calStatBadges(s) {
  if (!dayStatHas(s)) return '';
  var h = '';
  if (s.treating.length) h += '<div class="cnt">治疗 ' + s.treating.length + '</div>';
  var tail = '';
  if (s.starting.length) tail += '<span class="b-start">始 ' + s.starting.length + '</span>';
  if (s.ending.length) tail += '<span class="b-end">终 ' + s.ending.length + '</span>';
  if (tail) h += '<div class="statrow">' + tail + '</div>';

/* 某月的全部日期字符串（用于补齐「只有开始/结束、没有治疗」的格子） */
function monthDays(y, m) {

}

function calMonthStat(y, m) {

/* ================= 自动排程引擎 =================

/* 全程治疗时间轴：把 手术节点 / 化疗周期(含给药) / 放疗逐次 三类事件合并排序。

/* 时间轴是否真的存在可展示内容（纯放疗但未填 startDate 的患者应为空） */

/* 提前终止了多少次未做（原计划 − 实际排出的次数） */
function stoppedShortOf(p) {

/* 某日是否已完成：按日期推算（计划日期 ≤ 今天），不再依赖手工标记 */

}
function todayItems(p) { var it = scheduleOn(p, todayStr()); return it || null; }

/* ================= 患者查询 ================= */
function isActive(p) { return p.status === '在治'; }
function inTreat() { return state.patients.filter(isActive); }
function completed() { return state.patients.filter(function (p) { return p.status !== '在治'; }); }
function getPatient(id) { for (var i = 0; i < state.patients.length; i++) if (state.patients[i].id === id) return state.patients[i]; return null; }
function openReactions(p) { return (p.reactions || []).filter(isOpen).sort(function (a, b) { return String(b.foundAt).localeCompare(String(a.foundAt)); }); }
function unreadReactions(p) { return openReactions(p).filter(function (r) { return !r.readAt; }); }
function inPause(p, date) { return (p.pauses || []).some(function (x) { return x.from && x.to && date >= dateOnly(x.from) && date <= dateOnly(x.to); }); }

/* 已完成治疗并需要随访的患者（「失访」不再纳入，见 BUG-05） */
function followedUp() { return state.patients.filter(function (p) { return p.status === '治疗完成'; }); }

/* ================= 待办计算 ================= */
function buildTodo() {
  var today = todayStr(), items = [];
  var targets = inTreat().slice();
  followedUp().forEach(function (p) {
    /* 用 realFollowups 排除 TEMPLATE 影子行，否则随访全部完成后仍会残留（BUG-01） */
    if (hasDueFollowup(p, today)) targets.push(p);

  targets.forEach(function (p) {
    var reasons = [], details = [], tags = [];
    if (p.status === '在治') {
      /* 待办只关注三类疗程节点（用户 2026-10-07 明确）：
           ① 还未开始（含待排程 —— 连开始日期/总次数都没填）
           ② 即将结束（剩余 ≤ TODO_NEAR_END_LEFT 次）
           ③ 疗程中验证到点
         以及始终保留的副反应、随访到期。
         「今日应治疗」「流程未通过」「疗程已结束待归档」不再进待办 —— 它们
         在在治页与详情页已经可见，塞进待办只会淹没真正要处理的事。 */
      var ready = !!(p.startDate && parseInt(p.fractions, 10));
      if (!ready) {
        if (p.planStatus && p.planStatus !== '已通过') { reasons.push('流程：' + p.planStatus); details.push('治疗流程卡在「' + p.planStatus + '」'); tags.push('未开始'); }
        else { reasons.push('待排程'); details.push('请填写放疗开始日期与总次数，自动生成治疗日历'); tags.push('未开始'); }
      } else {
        var dn = doneCount(p);
        var plannedN = plannedCount(p);
        var end = scheduleEnd(p);
        var left = Math.max(0, plannedN - dn);
        var sched = computeSchedule(p);
        var startD = sched.length ? sched[0].date : (p.startDate || '');
        /* ① 还未开始：今天早于首个治疗日 */
        if (startD && startD > today) {
          reasons.push('还未开始'); details.push('放疗自 ' + dateOnly(startD) + ' 起（' + WEEKDAYS[parseD(startD).getDay()] + '），距今 ' + daysBetween(today, startD) + ' 天');
          tags.push('未开始');
        }
        /* ② 即将结束：剩余 ≤ 阈值 */
        if (left > 0 && left <= TODO_NEAR_END_LEFT) {
          reasons.push('即将结束'); details.push('还剩 ' + left + ' 次（已完成 ' + dn + '/' + plannedN + '），预计 ' + (end ? dateOnly(end) : '—') + ' 结束');
          tags.push('即将结束');
        }
        /* ③ 疗程中验证到点（提前 VERIFY_LEAD_FRACTIONS 次进入提醒） */
        var vp = verifyPending(p);
        if (vp) {

          var when = vp.status === 'due' ? '本次就该验证' : '还有 ' + Math.max(0, vp.n - dn) + ' 次治疗';
          reasons.push('验证：第 ' + vp.n + ' 次');
          details.push('计划在第 ' + vp.n + ' 次治疗时验证' + (cfg.note ? '（' + cfg.note + '）' : '') + '，' + when + '；完成后点「标记已验证」');

    openReactions(p).forEach(function (r) {
      if (r.status === '未处理' && reasons.indexOf('副反应待处理') < 0) { reasons.push('副反应待处理'); details.push('副反应「' + r.site + '」待处理'); }

        var d = daysBetween(r.nextCheckAt, today);
        var label = d > 0 ? ('复查逾期' + d + '天') : '今日复查';
        if (reasons.indexOf(label) < 0) { reasons.push(label); details.push(r.site + ' ' + label + ' ' + fmtDT(r.nextCheckAt)); }
      }
    });
    realFollowups(p).forEach(function (f) {
      if (f.dueDate && f.dueDate <= today && !f.done) { if (reasons.indexOf('随访到期') < 0) { reasons.push('随访到期'); details.push('随访计划到期 ' + dateOnly(f.dueDate)); } }
    });
    if (reasons.length) items.push({ p: p, reasons: reasons, details: details, tags: tags });
  });
  return items;

/* ================= 渲染：框架 ================= */
var view = { page: 'tab', tab: 'ward', pid: null, calY: 0, calM: 0, tlDesc: false, tlOpen: {} };
(function () { var t = new Date(); view.calY = t.getFullYear(); view.calM = t.getMonth() + 1; })();

function render() {
  maybeSnapshot();
  updateDots();
  if (view.page === 'settings') { renderSettingsPage(); return; }
  if (view.page === 'patient') { renderPatientPage(); return; }
  $('btnBack').hidden = true; $('btnData').hidden = false; $('tabbar').hidden = false;
  $('title').textContent = '放疗患者管理';
  if (view.tab === 'todo') renderTodo();
  else if (view.tab === 'cal') renderOverallCal();
  else if (view.tab === 'done') renderDone();
  else renderWard();
  document.querySelectorAll('.tabbar button').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === view.tab); });
}

function updateDots() {
  var t = buildTodo().length;
  $('dotTodo').hidden = !t; if (t) $('dotTodo').textContent = t;
  var un = 0; inTreat().forEach(function (p) { un += unreadReactions(p).length; });
  $('dotWard').hidden = !un; if (un) $('dotWard').textContent = un;
}

function statusChip(s) {
  var cls = { '未处理': 'danger', '已处理待复查': 'warn', '已复查未解除': 'warn', '已解除': 'ok', '长期随访': 'pri' }[s] || '';
  return '<span class="chip ' + cls + '">' + esc(s) + '</span>';
}
function gradeChip(g) { return g ? '<span class="chip danger sm">' + esc(g) + '</span>' : ''; }

/* ================= 日历组件 ================= */
function calHeader(y, m, extraRight) {
  return '<div class="cal-top"><div class="mt">' + y + ' 年 ' + m + ' 月</div><div class="cal-nav">' +
    (extraRight || '') +
    '<button data-act="cal-prev">‹</button><button data-act="cal-today">今天</button><button data-act="cal-next">›</button></div></div>';
}
function calDowRow() {
  return '<div class="cal-grid">' + WD_ORDER.map(function (d) {
    var we = (d === 0 || d === 6);
    return '<div class="cal-dow' + (we ? ' we' : '') + '">' + WEEKDAYS[d].replace('周', '') + '</div>';
  }).join('') + '</div>';
}
/* cells: { 'YYYY-MM-DD': innerHTML } */
function calBody(y, m, cells) {
  var first = new Date(y, m - 1, 1);
  var startDow = first.getDay();
  var lead = WD_ORDER.indexOf(startDow);
  var dim = new Date(y, m, 0).getDate();
  var prevDim = new Date(y, m - 1, 0).getDate();
  var hol = holidays(), mk = makeups(), today = todayStr();
  var h = '<div class="cal-grid">';
  var i, dObj, ds, dow;
  for (i = 0; i < lead; i++) {
    dObj = new Date(y, m - 1, 1 - (lead - i)); ds = dstr(dObj);
    h += '<div class="cal-cell out"><div class="d' + (isWe(dObj) ? ' we' : '') + '">' + dObj.getDate() + '</div></div>';
  }
  for (i = 1; i <= dim; i++) {
    dObj = new Date(y, m - 1, i); ds = dstr(dObj); dow = dObj.getDay();
    var cls = 'cal-cell';
    if (ds === today) cls += ' today';
    if (Object.prototype.hasOwnProperty.call(hol, ds)) cls += ' hol';
    if (Object.prototype.hasOwnProperty.call(mk, ds)) cls += ' mk';
    if (cells[ds] != null) cls += ' clickable';
    h += '<div class="' + cls + '" data-act="cal-day" data-date="' + ds + '">' +
      '<div class="d' + (ds === today ? '' : ((dow === 0 || dow === 6) ? ' we' : '')) + '">' + i + '</div>' +
      (cells[ds] || '') + '</div>';
  }
  var tail = (7 - ((lead + dim) % 7)) % 7;
  for (i = 1; i <= tail; i++) {
    dObj = new Date(y, m - 1, dim + i); ds = dstr(dObj);
    h += '<div class="cal-cell out"><div class="d' + (isWe(dObj) ? ' we' : '') + '">' + dObj.getDate() + '</div></div>';
  }
  return h + '</div>';
}
function isWe(d) { var w = d.getDay(); return w === 0 || w === 6; }

/* ================= 渲染：待办 ================= */
function renderTodo() {
  var items = buildTodo();
  var h = '';
  /* 顶部给一句分类说明，让「为什么只剩这些」一目了然 */
  var cntVerify = items.filter(function (it) { return (it.tags || []).indexOf('验证') >= 0; }).length;
  var cntEnd = items.filter(function (it) { return (it.tags || []).indexOf('即将结束') >= 0; }).length;
  var cntNew = items.filter(function (it) { return (it.tags || []).indexOf('未开始') >= 0; }).length;
  if (items.length) {
    h += '<div class="todo-sum">' +
      (cntNew ? '<span class="ts-i">未开始 ' + cntNew + '</span>' : '') +
      (cntVerify ? '<span class="ts-i">验证 ' + cntVerify + '</span>' : '') +
      (cntEnd ? '<span class="ts-i">即将结束 ' + cntEnd + '</span>' : '') +
      '<span class="ts-i" style="margin-left:auto;color:var(--sub)">共 ' + items.length + ' 位</span></div>';
  }
  if (!items.length) h = '<div class="empty"><span class="big">🎉</span>暂无待办</div>';
  items.forEach(function (it) {
    var vp = (it.tags || []).indexOf('验证') >= 0 ? verifyPending(it.p) : null;
    h += '<div class="card todocard" data-act="open-patient" data-id="' + it.p.id + '">' +
      '<div class="badgebox"><div class="b">' + esc(it.p.name ? it.p.name.slice(0, 2) : '—') + '</div><div class="t">' + esc(it.p.mrn || '') + '</div></div>' +
      '<div class="pbody"><div class="line1"><span class="pname">' + esc(it.p.name) + '</span><span class="chip">' + esc(it.p.status) + '</span></div>' +
      '<div class="pdiag">' + esc(it.p.diagnosis || '') + '</div>' +
      '<div class="todo-reasons">' + it.reasons.map(function (r) { return '<span class="chip warn">' + esc(r) + '</span>'; }).join('') + '</div>' +
      (it.details.length ? '<div class="hint">' + esc(it.details.join('；')) + '</div>' : '') +
      (vp ? '<div class="todo-acts"><button class="btn sm" data-act="verify-done" data-id="' + it.p.id + '" data-n="' + vp.n + '" onclick="event.stopPropagation()">✓ 标记第 ' + vp.n + ' 次已验证</button>' +
        '<button class="btn sm" data-act="verify-edit" data-id="' + it.p.id + '" onclick="event.stopPropagation()">修改</button></div>' : '') +
      '</div></div>';
  });
  $('view').innerHTML = h + '<div style="height:60px"></div>';
}

/* ================= 渲染：在治 ================= */
function renderWard() {
  var list = inTreat();
  var h = '<div class="section-title">在治患者 · ' + list.length + ' 位' +
    '<span style="display:flex;gap:6px">' +
    '<button class="btn sm" data-act="ai-import">✨ AI 导入</button>' +
    '<button class="btn sm addbtn" data-act="add-patient">＋ 添加</button></span></div>';
  if (!list.length) h += '<div class="empty"><span class="big">🏥</span>暂无在治患者<br>点右上角「添加患者」开始</div>';
  list.forEach(function (p) {
    var un = unreadReactions(p).length;
    /* 分母统一用 plannedCount（实际排出的次数，含加量），与患者详情页口径一致（BUG-06） */
    var tot = plannedCount(p);
    var boost = parseInt(p.boostFractions, 10) || 0;
    var dn = doneCount(p);
    var prog = tot ? Math.round(dn / tot * 100) : 0;
    var end = scheduleEnd(p);
    var pa = inPause(p, todayStr()) ? pauseOn(p, todayStr()) : null;
    h += '<div class="card pcard" data-act="open-patient" data-id="' + p.id + '">' +
      '<div class="badgebox"><div class="b">' + esc(p.name ? p.name.slice(0, 2) : '—') + '</div><div class="t">' + esc(p.mrn || '') + '</div></div>' +
      '<div class="pbody"><div class="line1"><span class="pname">' + esc(p.name) + '</span>' +
      (p.sex ? '<span class="chip sm">' + esc(p.sex) + '</span>' : '') +
      (p.age ? '<span class="chip sm">' + esc(p.age) + '岁</span>' : '') +
      (pa ? '<span class="chip warn sm">中断中</span>' : '') +
      (p.stopDate ? '<span class="chip danger sm">已终止</span>' : '') +
      (boost ? '<span class="chip sm">＋加量' + boost + '</span>' : '') +
      (un ? '<span class="count">' + un + '</span>' : '') + '</div>' +
      '<div class="pdiag">' + esc(p.diagnosis || '') + '</div>' +
      (p.planStatus && p.planStatus !== '已通过' ? '<div class="pmeta">流程：<b>' + esc(p.planStatus) + '</b></div>' :
        (tot ? '<div class="pmeta">治疗 <b>' + dn + '/' + tot + '</b> 次 · 累计 <b>' + accumulatedDose(p).toFixed(1) + '</b> Gy' +
          (end ? ' · ' + (p.stopDate ? '已止于 ' : '预计 ') + '<b>' + mdLabel(end) + '</b>' + (p.stopDate ? '' : ' 结束') : '') +
          '<div class="progress' + (prog >= 95 ? ' warn' : '') + '"><div class="fill" style="width:' + Math.min(100, prog) + '%"></div></div></div>'
          : '<div class="pmeta">' + (p.startDate ? '未填总次数' : '未排程（缺开始日期）') + '</div>')) +
      (pa ? '<div class="pmeta" style="color:var(--warn)">中断：' + esc(pa.reason || '') + '（至 ' + mdLabel(pa.to) + '）</div>' : '') +
      '</div></div>';
  });
  $('view').innerHTML = h + '<div style="height:60px"></div>';
}

/* ================= 渲染：总体日历 ================= */
function renderOverallCal() {
  var y = view.calY, m = view.calM;
  var list = inTreat();
  var byDate = {};
  list.forEach(function (p) {
    computeSchedule(p).forEach(function (it) {
      (byDate[it.date] = byDate[it.date] || []).push({ p: p, it: it });
    });
  });
  var cells = {};
  Object.keys(byDate).forEach(function (ds) {
    var arr = byDate[ds];
    var dn = arr.filter(function (a) { return a.it.done; }).length;
    var st = dayStat(ds);
    cells[ds] = calStatBadges(st) +
      (dn ? '<div class="tagline done">已完成 ' + dn + '</div>' : '<div class="tagline">待治疗</div>');
  });
  /* 有「开始/结束」但没有当天治疗的日期（例如疗程首日恰逢休息日、或已归档患者的末日），
     也要可点击查看名单 —— 否则标注画得出来却点不开 */
  monthDays(y, m).forEach(function (ds) {
    if (cells[ds] != null) return;
    var st = dayStat(ds);
    if (dayStatHas(st)) cells[ds] = calStatBadges(st);
  });
  var monthTotal = 0, monthDone = 0;
  Object.keys(byDate).forEach(function (ds) {
    if (ds.slice(0, 7) === y + '-' + pad2(m)) { monthTotal += byDate[ds].length; monthDone += byDate[ds].filter(function (a) { return a.it.done; }).length; }
  });
  var allMiss = {};
  list.forEach(function (pp) { missingHolidayYears(pp.startDate, scheduleEnd(pp)).forEach(function (y) { allMiss[y] = 1; }); });
  var missList = Object.keys(allMiss).sort();
  var monthStat = calMonthStat(y, m);
  var h = '<div class="section-title">治疗总日历 · 在治 ' + list.length + ' 位</div>';
  if (missList.length) h += '<div class="hint" style="padding:8px 10px;background:var(--warn-soft);border-radius:8px;margin-bottom:8px;line-height:1.7">⚠ 部分患者排程涉及 <b>' + missList.join('、') + ' 年</b>，该年暂无节假日数据，已按「周一~周五 + 周末」估算。可在「设置」补录。</div>';
  h += '<div class="cal-wrap">' +
    calHeader(y, m, '<span class="chip sm">本月 ' + monthDone + '/' + monthTotal + '</span>') +
    calDowRow() + calBody(y, m, cells) +
    (calMonthStatHas(monthStat)
      ? '<div class="month-stat"><span class="ms-i"><i class="b-start"></i>本月开始 ' + monthStat.starting + ' 人</span>' +
        '<span class="ms-i"><i class="b-end"></i>本月结束 ' + monthStat.ending + ' 人</span>' +
        '<span class="ms-i"><i class="b-treat"></i>本月治疗 ' + monthStat.treating + ' 人次</span></div>'
      : '') +
    '<div class="cal-legend">' +
    '<span><i style="background:#e5f3f1"></i>有治疗安排</span>' +
    '<span><i style="background:#fdecea"></i>法定节假日</span>' +
    '<span><i style="background:#fdf0e0"></i>调休上班</span>' +
    '<span><i style="background:#fff;border:1px solid #0f766e"></i>今天</span>' +
    '<span><i style="background:#e3f0fd"></i>始＝开始放疗</span>' +
    '<span><i style="background:#fde8e4"></i>终＝放疗结束</span></div>' +
    '<div class="hint" style="margin-top:6px">点日期看当天名单与「开始 / 结束」详情</div>' +
    '</div>';
  if (!list.length) h += '<div class="empty"><span class="big">📅</span>暂无在治患者</div>';

  /* 近期日程速览 */
  var upcoming = [];
  Object.keys(byDate).sort().forEach(function (ds) {
    if (ds >= todayStr() && daysBetween(todayStr(), ds) <= 14) {
      byDate[ds].forEach(function (a) { upcoming.push({ date: ds, p: a.p, it: a.it }); });
    }
  });
  if (upcoming.length) {
    h += '<div class="section-title">未来 14 天日程 · ' + upcoming.length + ' 人次</div>';
    var g = {};
    upcoming.forEach(function (u) { (g[u.date] = g[u.date] || []).push(u); });
    Object.keys(g).forEach(function (ds) {
      h += '<div class="card"><div class="line1" style="margin-bottom:6px"><b>' + mdLabel(ds) + ' ' + WEEKDAYS[parseD(ds).getDay()] + '</b>' +
        '<span class="chip sm">' + g[ds].length + ' 人</span></div>' +
        g[ds].map(function (u) {
          return '<div class="cal-day-list"><div class="row"><span class="nm"><b>' + esc(u.p.name) + '</b>' +
            '<span class="sub2"> 第 ' + u.it.fraction + ' 次' + (u.it.extra ? ' · 加照' : '') + '</span></span>' +
            (u.it.done ? '<span class="chip ok sm">已完成</span>' : '<span class="chip sm">待治疗</span>') + '</div></div>';
        }).join('') + '</div>';
    });
  }
  $('view').innerHTML = h + '<div style="height:60px"></div>';
}

/* ================= 渲染：完成 / 随访 ================= */

/* ================= 渲染：患者详情 ================= */

      '<button class="btn sm" data-act="add-boost">' + (boost ? '改加量（现有 ' + boost + ' 次）' : '＋ 加量') + '</button>' +
      (p.stopDate
        ? '<button class="btn sm" data-act="cancel-stop">取消终止（恢复原计划）</button>'
        : '<button class="btn sm danger" data-act="add-stop">提前终止</button>') +
      (p.pauses && p.pauses.length ? '<button class="btn sm" data-act="list-pauses">查看中断（' + p.pauses.length + '）</button>' : '') +
      (p.extras && p.extras.length ? '<button class="btn sm" data-act="list-extras">查看加照（' + p.extras.length + '）</button>' : '') +
      '</div></div>';

    /* 个人日历 */
    var y = view.calY, m = view.calM;
    var byDate = {};
    sched.forEach(function (x) { byDate[x.date] = x; });
    var cells = {};
    var firstDay = sched.length ? sched[0].date : '';
    var lastDay = sched.length ? sched[sched.length - 1].date : '';
    Object.keys(byDate).forEach(function (ds) {
      var x = byDate[ds];
      var cls = x.extra ? 'extra' : (x.boost ? 'boost' : (x.done ? 'done' : ''));
      var mark = (ds === firstDay ? '<span class="statrow"><span class="b-start">始</span></span>' : '') +
        (ds === lastDay && lastDay !== firstDay ? '<span class="statrow"><span class="b-end">终</span></span>' : '');
      cells[ds] = '<div class="tagline ' + cls + '">第' + x.fraction + '次' + (x.done ? '✓' : '') + (x.boost ? '＋' : '') + '</div>' + mark;
    });
    /* 中断区间：按天标记（中断日本就不排治疗，故不能要求 byDate[ds] 存在 —— BUG-12） */
    (p.pauses || []).forEach(function (pa) {
      var a = parseD(pa.from), b = parseD(pa.to);
      if (!a || !b || b < a) return;
      var monthPre = y + '-' + pad2(m);
      /* 裁剪到本月，避免长区间做无谓循环 */
      var start = dstr(a).slice(0, 7) < monthPre ? new Date(y, m - 1, 1) : new Date(a);
      var lastDay = new Date(y, m, 0);
      var end = dstr(b).slice(0, 7) > monthPre ? lastDay : new Date(b);
      for (var d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
        var ds = dstr(d);
        if (ds.slice(0, 7) !== monthPre) continue;
        /* 已排治疗日不覆盖（正常不会出现），其余标为「停」 */
        cells[ds] = '<div class="tagline pause">停</div>';
      }
    });
    var monthPre2 = y + '-' + pad2(m) + '-';
    var mTreat = 0, mStart = 0, mEnd = 0;
    Object.keys(cells).forEach(function (ds) {
      if (ds.slice(0, 7) !== monthPre2.slice(0, 7)) return;
      if (byDate[ds]) mTreat++;
      if (ds === firstDay) mStart = 1;
      if (ds === lastDay && lastDay !== firstDay) mEnd = 1;
    });
    h += '<div class="cal-wrap">' + calHeader(y, m) + calDowRow() + calBody(y, m, cells) +
      (mStart ? '<div class="hint s-start" style="margin-top:6px;padding:6px 9px;border-radius:8px;background:#e3f0fd;color:#1d5fa8">▶ 本月 <b>' + mdLabel(firstDay) + '</b> 开始放疗（' + WEEKDAYS[parseD(firstDay).getDay()] + '）</div>' : '') +
      (mEnd ? '<div class="hint s-end" style="margin-top:6px;padding:6px 9px;border-radius:8px;background:#fde8e4;color:#b3261e">■ 本月 <b>' + mdLabel(lastDay) + '</b> 放疗结束（' + WEEKDAYS[parseD(lastDay).getDay()] + '）</div>' : '') +
      '<div class="cal-legend"><span><i style="background:#e5f3f1"></i>待治疗</span><span><i style="background:#e5f3f1;opacity:.6"></i>已完成</span>' +
      '<span><i style="background:#fdf0e0"></i>加照</span><span><i style="background:#EEEDFE"></i>加量</span><span><i style="background:#eef1f5"></i>中断</span>' +
      '<span><i style="background:#e3f0fd"></i>始＝开始放疗</span><span><i style="background:#fde8e4"></i>终＝放疗结束</span></div>' +
      '<div class="hint" style="margin-top:6px">点日历上的治疗日可登记「本次未做」或加照</div></div>';
  }

  /* 副反应 */
  h += '<div class="card"><div class="section-title">副反应追踪 ' +
    '<button class="btn sm addbtn" data-act="add-reaction">＋ 记录副反应</button></div>';
  var rs = (p.reactions || []).slice().sort(function (a, b) { return String(b.foundAt).localeCompare(String(a.foundAt)); });
  if (!rs.length) h += '<div class="hint">暂无副反应记录</div>';
  rs.forEach(function (r) {
    h += '<div class="event"><div class="head">' + gradeChip(r.grade) + '<span class="chip pri">' + esc(r.site) + '</span>' + statusChip(r.status) + '</div>' +
      '<div class="content">' + esc(r.content || '') + '</div>' +
      '<div class="t">发现 ' + fmtDT(r.foundAt) + (r.nextCheckAt ? ' · 计划复查 ' + fmtDT(r.nextCheckAt) : '') + '</div>' +
      (r.plan ? '<div class="blk"><div class="blk-t">处理</div>' + esc(r.plan) + (r.planAt ? '（' + fmtDT(r.planAt) + '）' : '') + '</div>' : '') +
      (r.followups || []).map(function (f) { return '<div class="fu"><span class="fut">' + fmtDT(f.at) + '</span><span class="fuc">' + esc(f.content) + '</span></div>'; }).join('') +
      '<div class="acts"><button class="btn sm" data-act="reaction-plan" data-id="' + r.id + '">处理</button>' +
      '<button class="btn sm" data-act="reaction-follow" data-id="' + r.id + '">追踪</button>' +
      '<button class="btn sm" data-act="reaction-edit" data-id="' + r.id + '">编辑</button>' +
      '<button class="btn sm danger" data-act="reaction-del" data-id="' + r.id + '">删除</button></div></div>';
  });
  h += '</div>';

  /* 随访：以「放疗结束日」为第 0 个月推算到期日 */
  var realFu = (p.followupPlans || []).filter(function (f) { return f.baseDate !== 'TEMPLATE'; });
  var pend = pendingFollowups(p).sort(function (a, b) { return String(a.dueDate).localeCompare(String(b.dueDate)); });
  var doneFu = realFu.filter(function (f) { return f.done; }).sort(function (a, b) { return String(b.doneAt).localeCompare(String(a.doneAt)); });
  var nxt = pend[0] || null;
  var fprog = followupProgress(p);
  var fbase = followupBase(p);
  var tEnd = treatmentEndOf(p);

  h += '<div class="card"><div class="section-title">随访管理 ' +
    (fprog.total ? '<span class="chip sm">已随访 ' + fprog.done + '/' + fprog.total + ' 次</span>' : '<span class="chip sm">未设定</span>') +
    '</div>' +
    '<div class="hint" style="margin-bottom:8px;line-height:1.7">' +
    (tEnd
      ? '起算：放疗结束日 <b>' + dateOnly(tEnd) + '</b>（' + treatmentEndNote(p) + '）'
      : '该患者尚无排程，随访起算日请在模板中手动指定') +
    '。到期日按时长自动推算，完成一次后可继续排下一次。</div>' +
    (nxt ? (function () {
      var over = daysBetween(nxt.dueDate, todayStr());     /* >0 表示已逾期 */
      var left = daysBetween(todayStr(), nxt.dueDate);
      var badge = over > 0 ? '<span class="chip danger">逾期 ' + over + ' 天</span>'
        : (nxt.dueDate === todayStr() ? '<span class="chip danger">今日到期</span>'
          : '<span class="chip warn">还有 ' + left + ' 天</span>');
      return '<div class="event" style="border-color:var(--pri)"><div class="head"><span class="chip pri">下一次随访</span>' +
        badge + '<span class="chip sm">放疗后 ' + esc(intervalText(nxt.offsetN, nxt.offsetUnit)) + '</span></div>' +
        '<div class="content">' + dateOnly(nxt.dueDate) + (nxt.note ? ' · ' + esc(nxt.note) : '') + '</div>' +
        '<div class="acts"><button class="btn sm primary" data-act="followup-done" data-id="' + nxt.id + '">完成本次</button>' +
        '<button class="btn sm" data-act="followup-edit" data-id="' + nxt.id + '">改间隔</button>' +
        '<button class="btn sm" data-act="followup-del" data-id="' + nxt.id + '">删除</button></div></div>';
    })()
      : '<div class="hint" style="padding:6px 0">' +
      (realFu.length ? '全部随访已完成' + (fprog.total ? '（共 ' + fprog.total + ' 次）' : '') : '尚未设定随访模板，点下方按钮按病种一键生成') + '</div>') +
    '<div class="btnrow">' +
    '<button class="btn sm addbtn" data-act="followup-template">' + (realFu.length ? '修改随访模板 / 重新排期' : '设定随访模板（按病种）') + '</button>' +
    '<button class="btn sm" data-act="add-followup">＋ 单次随访</button>' +
    (pend.length > 1 ? '<button class="btn sm" data-act="followup-all">全部随访（' + pend.length + '）</button>' : '') +
    (doneFu.length ? '<button class="btn sm" data-act="followup-history">随访历史（' + doneFu.length + '）</button>' : '') +
    '</div></div>';

  if (pend.length > 1) {
    h += '<div class="card"><div class="section-title">后续随访安排</div>';
    pend.slice(1).forEach(function (f) {
      h += '<div class="event"><div class="head"><span class="chip warn">待随访</span>' +
        '<span class="chip sm">' + esc(intervalText(f.offsetN, f.offsetUnit)) + '</span></div>' +
        '<div class="content" style="font-weight:400">' + dateOnly(f.dueDate) + (f.note ? ' · ' + esc(f.note) : '') + '</div>' +
        '<div class="acts"><button class="btn sm" data-act="followup-done" data-id="' + f.id + '">完成本次</button>' +
        '<button class="btn sm" data-act="followup-edit" data-id="' + f.id + '">改间隔</button>' +
        '<button class="btn sm danger" data-act="followup-del" data-id="' + f.id + '">删除</button></div></div>';
    });
    h += '</div>';
  }

  /* 备注 / 交班记录（之前只有 schema 没有界面，数据只能靠合并导入悄悄累积） */
  var noteList = (p.notes || []).slice().sort(function (a, b) { return String(b.at).localeCompare(String(a.at)); });
  h += '<div class="section-title">备注 / 交班记录' + (noteList.length ? '（' + noteList.length + '）' : '') + '</div>';
  if (noteList.length) {
    noteList.forEach(function (n) {
      h += '<div class="event"><div class="head"><span class="chip sm">' + esc(fmtDT(n.at) || '未记时间') + '</span></div>' +
        '<div class="content" style="font-weight:400">' + esc(n.content || '') + '</div>' +
        '<div class="acts"><button class="btn sm" data-act="note-add" data-id="' + n.id + '">编辑</button>' +
        '<button class="btn sm danger" data-act="note-del" data-id="' + n.id + '">删除</button></div></div>';
    });
  } else {
    h += '<div class="hint" style="padding:0 2px 8px">暂无备注，可记录交班事项、患者主诉、特殊情况等。</div>';
  }
  h += '<div class="btnrow" style="margin:0 2px"><button class="btn sm addbtn" data-act="note-add">＋ 添加备注</button></div>';

  /* 状态操作：在治→完成/失访；已完成→转回在治；失访→转回在治 */
  h += '<div class="btnrow" style="margin:12px 2px"><button class="btn" data-act="edit-patient">编辑患者信息</button>' +
    (p.status === '在治'
      ? '<button class="btn" data-act="complete-patient">完成治疗</button>' +
      '<button class="btn" data-act="lost-patient">标记失访</button>'
      : '<button class="btn" data-act="reopen-patient">转回在治</button>') +
    '<button class="btn danger" data-act="delete-patient">删除</button></div>';

  $('view').innerHTML = h + '<div style="height:40px"></div>';

  /* 打开详情页即视为已查看其副反应，消除「未读」红点（BUG-04） */
  if (markReactionsRead(p)) updateDots();
}

/* 把该患者的未读副反应标记为已读；有变化时返回条数并保存 */
function markReactionsRead(p) {
  var n = 0;
  openReactions(p).forEach(function (r) { if (!r.readAt) { r.readAt = nowLocalInput(); n++; } });
  if (n && !loadError) save();
  return n;
}

/* ================= 渲染：设置 ================= */
function renderSettingsPage() {
  /* 设置是全局语境，不带患者上下文；清空 pid 以免「套用模板」误改上一位患者（BUG-07） */
  view.pid = null;
  $('btnBack').hidden = false; $('btnData').hidden = true; $('tabbar').hidden = true;
  $('title').textContent = '设置';
  var bytes = 0; try { bytes = (localStorage.getItem(LS_KEY) || '').length; } catch (e) { }
  var evCount = 0, openCount = 0;
  state.patients.forEach(function (p) { evCount += (p.reactions || []).length; openCount += openReactions(p).length; });
  var hol = holidays(), mk = makeups();
  var holDates = Object.keys(hol).sort();
  var mkDates = Object.keys(mk).sort();
  var h = '';
  h += '<div class="setgrp">' +
    setRow('export-csv', '📊', '导出 CSV（交班摘要＋治疗日程）', '可用 Excel/WPS 打开，转发到微信') +
    setRow('export-json', '💾', '导出完整备份（JSON）', '用于跨设备同步、换手机、升级前备份') +
    setRow('import-json', '📥', '导入备份（合并 / 覆盖）', '推荐「合并」：两边新增的患者都会保留') +
    '</div>';
  h += '<div class="setgrp">' +
    setRow('sync-panel', '☁️', '云同步（加密存到 GitHub）', syncSubText()) +
    /* 未配置云同步时不显示，避免误导（没有 Token/密码，自动同步无从执行） */
    (syncHasToken() ? setRow('autosync-panel', '⏱', '定时自动同步', autoSyncSubText()) : '') +
    '</div>';
  h += '<div class="setgrp">' +
    setRow('ai-config', '✨', 'AI 识别设置',
      aiReady() ? ('已配置 · ' + aiProviderPreset(aiConfig().provider).name + ' · ' + aiConfig().model)
        : '未配置 · 用于批量导入患者（支持文字与图片）') +
    setRow('tpl-settings', '📋', '随访模板库',
      followupTemplates().length + ' 个可用' +
      (Object.keys(tplOverride()).length ? '（含自建/改动）' : '') + ' · 增删与自定义') +
    '</div>';
  h += '<div class="setgrp">' +
    setRow('treat-days', '📅', '默认治疗日', '每周：' + treatDaysCfg().map(function (d) { return WEEKDAYS[d]; }).join('、')) +
    setRow('toggle-makeup', '🔁', '调休上班日安排治疗', (makeupAsWorkday() ? '已开启' : '已关闭') + ' · 仅对「周一~周五」整周方案生效') +
    '</div>';
  var covYears = coveredYears();
  var thisY = new Date().getFullYear();
  var missY = [];
  for (var yy = 2025; yy <= thisY + 1; yy++) if (covYears.indexOf(String(yy)) < 0) missY.push(yy);

  /* 节假日明细很长（两年共 60+ 天），设置页只放摘要，点进去管理 */
  h += '<div class="setgrp">' +
    setRow('hol-manage', '🎌', '法定节假日',
      (holDates.length ? '已录入 ' + covYears.join('、') + ' 年 · ' + holDates.length + ' 天' : '暂无数据') + ' · 点击管理') +
    setRow('mk-manage', '📅', '调休上班日', mkDates.length + ' 天 · 点击管理') +
    '</div>';
  if (missY.length) {
    h += '<div class="hint" style="padding:9px 12px;background:var(--warn-soft);border-radius:10px;margin:-4px 0 12px;line-height:1.7">' +
      '⚠ ' + missY.join('、') + ' 年暂无节假日数据，将按「周一~周五 + 周末休息」排程（不跳假期）。' +
      '国务院通常于前一年 11 月公布次年安排，届时可在此补录。</div>';
  }
  h += '<div class="section-title">数据概况</div><div class="setgrp">' +
    '<div class="setrow" style="cursor:default"><div class="n">在治患者<div class="sub2">归档 ' + completed().length + ' 位</div></div><div>' + inTreat().length + ' 位</div></div>' +
    '<div class="setrow" style="cursor:default"><div class="n">副反应记录<div class="sub2">其中未闭环 ' + openCount + ' 条</div></div><div>' + evCount + ' 条</div></div>' +
    '<div class="setrow" style="cursor:default"><div class="n">占用存储<div class="sub2">数据只在本机，不会上传</div></div><div>' + (bytes / 1024).toFixed(1) + ' KB</div></div>' +
    '<div class="setrow" style="cursor:default"><div class="n">数据格式<div class="sub2">' + (loadError ? '⚠ 读取异常，已暂停保存' : '正常') + '</div></div><div>v' + SCHEMA_VERSION + '</div></div>' +
    '<div class="setrow" style="cursor:default"><div class="n">版本</div><div>v' + APP_VERSION + '</div></div>' +
    '</div>';
  h += '<div class="setgrp">' +
    setRow('selftest', '🧪', '运行自检', '检查存储、排程规则是否正常') +
    setRow('demo-data', '🧩', '载入示例数据（试用/演示）', '会清空当前数据，预置 5 位患者') +

  var bks = backupKeys();
  if (bks.length) {
    h += '<div class="section-title">更新前自动备份（' + bks.length + ' 份）</div><div class="setgrp">';
    bks.slice().reverse().forEach(function (k) {
      var label = k.replace(BACKUP_PREFIX, '').replace('.', ' · ');
      h += '<div class="setrow" data-act="restore-backup" data-key="' + esc(k) + '">' +
        '<div class="n">' + esc(label) + '<div class="sub2">点一下用这份备份覆盖当前数据（用于回退）</div></div><div class="arw">›</div></div>';
    });
    h += '</div>';
  }
  var sns = snapKeys();
  if (sns.length) {
    h += '<div class="section-title">每日自动快照（' + sns.length + ' 份 · 最多保留 ' + SNAP_KEEP + ' 天）</div><div class="setgrp">';
    sns.forEach(function (k) {
      var label = k.replace(SNAP_PREFIX, '');
      var cnt = 0;
      try { cnt = (JSON.parse(localStorage.getItem(k) || '{}').patients || []).length; } catch (e) { }
      h += '<div class="setrow" data-act="restore-snap" data-key="' + esc(k) + '">' +
        '<div class="n">' + esc(label) + '<div class="sub2">' + cnt + ' 位患者的当日存档 · 点一下回退到这天的数据</div></div><div class="arw">›</div></div>';
    });
    h += '</div>';
  }
  h += '<div class="setgrp">' +
    (loadError ? setRow('export-raw', '🚑', '数据读取异常 · 导出原始数据', '原数据仍在本机，请先导出保存') : '') +
    setRow('clear-all', '🗑️', '清空全部数据', '不可恢复，请先导出备份') +
    '</div>';
  h += '<div class="hint" style="padding:0 4px 20px">提示：请从手机桌面图标打开使用；不同浏览器打开是各自独立的数据。</div>';
  $('view').innerHTML = h;
}
function setRow(act, ico, title, sub) {
  return '<div class="setrow" data-act="' + act + '"><div style="font-size:20px">' + ico + '</div><div class="n">' + esc(title) + (sub ? '<div class="sub2">' + esc(sub) + '</div>' : '') + '</div><div class="arw">›</div></div>';
}
/* 按年份分组：{ '2026': ['2026-01-01', ...] } */
function groupByYear(dates) {
  var g = {};
  (dates || []).forEach(function (d) { var y = d.slice(0, 4); (g[y] = g[y] || []).push(d); });
  return g;
}

/* ================= 弹层 =================
   底部操作区（sh-foot）固定在弹层底部，不随内容滚动：
   - 普通表单：显示「取消 / 保存」
   - 操作型弹层：传 actions 数组，按钮始终可见可点（内容再长也不用滚动去找） */
var sheetCtx = null;
var reopenSheet = null;

function sheetActionsHtml(actions) {
  return actions.map(function (a) {
    var cls = 'btn' + (a.primary ? ' primary' : '') + (a.danger ? ' danger' : '') + (a.full ? ' full' : '');
    var attrs = ' data-act="' + esc(a.act) + '"';
    if (a.id) attrs += ' data-id="' + esc(a.id) + '"';
    if (a.date) attrs += ' data-date="' + esc(a.date) + '"';
    if (a.key) attrs += ' data-key="' + esc(a.key) + '"';
    return '<button class="' + cls + '"' + attrs + (a.disabled ? ' disabled' : '') + '>' + esc(a.label) + '</button>';
  }).join('');
}

function openSheet(o) {
  sheetCtx = o;
  $('sheetTitle').textContent = o.title || '';
  $('sheetBody').innerHTML = o.body || '';

  var foot = $('sheetFoot');
  if (o.actions && o.actions.length) {
    /* 操作型弹层：按钮固定在底部 */
    $('sheetFootInner').innerHTML = sheetActionsHtml(o.actions);
    foot.hidden = false;
  } else {
    /* 普通表单：取消 / 保存 */
    $('sheetFootInner').innerHTML =
      '<button class="btn" id="sheetCancel">取消</button>' +
      '<button class="btn primary" id="sheetOk">' + esc(o.okText || '保存') + '</button>';
    $('sheetOk').onclick = function () {
      var v = sheetValues();
      if (o.onSave && o.onSave(v) === false) return;
      closeSheet(false);
    };
    $('sheetCancel').onclick = function () { closeSheet(true); };
    foot.hidden = !!o.hideOk;
  }
  $('sheetClose').onclick = function () { closeSheet(true); };
  $('mask').hidden = false;
  requestAnimationFrame(function () { $('mask').classList.add('show'); $('sheet').classList.add('show'); });
  if (o.afterRender) o.afterRender();
}
function closeSheet() { reopenSheet = null; $('mask').classList.remove('show'); $('sheet').classList.remove('show'); setTimeout(function () { $('mask').hidden = true; sheetCtx = null; }, 220); }
function sheetValues() {

  document.querySelectorAll('#sheetBody [name]').forEach(function (el) {
